<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 固定論理解像度のステージを画面に合わせて等倍率で拡大縮小。余白は背景SVGのぼかし複製で埋める。 */
:root{
  --night:#14102e; --dusk:#2a2150; --veil:rgba(20,16,50,.88);
  --rose:#e0708f; --rose2:#a73f6b; --gold:#d9b36a; --cream:#f6ecff; --ink:#160f2a;
  --font-serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','MS PMincho',serif;
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font-ui);overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;inset:0;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none}
#bgfill{position:absolute;inset:-6%;filter:blur(28px) brightness(.42)}
#bgfill svg{width:100%;height:100%;display:block}
#stage{position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:#2a2a5e;box-shadow:0 0 40px rgba(0,0,0,.6)}
#stage *{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* --- stage layers --- */
#bg{position:absolute;inset:0;z-index:0}
#bg svg{width:100%;height:100%;display:block}
.petal{fill:#f7b6cc;opacity:.85;animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translate(0,-80px) rotate(0)}to{transform:translate(-420px,1020px) rotate(540deg)}}
#veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(255,196,226,.82),rgba(255,140,200,.62));opacity:0;transition:opacity 1.2s;pointer-events:none}
.pink #veil{opacity:1}
#cast{position:absolute;inset:0;z-index:5;pointer-events:none}
.char{position:absolute;bottom:0}
.char svg{height:100%;width:auto;display:block;overflow:visible;filter:drop-shadow(3px 0 0 rgba(255,168,110,.6))}
.char .sil{fill:var(--ink)}
.char .hair{fill:#2b1d48}
.char .ln{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
#girl .p-happy,#girl.happy .p-cry{display:none}
#girl.happy .p-happy{display:inline}
#girl.happy svg{filter:drop-shadow(0 0 7px #ff8fc8) drop-shadow(0 0 16px #ffc2e2)}
#girl.cry svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.tear{fill:#9bd1ff;animation:tear 1.2s ease-in infinite}
.tear.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
#boy .p-reach,#boy.reach .p-norm{display:none}
#boy.reach .p-reach{display:inline}
#sparks{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.sp{position:absolute;bottom:-20px;color:#fff;text-shadow:0 0 8px #ffd9ee;animation:rise linear forwards;opacity:0}
.sp.b{border:2px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,255,255,.18);text-shadow:none}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-640px) scale(1.1);opacity:0}}
#dim{position:absolute;inset:0;z-index:9;background:rgba(10,6,30,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#dim.on{opacity:1}
/* gacha card */
#gacha{position:absolute;z-index:12;left:50%;transform:translateX(-50%);perspective:900px;cursor:pointer}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.44);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.shake{animation:shake .45s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.6)}
.face.back{background:repeating-linear-gradient(45deg,#2c2160 0 12px,#3d2d7c 12px 24px);display:grid;place-items:center;font:800 calc(var(--cw)*.55)/1 var(--font-serif);color:var(--gold);text-shadow:0 0 18px rgba(217,179,106,.7)}
.face.front{transform:rotateY(180deg);background:#fbf4ea;color:#2a2038;display:flex;flex-direction:column;--rc:#8b97a8}
.face.front.ur{background:linear-gradient(160deg,#1a1224,#2d1020);color:#f6ecff}
.face.front{border-color:var(--rc)}
.rband{background:var(--rc);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font:700 calc(var(--cw)*.075)/1.2 var(--font-ui);letter-spacing:.06em}
.rband b{font-family:var(--font-serif);font-size:1.25em}
.cfl{flex:1;min-height:0;padding:4px 10px 0}
.cfl svg{width:100%;height:100%;display:block}
.cname{text-align:center;font:800 calc(var(--cw)*.105)/1.2 var(--font-serif);padding:0 6px}
.ckana{text-align:center;font:500 calc(var(--cw)*.062)/1.3 var(--font-serif);opacity:.75;padding:0 8px 2px}
.cm{font:500 calc(var(--cw)*.062)/1.45 var(--font-serif);padding:4px 8px 8px;text-align:center;border-top:1px dashed rgba(128,128,128,.5);margin:0 8px}
.oddtag{position:absolute;right:-26px;top:20px;background:var(--gold);color:#2a2038;font:800 calc(var(--cw)*.06)/1 var(--font-ui);padding:3px 30px;transform:rotate(38deg);letter-spacing:.1em}
.stars{letter-spacing:1px;font-size:.9em}
/* choices */
#choices{position:absolute;z-index:14;left:0;right:0;top:var(--chTop);display:flex;flex-direction:column;align-items:center;gap:12px}
.band{width:70%;border:0;background:linear-gradient(90deg,transparent,rgba(24,18,60,.9) 14%,rgba(24,18,60,.9) 86%,transparent);color:var(--cream);font:600 var(--chFs)/1.3 var(--font-serif);padding:14px 10px;cursor:pointer;border-top:1px solid rgba(217,179,106,.45);border-bottom:1px solid rgba(217,179,106,.45);letter-spacing:.08em;transition:transform .15s}
.band:hover,.band:focus{transform:scale(1.03);color:#fff;background:linear-gradient(90deg,transparent,rgba(120,40,90,.92) 14%,rgba(120,40,90,.92) 86%,transparent)}
.band:hover::before,.band:focus::before{content:'❀ ';color:var(--gold)}
.band:hover::after,.band:focus::after{content:' ❀';color:var(--gold)}
/* textbox */
#tb{position:absolute;z-index:16;left:6%;width:88%;bottom:var(--tbBottom);height:var(--tbH);background:rgba(18,13,48,.84);border:1.5px solid var(--gold);padding:var(--tbPad);cursor:pointer;outline:none;color:var(--cream);box-shadow:0 0 0 3px rgba(18,13,48,.5),0 8px 24px rgba(0,0,0,.45)}
#tb::before,#tb::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--gold)}
#tb::before{left:-6px;top:-6px;border-right:0;border-bottom:0}
#tb::after{right:-6px;bottom:-6px;border-left:0;border-top:0}
#tbName{position:absolute;left:22px;top:-19px;background:linear-gradient(90deg,var(--rose2),var(--rose));color:#fff;padding:3px 22px;font:700 var(--nameFs)/1.4 var(--font-serif);letter-spacing:.3em;border:1px solid var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.4)}
#tbText{font:500 var(--tbFs)/1.7 var(--font-serif);letter-spacing:.04em;white-space:pre-wrap;overflow:hidden;height:100%}
#tb.nar #tbText{color:#d9cdea;font-style:normal}
#tb.big #tbText{font-size:calc(var(--tbFs)*2.2);font-weight:800;text-align:center;color:#ffe6f2;text-shadow:0 0 16px #ff8fc8;line-height:1.3;padding-top:.1em}
#arrow{position:absolute;right:16px;bottom:8px;color:var(--gold);animation:arr .8s ease-in-out infinite;font-size:16px}
@keyframes arr{50%{transform:translateY(5px)}}
#ctrl{position:absolute;z-index:17;left:6%;width:88%;bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#mode{display:none!important;font:500 11px/1 var(--font-ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:5px 8px;border-radius:10px;white-space:nowrap}
#ctrlBtns{display:flex;gap:5px}
#ctrl button{white-space:nowrap;font:500 12px/1 var(--font-ui);padding:6px 10px;border-radius:12px;border:1px solid rgba(217,179,106,.6);background:rgba(18,13,48,.8);color:var(--cream);cursor:pointer}
#ctrl button.on{background:var(--rose);color:#fff;border-color:#fff}
/* title */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--tgap);background:radial-gradient(ellipse at 50% 40%,rgba(20,14,50,.45),rgba(12,8,32,.9));text-align:center}
#title h1{margin:0;font:800 var(--h1) var(--font-serif);letter-spacing:.14em;color:#fff;text-shadow:0 0 22px rgba(224,112,143,.8),0 3px 0 #7a2a52;padding-left:.14em}
#title h1 em{font-style:normal;color:var(--rose)}
#title h2{margin:0;font:600 var(--h2) var(--font-serif);letter-spacing:.3em;color:var(--gold)}
#title .rule{width:46%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.menu button{width:240px;font:700 20px/1 var(--font-serif);letter-spacing:.3em;padding:13px 0 13px .3em;background:rgba(20,14,50,.7);border:1px solid var(--gold);color:var(--cream);cursor:pointer}
.menu button:hover,.menu button:focus{background:var(--rose2);color:#fff}
#title small{font:400 12px/1.5 var(--font-ui);color:rgba(246,236,255,.65)}
/* prologue（はじめる直後の暗転） */
#prologue{position:absolute;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;padding:6% 8%;cursor:pointer;transition:opacity .8s}
#prologue[hidden]{display:none}
#prologue.out{opacity:0;pointer-events:none}
#plText{display:flex;flex-direction:column;gap:1.1em;text-align:center;font:500 var(--h2) /1.8 var(--font-serif);letter-spacing:.12em;color:var(--cream)}
#plText p{margin:0;opacity:0;transform:translateY(6px);transition:opacity 1.1s,transform 1.1s,color 1.1s}
#plText p.on{opacity:1;transform:none}
#plText p.past{color:rgba(246,236,255,.45)}
#plText p.last{font-size:1.35em;font-weight:800;color:var(--rose);text-shadow:0 0 18px rgba(224,112,143,.6)}
#plArrow{position:absolute;right:7%;bottom:9%;color:var(--gold);font-size:14px;opacity:0;transition:opacity .4s}
#plArrow.on{opacity:1;animation:plBlink 1.2s infinite}
@keyframes plBlink{50%{opacity:.25}}
#plSkip{position:absolute;right:12px;top:12px;font:500 12px/1 var(--font-ui);padding:6px 10px;border-radius:12px;border:1px solid rgba(217,179,106,.5);background:transparent;color:rgba(246,236,255,.7);cursor:pointer}
/* result */
#result{position:absolute;inset:0;z-index:35;background:rgba(14,10,40,.96);display:flex;align-items:center;justify-content:center;padding:var(--rpad)}
#result[hidden]{display:none}
.rbox{position:relative;width:100%;max-height:100%;display:grid;grid-template-columns:var(--rcols);gap:var(--rgap);align-items:center}
.rfl{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rfl svg{width:var(--rfw);height:auto}
.rfl .nm{font:800 26px/1.2 var(--font-serif)}
.chip{display:inline-block;color:#fff;font:700 13px/1 var(--font-ui);padding:4px 10px;border-radius:10px;letter-spacing:.08em}
.rinfo{display:flex;flex-direction:column;gap:9px;min-width:0}
.quote{font:700 var(--qfs)/1.5 var(--font-serif);color:#ffe6f2}
.row{display:grid;grid-template-columns:7.2em 1fr;gap:8px;align-items:center;font:500 13px/1.4 var(--font-ui)}
.row .k{color:var(--gold);letter-spacing:.1em}
.bar{height:12px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose2),var(--rose));transition:width 1.4s cubic-bezier(.2,.8,.2,1);border-radius:6px}
.bar i.s{background:linear-gradient(90deg,#ff8fc8,#ffd27a)}
.bar b{position:absolute;right:6px;top:-1px;font:700 10px/12px var(--font-ui);color:#fff}
.tsk{font:500 14px/1.6 var(--font-serif);color:#d9cdea;border-left:3px solid var(--rose);padding-left:10px}
.total{font:500 12px/1 var(--font-ui);color:rgba(246,236,255,.7)}
.rbtns{display:flex;flex-wrap:wrap;gap:8px}
.rbtns button,.mbtn{font:700 14px/1 var(--font-serif);padding:10px 14px;background:rgba(20,14,50,.85);border:1px solid var(--gold);color:var(--cream);cursor:pointer;letter-spacing:.1em}
.rbtns button:first-child{background:var(--rose2);border-color:#fff}
.rbtns button:hover,.mbtn:hover{background:var(--rose);color:#fff}
.stamp{position:absolute;right:0;top:calc(var(--stTop));width:var(--stW);aspect-ratio:1;border-radius:50%;border:5px double #d4183c;color:#d4183c;display:grid;place-items:center;font:800 calc(var(--stW)*.34)/1 var(--font-serif);transform:rotate(-14deg) scale(3);opacity:0;pointer-events:none;background:rgba(255,255,255,.04);letter-spacing:.05em}
.stamp.go{animation:stamp .5s .25s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.95}}
/* modals */
.modal{position:absolute;inset:0;z-index:40;background:rgba(10,7,30,.82);display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none}
.mbox{width:90%;height:88%;background:var(--dusk);border:1.5px solid var(--gold);display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(217,179,106,.4);font:700 20px/1 var(--font-serif);letter-spacing:.2em}
.mhead small{font:500 12px/1 var(--font-ui);letter-spacing:.05em;color:var(--gold);margin-left:12px}
.mx{background:none;border:1px solid var(--gold);width:34px;height:34px;font-size:18px;cursor:pointer;line-height:1}
.mbody{flex:1;min-height:0;overflow:auto;padding:14px 16px}
#logList{display:flex;flex-direction:column;gap:10px}
.lg .n{display:inline-block;background:var(--rose2);padding:1px 10px;font:700 12px/1.5 var(--font-serif);margin-right:8px;letter-spacing:.2em}
.lg{font:500 14px/1.7 var(--font-serif);overflow-wrap:anywhere}
.lg.c{color:var(--gold)}
.lg.nr{color:#c9bddc}
.set{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.set .lb{font:700 14px/1.2 var(--font-serif);letter-spacing:.1em;color:var(--gold)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{font:500 13px/1.2 var(--font-ui);padding:8px 12px;border:1px solid rgba(217,179,106,.6);background:rgba(20,14,50,.6);cursor:pointer}
.seg.on{background:var(--rose);border-color:#fff;color:#fff}
.set p{margin:0;font:400 12px/1.5 var(--font-ui);color:rgba(246,236,255,.65)}
#zGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--zmin),1fr));gap:8px}
.zc{border:1px solid rgba(217,179,106,.4);background:rgba(20,14,50,.7);padding:6px 4px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:0;--rc:#8b97a8}
.zc:hover{background:rgba(120,40,90,.5)}
.zc svg{width:100%;max-width:64px;height:auto}
.zc .zn{font:600 11px/1.2 var(--font-serif);overflow-wrap:anywhere}
.zc .zr{font:700 10px/1 var(--font-ui);color:#fff;background:var(--rc);padding:2px 6px;border-radius:8px}
.zc .zt{font:500 10px/1 var(--font-ui);color:var(--gold)}
.zc.un{cursor:default}
.zc.un .zq{font:800 28px/64px var(--font-serif);color:rgba(246,236,255,.35);height:64px}
#zDetail{position:absolute;inset:0;background:var(--dusk);display:flex;flex-direction:column}
#zDetail[hidden]{display:none}
.dtl{display:grid;grid-template-columns:var(--dcols);gap:16px;align-items:center}
.dtl svg{width:var(--dfw);height:auto;justify-self:center}
.dtl h3{margin:0 0 6px;font:800 24px/1.3 var(--font-serif)}
.dtl p{margin:0 0 10px;font:500 14px/1.7 var(--font-serif);overflow-wrap:anywhere}
.dtl .k{color:var(--gold);font:700 12px/1 var(--font-ui);letter-spacing:.1em;display:block;margin-bottom:3px}
/* modes */
#stage.r169{--chTop:70px;--chFs:24px;--tbBottom:38px;--tbH:136px;--tbPad:18px 26px;--tbFs:21px;--nameFs:16px;--cw:178px;--h1:62px;--h2:20px;--tgap:14px;--rpad:34px 48px;--rcols:230px 1fr;--rgap:30px;--rfw:170px;--qfs:24px;--stTop:-6px;--stW:96px;--zmin:92px;--dcols:200px 1fr;--dfw:180px}
#stage.r169 #gacha{top:28px}

#stage.r43{--chTop:100px;--chFs:26px;--tbBottom:40px;--tbH:170px;--tbPad:22px 30px;--tbFs:24px;--nameFs:18px;--cw:210px;--h1:60px;--h2:22px;--tgap:18px;--rpad:50px 56px;--rcols:250px 1fr;--rgap:32px;--rfw:190px;--qfs:26px;--stTop:-8px;--stW:104px;--zmin:100px;--dcols:220px 1fr;--dfw:200px}
#stage.r43 #gacha{top:50px}
#stage.r43 #girl{left:540px;height:500px}
#stage.r43 #boy{left:160px;height:520px}
#stage.r916{--chTop:90px;--chFs:22px;--tbBottom:40px;--tbH:200px;--tbPad:20px 20px;--tbFs:20px;--nameFs:15px;--cw:210px;--h1:42px;--h2:16px;--tgap:16px;--rpad:30px 22px;--rcols:1fr;--rgap:14px;--rfw:120px;--qfs:21px;--stTop:-6px;--stW:76px;--zmin:76px;--dcols:1fr;--dfw:150px}
#stage.r916 #gacha{top:80px}
#stage.r916 #girl{left:232px;height:380px}

@media (prefers-reduced-motion:reduce){.petal{animation-duration:30s!important}.card.shake{animation:none}}

/* ===== スマホ対応：小さい文字・ボタンを --ui 倍に ===== */
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#stage{--ui:1}
#ctrl button{font-size:calc(12px*var(--ui));padding:calc(6px*var(--ui)) calc(10px*var(--ui));border-radius:calc(12px*var(--ui))}
#stage.r916 #ctrl button{font-size:calc(11px*var(--ui));padding:calc(7px*var(--ui)) calc(7px*var(--ui))}

/* ---------- engine ---------- */
class Abort extends Error{}
let token=0,skipMode=false,autoMode=false;
const ui={typing:false,skipType:false,waiting:false,adv:false,lock:true,gachaWait:false,flip:false,guard:0};
const wakers=new Set();
const poke=()=>[...wakers].forEach(f=>f());
const chk=t=>{if(t!==token)throw new Abort()};
function sleep(ms,t){return new Promise((res,rej)=>{let h;const done=()=>{clearTimeout(h);wakers.delete(done);t!==token?rej(new Abort()):res()};h=setTimeout(done,ms);wakers.add(done)})}
const logs=[];
function pushLog(n,t,cls){logs.push({n,t,cls});if(logs.length>200)logs.shift()}
const modalOpen=()=>!!stage.querySelector('.modal:not([hidden])');
function refocus(){try{tb.focus({preventScroll:true})}catch(e){}}
function syncBtns(){$('#bAuto').classList.toggle('on',autoMode);$('#bSkip').classList.toggle('on',skipMode)}
function setMode(txt){$('#mode').textContent='台詞: '+txt}
function modeText(){return ''}

async function say(who,text,o={}){
  const t=token;chk(t);
  const nar=who!=='boy'&&who!=='girl';
  const name=who==='boy'?'蒼真':who==='girl'?'ひより':'';
  const shown=nar?text:'「'+text+'」';
  pushLog(name,shown,nar?'nr':'');
  tb.hidden=false;tbName.hidden=!name;tbName.textContent=name;
  tb.classList.toggle('nar',nar);tb.classList.toggle('big',!!o.big);
  arrow.hidden=true;tbText.textContent='';
  ui.typing=true;ui.skipType=false;ui.guard=performance.now()+150;
  const sp=cfg.speed;
  for(let i=1;i<=shown.length;i++){
    chk(t);
    if(ui.skipType||sp===0||skipMode){tbText.textContent=shown;break}
    tbText.textContent=shown.slice(0,i);
    await sleep(/[、。！？…]/.test(shown[i-1])?sp*5:sp,t);
  }
  tbText.textContent=shown;ui.typing=false;
  if(o.noWait)return;
  arrow.hidden=false;
  await waitAdvance(t,shown.length);
  arrow.hidden=true;
}
async function waitAdvance(t,len){
  ui.waiting=true;ui.adv=false;let start=performance.now();
  try{
    for(;;){
      chk(t);
      if(modalOpen()||ui.lock){start=performance.now()}
      else{
        if(ui.adv){ui.adv=false;break}
        const el=performance.now()-start;
        if(skipMode&&el>=90)break;
        if(autoMode&&el>=cfg.autoWait+len*28)break;
      }
      await sleep(30,t);
    }
  }finally{ui.waiting=false}
}
function advance(){
  if(modalOpen()||ui.lock)return;
  // オート・スキップ中の入力は、まずモードを止めるだけにする（勝手に読み飛ばさない）
  if(skipMode||autoMode){skipMode=false;autoMode=false;syncBtns();return}
  if(ui.gachaWait){ui.flip=true;poke();return}
  // 行が出た直後・全文表示した直後の連打は無視（ダブルクリックで1行飛ばさないため）
  const now=performance.now();if(now<ui.guard)return;
  if(ui.typing){ui.skipType=true;ui.guard=now+220;poke();return}
  if(ui.waiting){ui.adv=true;poke()}
}
wrap.addEventListener('click',e=>{if(e.target.closest('button,.modal,#gacha,#choices,#result,#title'))return;advance()});
gachaEl.addEventListener('click',()=>{if(ui.gachaWait){ui.flip=true;poke()}});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  if(!choicesEl.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const bs=[...choicesEl.querySelectorAll('button')];let i=bs.indexOf(document.activeElement);
    i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].focus();e.preventDefault();return}
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){
    if(e.repeat){e.preventDefault();return}
    const a=document.activeElement;
    if(a&&a.tagName==='BUTTON'&&a.offsetParent!==null)return;
    if(modalOpen()||ui.lock)return;
    e.preventDefault();advance();
  }
});

function choice(opts){
  return new Promise(res=>{
    ui.lock=true;skipMode=false;syncBtns();tb.hidden=true;
    choicesEl.innerHTML='';
    opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='band';b.textContent=o;
      b.onclick=()=>{choicesEl.hidden=true;ui.lock=false;pushLog('','▶ '+o,'c');refocus();res(i)};choicesEl.appendChild(b)});
    choicesEl.hidden=false;choicesEl.firstChild.focus();
  });
}

tamanegi":["悲哀","悲哀なき涙","悲哀。……玉ねぎの涙には、悲哀がない。だからこそ、君の涙は今、世界一澄んでいる。","悲しみのない涙を流せる日は、幸せな日だ。","……幸せな、日……","悲哀の花で悲哀がないことを祝う。"],"eiga":["愛の悲しみ","愛される資格","愛の悲しみ。……あの犬の物語は、愛の悲しみそのものだった。","愛の悲しみに泣ける君は、きっと誰かに深く愛される人だ。","……愛される……","映画で泣いたら愛される人に認定される。"],"furare":["愛の悲しみ","次の恋の資格","愛の悲しみ。……三年分の愛は、三年分の悲しみになる。それだけ、本気だった。","本気の悲しみを知った君は、次の恋で誰より優しくなれる。","……優しく……","失恋の悲しみを次の恋の資格にする。"],"gacha":["悲哀","喜びの前払い","悲哀。……天井まで回してすり抜けた夜の悲哀は、経験した者にしか分からない。","その悲哀を知る君だから、次に引けたとき、誰より喜べる。","……喜べる……","爆死の悲哀を喜びの前払いにする。"],"kasa":["悲哀","水辺の花","悲哀。……傘のない帰り道には、悲哀がある。","だが、この花は水辺に咲く花だ。……濡れた君にも、よく似合う。","……似合う……","水辺の花だから濡れても似合うという理屈。"],"sumaho":["愛の悲しみ","スマホへの純愛","愛の悲しみ。……割れた画面に泣けるのは、毎日を共にしたスマホを愛していたからだ。","愛したものが傷ついても、愛は傷つかない。","……傷つかない……","スマホへの愛を純愛扱い。"],"report":["悲哀","悲哀の文章力","悲哀。……消えた三時間には、悲哀がある。","だが、悲哀を越えて書き直す君の文章は、きっと誰より深い。","……深い……","悲哀を文章力に転換する。"],"maegami":["悲哀","横顔の評価","悲哀。……短すぎる前髪には、悲哀がある。","だが、悲哀を帯びた君の横顔は、今日一番綺麗だ。","……横顔……","前髪の悲哀を横顔で褒める。問題は正面なのに。"],"akaten":["悲哀","立ち上がる力","悲哀。……赤点の答案には、悲哀がある。","悲哀を知った君は、追試でもう一度立ち上がれる。","……立ち上がれる……","赤点に盆花。供養には早い。"],"tenkou":["愛の悲しみ","友愛の悲しみ","愛の悲しみ。……親友との別れが悲しいのは、友情という名の愛があるからだ。","その愛は、離れても、悲しみより長く続く。","……長く……","友情を愛の悲しみで包む。"],"geki":["悲哀","役者の痛み","悲哀。……台詞を噛んだ瞬間の悲哀は、舞台に立った者だけが知る痛みだ。","その痛みを知った君は、もう本物の役者だ。","……本物の……","噛んだだけで役者の格が上がる。"],"save":["愛の悲しみ","愛の証明","愛の悲しみ。……消えたデータに泣けるのは、百時間を愛していたからだ。","愛した時間は、どんなデータより確かに、君の中に残る。","……確かに……","データ消失を愛の証明にする。"],"loveletter":["愛の悲しみ","届かない愛","愛の悲しみ。……届かなかったラブレターは、愛の悲しみそのものだ。","だが、愛は一度で終わらない。……次は、必ず届く。","……必ず……","誤配を愛の悲しみの典型にする。"],"yakisoba":["悲哀","麺の悲哀","悲哀。……シンクに散った麺には、悲哀がある。","麺の悲哀にさえ心を痛める君を、俺は見過ごせない。","……見過ごせない……","麺の悲哀に男が反応する。"],"kafun":["悲哀","鼻の悲哀","悲哀。……花を愛する人が花粉に泣かされる。これほどの悲哀はない。","それでも、この花は君に贈りたかった。……悲哀ごと、受け取ってくれ。","……悲哀ごと……っくしゅ……","花粉症に悲哀の花。悲哀が増える。"],"baito":["悲哀","通過儀礼","悲哀。……三回間違えて怒られる新人の悲哀は、多くの人が通る道だ。","その道の先で、君はきっと誰より頼れる人になる。","……頼れる……","バイトの失敗を通過儀礼扱い。"],"tanjoubi":["悲哀","悲哀の終わり","悲哀。……誰にも祝われない誕生日の悲哀は、今日で終わりだ。","誕生日、おめでとう。……悲哀の花だが、気持ちは祝福だ。","……祝福……","誕生日に悲哀の花と申告して渡す。しかも盆花。"],"wasabi":["愛の悲しみ","寿司への愛","愛の悲しみ 真ん中の花言葉。ただし墓地によく咲いている花。"],"geki":["悲しい思い出","笑い話への熟成","悲しい思い出。……噛んだ台詞は、今は悲しい思い出だ。だが、三年後には、一番の笑い話になる。","そのとき、俺が一番に笑う。……一番近くで、君と一緒にな。","……一緒に……","将来いちばん笑う予約を入れる。"],"save":["また会う日を楽しみに","一方的な再会","また会う日を楽しみに。……消えたデータの仲間たちとは、二周目で再会できる。……向こうは、君を覚えていないが。","初対面のふりをして、また仲良くなればいい。……俺とも、何度でも。","……何度でも……","感動の再会なのに記憶は一方通行。"],"loveletter":["また会う日を楽しみに","再挑戦の予告","また会う日を楽しみに。……ラブレターは、また書ける。次に会う日には、ちゃんと本人の靴箱に入っている。","その日まで、この花を目印にしよう。","……次は、ちゃんと届ける……","誤配からの再挑戦予告に地獄花を添える。"],"yakisoba":["諦め","三秒ルールの却下","諦め。……シンクの麺は、諦めよう。三秒ルールは、シンクには適用されない。","新しい一杯を、君と一緒に作りたい。……お湯は、俺が沸かす。","……一緒に……","三秒ルールのシンク適用を却下した。"],"kafun":["諦め","マスクとの和解","諦め。……花粉とは、戦っても勝てない。諦めて、マスクと友達になろう。","この花は、マスク越しに見ても綺麗だ。","……っくしゅ……マスク、ある……","花粉対策の結論がマスク。花の方は球根に毒がある。"],"baito":["悲しい思い出","伝説の新人","悲しい思い出。……三回のミスは、いつか店の伝説になる。『三回間違えた新人が、店長になった』という伝説に。","伝説には、始まりの失敗が必要なんだ。……君の伝説を、俺は最初から見ている。","……最初から……","バイトの失敗から店長就任まで話を盛った。"],"tanjoubi":["また会う日を楽しみに","来年の予約","また会う日を楽しみに。……来年の今日、また会おう。そのときは、俺が一番に祝う。","……いや、今年も今祝う。誕生日、おめでとう。","……今年も、祝ってくれるんだ……","誕生日に死人花の別名を持つ花。来年の予約より先に謝るべき。"],"wasabi":["悲しい思い出","トラウマ対策","悲しい思い出。……今日のわさびは、悲しい思い出になる。次に寿司を食べるたびに、思い出すだろう。","わさびの思い出も、君と過ごした今日の一部だ。","……今日の、一部……","トラウマ対策の花が地獄花。"],"cookie":["諦め","容器係の任命","諦め。……塩クッキーは、諦めよう。だが、クッキー作りは諦めない。","次は、俺が砂糖の容器を持って、隣に立っている。……ずっと。","……ずっと……","蒼真の役職が容器係に決まった。"]},"otogiriso":{"kingyo":["秘密","二人だけの秘密","秘密。……きんちゃんが、本当は君の声を聞き分けていたこと。それは、君ときんちゃんだけの秘密だ。","その秘密は、誰にも奪えない。君ときんちゃんの、永遠の絆だ。","……私の声、分かってたのかな……","弟切草は秘密を漏らした弟が切られた伝説の草。秘密の話には重すぎる。"],"pudding":["恨み","恨みの利子","恨み。……プリンの恨みは、この花に預けよう。恨みは、預けておくと利子がつく。","恨みを預けた君の手は、もう軽い。……その手で、この花を受け取ってくれ。","……軽い……","恨みの利子が五割。"],"oshi":["秘密","推し活の地下化","秘密。……推しへの想いは、これから君だけの秘密にすればいい。秘密の推し活は、密かに燃えるんだ。","誰にも言わない愛ほど、長続きする。……俺も、そうだ。","……俺も、って……","秘密を漏らすと切られる草で秘密の推し活を勧める。"],"juken":["敵意","安全運転の敵意","敵意。……落とした大学に、少しくらい敵意を持っていい。敵意は、来年の勉強のガソリンになる。","その敵意を燃料に、来年の春、君は誰より高く飛ぶ。","……高く……","願書には書けない種類の燃料。"],"taikai":["恨み","恨みと傷薬","恨み。……あの一球への恨みは、この花が引き受ける。弟切草は、昔から傷薬にも使われてきた草なんだ。","恨みを引き受けて、傷を治す。それがこの花だ。","……傷薬……","傷薬と恨みの二刀流。この草の伝説では両方が同じ事件から生まれている。"],"tamanegi":["秘密","秘密の暴露","秘密。……玉ねぎで泣いていたことは、二人だけの秘密にしよう。君の涙を見たのは、俺だけだ。","秘密を分け合った者同士は、もう他人じゃない。","……玉ねぎの、秘密……","玉ねぎを刻んでいただけで秘密結社が結成される。"],"eiga":["敵意","敵意とリピート","敵意。……犬を死なせた脚本に、敵意を持っていい。この花を、パンフレットに挟んでおけ。","パンフレットに挟んだこの花が、いつか君の涙の記念になる。","……記念……","押し花にすると葉の黒い点がよく見える。伝説では血しぶき。"],"furare":["秘密","秘密の宝箱","秘密。……三年間の片思いは、君だけの秘密の宝物だ。フラれても、宝物は宝物のままだ。","その宝箱に、この花も入れておいてくれ。","……宝箱……","失恋を宝箱にしまわせた。"],"gacha":["恨み","恨みの肥料化","恨み。……確率への恨みは、この花に吸わせよう。この花は、恨みを吸って育つ。","君の恨みを吸って咲いた花は、きっと誰より美しい。","……恨みで、咲く……","爆死の恨みが肥料になった。"],"kasa":["恨み","晴天の逆襲","恨み。……傘泥棒への恨みは、晴れの日に晴らそう。晴れの日、傘はいらない。犯人は、無駄な荷物を抱えている。","……だが、君には恨みより優しさが似合う。恨みは、この花に預けていけ。","……預けて、いく……","晴れの日に犯人が困る想定。犯人は晴れの日に傘を持ち歩かない。"],"sumaho":["秘密","口の堅いスマホ","秘密。……画面が割れても、中の秘密は守られている。君のスマホは、ちゃんと口が堅い。","口の堅いスマホに、この花を。……君の秘密を守った、勇敢な騎士だ。","……口、堅かった……","秘密を漏らすと切られる草をスマホに贈る。ほぼ脅迫。"],"report":["恨み","恨みの文章術","恨み。……消えた三時間の恨みを、キーボードにぶつけろ。恨みのこもった文章は、迫力が違う。","恨みさえ力に変える君の文章は、きっと誰かの心を打つ。","……心を、打つ……","恨みのこもったレポートは評価基準にない。"],"maegami":["秘密","一夜限りの秘密","秘密。……前髪を切りすぎたことは、明日みんなにバレる。だから今夜だけは、二人の秘密だ。","秘密は、短いほど燃える。……前髪と同じだ。","……前髪と、同じ……","前髪の短さと秘密の期限をかけた。"],"akaten":["敵意","決闘化","敵意。……赤点を出した数式に、敵意を持て。敵の顔を知れば、追試は戦いになる。","戦いなら、君は強い。","……戦い、なんだ……","追試を決闘と呼ぶなら先生は介添人。"],"tenkou":["秘密","合言葉の提案","秘密。……転校する親友と、一つ秘密を作るといい。二人だけの秘密は、距離を超える。","合言葉は、この花の名前でいい。……二人の秘密は、どんな距離も越える。","……弟切草、が合言葉……","合言葉の由来が兄弟の斬り合い。友情の誓いには物騒すぎる。"],"geki":["秘密","最前列の口止め","秘密。……実は、客席の半分は気づいていない。噛んだことは、君と最前列だけの秘密だ。","噛んだことは、俺と最前列だけの秘密だ。……君の舞台は、完璧だった。","……完璧……","最前列の観客全員に秘密を背負わせる。"],"save":["恨み","恨みのバックアップ","恨み。……データは消えたが、恨みは消えない。恨みは、心のバックアップなんだ。","その恨みで、二周目を駆け抜けろ。君なら、伝説になれる。","……伝説……","恨みだけはクラウドに保存されていた。"],"loveletter":["秘密","秘密の守り手","秘密。……隣の靴箱の人は、君の秘密を知ってしまった。だが、秘密を知った人は、守る側に回る。","明日から、その人は君の味方だ。","……味方……","誤配の相手を勝手に味方に引き入れる。"],"yakisoba":["敵意","対シンク戦争","敵意。……シンクに敵意を持っていい。あの銀色の口は、何千本もの麺を飲み込んできた。","だが、もう敵は君に近づけない。……俺が、ここにいる。","……ここに……","シンクを敵と認定して見張りに立つ男。"],"kafun":["敵意","花粉への宣戦","敵意。……花粉に、敵意を持て。ただし、この花には持たないでくれ。この花は、君の味方だ。","弟切草は、昔から傷を癒やす薬草だ。君の鼻も、きっと癒やす。","……鼻も……っくしゅ……","傷薬の草で花粉症は治らない。"],"baito":["秘密","秘密の特訓","秘密。……三回間違えた君が、それでも最後まで笑顔だったこと。それは、俺だけが知っている秘密だ。","その笑顔は、明日きっと店いちばんの武器になる。","……笑顔、だったかな……","見ていないはずの笑顔を秘密として保有している。"],"tanjoubi":["秘密","秘密の誕生日","秘密。……誰も気づかない誕生日は、君だけの秘密の誕生日だ。……いや、俺は知っている。二人の秘密だ。","誕生日、おめでとう。……世界で俺だけが知っている、秘密の記念日だ。","……二人の、秘密……","秘密を漏らした弟が切られた草で秘密の誕生日を祝う。"],"wasabi":["敵意","給水作戦","敵意。……わさびに敵意を持っていい。だが、わさびの涙さえ美しく流せる君には、わさびも敵わない。","わさびも今、君の涙に負けを認めている。","……わさび、負けたんだ……","わさびに勝敗をつけている間に寿司は冷める。"],"cookie":["秘密","秘密のレシピ","秘密。……塩クッキーは、今日から君の秘密のレシピだ。誰にも真似できない。","誰にも真似できない味だ。……君にしか焼けない、秘密の味だ。","……秘密の、味……","塩の分量を秘密のレシピと呼ぶ。誰も盗まない。"]},"lobelia":{"kingyo":["謙遜","控えめな追悼","謙遜。……きんちゃんは、いつも控えめだった。だから、この小さな青い花がちょうどいい。","控えめに生きたきんちゃんに、控えめで美しい花を。……君の涙も添えて。","……照れる金魚……","金魚の性格を勝手に控えめに設定。"],"pudding":["悪意","擁護からの一刺し","悪意。……お兄さんに、悪意はなかったはずだ。ただ、そこにプリンがあった。それだけだ。","罪深い兄の分まで、俺が君に甘い時間を返そう。","……甘い時間……","兄を庇ったと見せかけて刺した。"],"oshi":["謙遜","祝福の音量指定","謙遜。……推しの結婚を、控えめに祝おう。大声じゃなくていい。小さな青い花くらいの声で。","小さな祝福ほど、長く咲き続ける。……君の想いのように。","……小さい声で、おめでとう……","祝福の音量を花のサイズで指定した。花言葉には悪意もある。"],"juken":["悪意","悪意の有無","悪意。……合否には、悪意がない。だからこそ、残酷なんだ。だが、君の努力にも悪意はない。","悪意のない努力は、いつか報われる。","……報われる……","悪意の有無だけでいい話を組み立てる手際。"],"taikai":["謙遜","謙遜の禁止","謙遜。……君は、きっと『自分のせいで』と謙遜しているんだろう。だが、今日だけは謙遜しなくていい。","君は、最後まで戦った。それだけは、胸を張れ。","……胸、張る……","謙遜の花を出して謙遜を禁止する。"],"tamanegi":["悪意","玉ねぎの悪意","悪意。……玉ねぎには、悪意がある。切られた瞬間に、人を泣かせる成分を出すんだ。","悪意に立ち向かいながら、君は誰かのために料理を作っていた。……それが、君だ。","……ハンバーグ作ってただけ……","玉ねぎの化学反応を悪意扱い。悪意が花言葉の花を持った男が言う。"],"eiga":["敵意","涙腺への反則","敵意。……あの映画は、君の涙腺に敵意を持っていた。犬を出す時点で、勝負は決まっていたんだ。","あれは反則だ。……だが、反則に泣ける君の心は、まっすぐだ。","……反則……わかる……","犬映画を涙腺への反則と認定。"],"furare":["謙遜","控えめすぎた三年","謙遜。……三年間、気持ちを控えめに隠してきた君は、謙遜の達人だ。……少し、控えめすぎたのかもしれないが。","次は、少しだけ大きな声で。……その声を、誰より先に聞くのは俺でいたい。","……大きな声……","失恋の反省会がそのまま次の告白の予約に。"],"gacha":["悪意","平等な悪意","悪意。……すり抜けに悪意を感じるのは、自然なことだ。だが、運営は君を狙ったわけじゃない。全員平等に、すり抜ける。","平等な悪意の中で、君だけが天井まで想い続けた。その一途さは、平等じゃない。","……一途さ……","ガチャの悪意を平等で正当化する。運営の代弁者ではない。"],"kasa":["悪意","倫理的勝利","悪意。……傘を盗んだ人には、悪意があった。その人は今日、悪意を抱えて帰った。君は、悪意なく帰れる。","悪意なく帰れる君の背中は、どんな傘より美しい。","……濡れても、いい気がしてきた……","倫理では勝ったが物理では負けている。"],"sumaho":["謙遜","スマホの自己犠牲","謙遜。……君のスマホは、謙遜して、自分から画面を割ったんだ。君の手を傷つけないように。","君の手を守ったスマホだ。……俺も、君の手を守りたい。","……手……","落下事故をスマホの自己犠牲にした。"],"report":["悪意","毒花による牽制","悪意。……保存前に再起動するパソコンには、悪意がある。……少なくとも、俺はそう感じる。","悪意から君の三時間を守れなかった。……次は、この花と俺が守る。","……守って、くれる……","毒のある花をパソコンの上に置く。悪意の連鎖が止まらない。"],"maegami":["謙遜","前髪の脇役化","謙遜。……前髪は、謙遜して短くなったんだ。君の顔を、もっと見せるために。","控えめな前髪は、主役を引き立てる。","……前髪、脇役だったんだ……","前髪が脇役に格下げされた。"],"akaten":["敵意","範囲への転嫁","敵意。……赤点に敵意を向けてもいい。だが、数学には向けないでくれ。数学は、悪くない。","悪いのは出題範囲だ。……君の努力は、何一つ悪くない。","……何一つ……","数学を庇って出題範囲を差し出す。"],"tenkou":["謙遜","謙遜の先回り","謙遜。……親友を見送る君は、きっと『私なんかがいなくても』と謙遜するだろう。だが、親友は君がいたから、ここまで来られた。","胸を張って送り出そう。","……胸を張って……","見送る側の謙遜を先回りで封じる。"],"geki":["悪意","台本の告発","悪意。……あの台詞には、悪意があった。わざと噛みやすい言葉を並べていたんだ。","あの台詞に負けず、最後まで立ち続けた君は、誰より強い役者だ。","……強い、役者……","台本作者に悪意の濡れ衣。誰も噛ませるつもりで書いていない。"],"save":["悪意","恨む相手の不在","悪意。……データが消えたのは、誰の悪意でもない。だからこそ、誰も恨まなくていい。","恨む相手のいない別れなら、思い出だけを持っていける。……百時間分、全部。","……百時間分……","恨む相手はいないと言いながら悪意の花を手渡す。"],"loveletter":["謙遜","恥じらう手紙","謙遜。……誤配されたラブレターは、謙遜して、隣の靴箱に隠れたんだ。本命の前で、恥ずかしかったんだろう。","次は堂々と届けよう。恥じらうほどの想いなら、きっと本命にも届く。","……手紙が、恥ずかしがった……","手紙に恥じらいの人格を与えた。"],"yakisoba":["悪意","湯切り口の告発","悪意。……湯切り口には、悪意がある。あの小さな穴の位置は、明らかに麺を落とすための設計だ。","……証拠はない。だが、君が悪くないことだけは、俺が信じている。","……信じてるんだ……","証拠なしで湯切り口を告発する。"],"kafun":["謙遜","花粉量の推測","謙遜。……ロベリアは、小さな花だ。花粉も、きっと謙遜して控えめにしている。","花粉は控えめでも、俺の想いは控えめにできない。","……控えめに、できない……っくしゅ……","花粉の量を花の性格で推測する。謙遜しても毒草。"],"baito":["謙遜","逃げなかった新人","謙遜。……君は、自分はダメだと謙遜しているだろう。だが、三回間違えても逃げなかった。それは、ダメじゃない。","逃げなかった新人は、強くなる。","……逃げなかった……","逃げなかった点だけ切り取って褒める。"],"tanjoubi":["謙遜","控えめさの指摘","謙遜。……君は、自分の誕生日を言いふらさない。控えめな人だ。だから、誰も気づかなかったんだ。","控えめな君の代わりに、俺が言う。誕生日、おめでとう。","……代わりに、言ってくれた……","忘れられた原因を本人の控えめさにする。"],"wasabi":["悪意","必要悪","悪意。……わさびには、悪意しかない。おいしい寿司の下に、こっそり潜んでいる。","君の涙が締めてくれるなら、わさびの悪意も、少しは報われる。","……報われた……","わさびの悪意を料理の要と認める。悪意の花を持った男が。"],"cookie":["謙遜","控えめの限度","謙遜。……塩クッキーは、謙遜した味だ。甘さを控えめにしすぎただけなんだ。","控えめすぎたのは甘さだけだ。……君の想いは、ちゃんと届いている。","……届いて、る……","塩クッキーを謙遜しすぎた結果と呼ぶ。塩は謙遜しない。"]},"torikabuto":{"kingyo":["騎士道","騎士の着任","騎士道。……トリカブトは、兜の形をした花だ。今日から俺は、きんちゃんの代わりに n":["呪い","花粉の擬人化","呪い。……花粉症とは、花が人間にかける呪いだ。だから、花で解く。毒をもって毒を制すんだ。","呪いには呪いで。……君の涙を止めるためなら、俺は何だって使う。","……っくしゅん……何だって……","花粉症に花で治療を試みる暴挙。しかもクロユリは悪臭で知られる。"],"baito":["呪い","誤注文の霊障化","呪い。……三回も注文を間違えたのは、そのテーブルが呪われていたからだ。君は、霊的な被害者なんだ。","四回目は、この花をテーブルに。……呪いからも、俺が君を守る。","……守って、くれる……","店長は霊障を労災と認めない。"],"tanjoubi":["恋","遅刻の隠蔽","恋。……誰も気づかなかったわけじゃない。少なくとも俺は気づいていた。この花が、その証拠だ。……今、そういうことにした。","誕生日、おめでとう。呪いの花で、すまない。","……そういうことに、しとく……","今そういうことにしたと本人が言った。"],"wasabi":["呪い","辛味の呪術化","呪い。……わさびの辛さは、鼻の奥にかけられる小さな呪いだ。三秒で解けるタイプのな。","あと二秒。……一秒。……ほら、解けた。君の涙を止めるのは、いつだって俺だ。","……ほんとだ、引いた……","三秒待っただけで解呪の手柄を取った。"],"cookie":["呪い","味覚の呪術化","呪い。……砂糖と塩の容器が似ているのは、台所に昔からかかっている呪いなんだ。君のせいじゃない。","その塩クッキーは、俺が全部食べる。呪いごと引き受けよう。","……しょっぱいよ……？","塩クッキーの完食が美談に。"]},"snowdrop":{"kingyo":["あなたの死を望みます","時制の後追い","あなたの死を望みます。……きんちゃんの、ではない。きんちゃんを想って泣き続ける、今日の君の悲しみの、だ。","悲しみが死ねば、きんちゃんとの思い出だけが残る。","……思い出だけ……","金魚が亡くなった日に死を望む花を出す度胸。"],"pudding":["あなたの死を望みます","宛先の変更","あなたの死を望みます。……この花は、お兄さん宛てだ。いや、物騒な意味じゃない。お兄さんの食い意地の死を望んでいる。","食い意地が死ねば、プリンは冷蔵庫で生き延びる。","……食い意地、死んでほしい……","兄の食い意地に死刑判決。"],"oshi":["希望","雪中の希望","希望。スノードロップは、雪の中で最初に咲く花だ。推しの結婚という吹雪の中で、最初に咲くのは、君の祝福なんだ。","……もう一つの花言葉は、今日は言わない。君の祝福を、何ものにも汚させない。","……言わないでくれて、ありがとう……","伏せた花言葉が一番物騒なやつ。"],"juken":["希望","季節の先取り","希望。……雪が溶ける前に咲く花だ。春はまだ来ていない。だが、もう咲いていい。君の春も、同じだ。","春はまだでも、君はもう咲いていい。……俺には、もう見えている。","……見えて、るの……","浪人をふわっと季節で包んできた。"],"taikai":["あなたの死を望みます","敵の明確化","あなたの死を望みます。……あの一球の、だ。君の記憶の中で、あの一球には死んでもらう。","残るのは、そこまで君が投げ続けた全部の球だ。","……全部の球……","一球に死刑宣告する人を初めて見た。"],"tamanegi":["あなたの死を望みます","食材への宣告","あなたの死を望みます。……玉ねぎの、だ。安心してくれ。玉ねぎは、もう切られている。つまり、この願いはすでに叶っている。","叶った願いの花を贈れる日は、そうない。……今日は、いい日だ。","……たしかに、もうみじん切りだけど……","願いが叶ったのはみじん切りのおかげ。"],"eiga":["慰め","上映後ケア","慰め。……この花は、映画館の出口に置かれるべき花なんだ。犬が死ぬ映画のあとには、必ず配るべきだと思っている。","この花を、君に。……あの犬の分まで、君を慰めさせてくれ。","……あの子の、分まで……","映画館の出口で花を配る構想を一人で温めている。"],"furare":["あなたの死を望みます","感情の看取り","あなたの死を望みます。……あの人の、じゃない。三年間、君の中で生き続けた片思いの、だ。……長生きだったな。","大往生だ。この花で、送ってやろう。","……大往生……そっか……","三年の片思いが大往生で見送られた。"],"gacha":["希望","次回への投資","希望。……天井まで回したということは、次の天井まで、もう一回分の希望が残っているということだ。","君の一途さが尽きない限り、希望もまた、尽きることはない。","……尽きない……","慰めの結論が次の天井。"],"kasa":["あなたの死を望みます","恨みの殺害","あなたの死を望みます。……傘泥棒の、ではない。傘泥棒を恨む気持ちの、だ。恨みは、雨より重い。","恨みを手放した君の隣を、明日は俺が歩く。……傘を、二人分持って。","……二人分……","物騒な花言葉からデートに着地した。"],"sumaho":["慰め","破損の芸術化","慰め。……割れた画面越しに見る世界は、ステンドグラスみたいだろう？ この花も、そこから見ればもっと綺麗だ。","修理に出すまでの、君だけの美術館だ。……一番の展示は、君の笑顔だ。","……ほんとだ、ちょっと綺麗……","画面割れが期間限定の美術館。"],"report":["あなたの死を望みます","宛先の変更","あなたの死を望みます。……パソコンの自動更新機能の、だ。君の三時間を奪った、あの機能のな。","君の三時間を奪った機能は、この花が葬った。……君の努力だけが、ここに残る。","……努力だけ……","死を望まれたのは自動更新機能。"],"maegami":["希望","成長予測","希望。……雪の下でも、球根は伸び続けている。君の前髪も、今この瞬間も伸びている。一日〇・三ミリずつな。","計算上、春には元通りだ。……だが俺は、今の君も覚えておきたい。","……今の、私も……","前髪の伸びを日割りで計算する男。"],"akaten":["あなたの死を望みます","数学の延命措置","あなたの死を望みます。……数学の、だ。……いや、数学は死なない。だから、追試のあとで、二人で数学を弔おう。","追試までは、生かしておいてやる。……君が勝つ、その日のために。","……追試までは……","数学に追試までの執行猶予がついた。"],"tenkou":["慰め","季節の約束","慰め。スノードロップは、毎年同じ季節に、同じ場所に咲く。離れても、毎年この花の季節に会えばいい。","それなら、別れじゃなくて、待ち合わせだ。","……待ち合わせ……","別れが年一回の待ち合わせに変わる。"],"geki":["あなたの死を望みます","台詞の葬送","あなたの死を望みます。……噛んだ、あの台詞の、だ。あの台詞はもう死んだ。次の舞台では、新しい台詞が生まれる。","役者とは、台詞の生と死を繰り返す仕事なんだ。","……なんか、深い……","噛んだ台詞の葬式で役者論が始まる。"],"save":["希望","ニューゲームの祝福","希望。……セーブデータが消えたなら、君は今、レベル1だ。レベル1は、伸びしろの塊なんだ。","百時間前のワクワクを、もう一度味わえる。","……もう一度、最初から……","データ消失を二度おいしいと言い切る強さ。"],"loveletter":["あなたの死を望みます","宛先の再訂正","あなたの死を望みます。……誤解しないでくれ。隣の靴箱の人ではない。ラブレターを読まれる恥ずかしさの、だ。","恥ずかしさが死ねば、残るのは勇気だけだ。","……勇気だけ……","死ぬのは恥ずかしさだけと念押しが入る。"],"yakisoba":["慰め","粉末ソースの救済","慰め。……麺は流れたが、ソースの小袋はまだ手元にあるだろう？ 希望は、いつも小袋に残っているんだ。","小袋に希望を見つけられる君がいる限り、どんな夜も、まだ終わらない。","……まだ、終わらない……","焼きそばの小袋に希望が詰まっている設定。中身はソース。"],"kafun":["希望","季節の先回り","希望。……スノードロップが咲くのは、花粉の季節より少し前だ。つまりこの花は、花粉のない世界から来た使者なんだ。","花粉のない世界から、君のためだけに来た花だ。","……私の、ため……っくしゅ……","花粉のない世界の使者。でも花。"],"baito":["あなたの死を望みます","ミスの先回り","あなたの死を望みます。……三回の注文ミスの、だ。四回目のミスは、生まれる前に死ぬ。この花が、そう決めた。","四回目のミスが来ないよう、この花が見張っている。……俺もだ。","……見張って、くれるの……","まだ起きていないミスまで葬った。"],"tanjoubi":["希望","サプライズの捏造","希望。……誰も気づいていないふりをしているだけかもしれない。今ごろ、どこかでサプライズの準備が進んでいる。……可能性はある。","少なくとも、俺は気づいた。誕生日、おめでとう。","……準備、してたらいいな……","誕生日に死を望む花言葉の花。サプライズとしては攻めすぎ。"],"wasabi":["あなたの死を望みます","辛味の看取り","あなたの死を望みます。……わさびの、だ。……もう死につつある。ツーンが、だんだん引いていくだろう？ それが、わさびの最期だ。","わさびの最期を、君と見届けられてよかった。","……わさびの、最期……","球根に毒のある花でわさびの最期を看取る。"],"cookie":["慰め","甘じょっぱいの発見","慰め。……塩のクッキーも、チョコを塗れば甘じょっぱい。失敗は、新しい味の始まりなんだ。","失敗から始まる味を、俺は君と一緒に見つけたい。","……一緒に……","失敗作の横に球根が有毒な花。食卓には置かない方がいい。"]},"blackrose":{"kingyo":["決して滅びることのない愛","喪色の反転","決して滅びることのない愛。……きんちゃんは泳ぐのをやめた。だが、君がきんちゃんを想う愛は、決して滅びない。","この黒は、喪の色じゃない。滅びない愛の色だ。","……滅びない……","金魚の葬儀に黒いバラ。服装規定には合っている。"],"pudding":["恨み","食の恨みの深さ","恨み。……プリンの恨みは、恐ろしい。古今東西、食べ物の恨みほど深いものはない。","その深い恨みさえ、君は涙で流そうとしている。……君は、優しすぎる。","……優しすぎる……","食べ物の恨みに黒いバラ。兄の部屋が魔界になる。"],"oshi":["決して滅びることのない愛","永久保証","決して滅びることのない愛。……推しが結婚しても、君の推し愛は滅びない。この花が、そう誓っている。","滅びない愛を抱えて、君は明日も推しを照らす光になる。","……光に……","推し愛の永久保証に黒いバラ。結婚式には黒すぎる。"],"juken":["憎しみ","憎しみの追い風","憎しみ。……君を落とした大学を、少しだけ憎んでいい。その憎しみは、来年、君を押し上げる風になる。","憎しみさえ追い風に変える君は、もう誰にも止められない。","……止められない……","受験生に憎しみの花は願掛けとして逆効果。"],"taikai":["恨み","黒い勲章","恨み。……あの一球を恨む気持ちは、本気で戦った者にしか生まれない。","その恨みは、君の三年間の勲章だ。……黒く光る勲章だ。","……勲章……","恨みを勲章に変換する。"],"tamanegi":["憎しみ","涙の誘発罪","憎しみ。……玉ねぎを憎む人間はいない。だが、君の涙を誘った罪だけは、俺が憎もう。","君の涙を誘うものは、玉ねぎでさえ許さない。","……玉ねぎ、許してあげて……","平和な台所で玉ねぎに憎しみを向ける男。"],"eiga":["決して滅びることのない愛","スクリーン外の愛","決して滅びることのない愛。……あの犬の愛は、映画が終わっても滅びない。君の涙が、その証拠だ。","スクリーンの外まで届く愛を、君はちゃんと受け取った。","……受け取った……","映画の犬の愛に永久保証がつく。"],"furare":["恨み","恨み以前の愛","恨み。……三年分の想いが、恨みに変わりそうだろう。だが、恨むほど好きだったなら、それは愛だ。","恨みに変わる前の愛を、この花に閉じ込めておこう。……枯れない色で。","……枯れない、色……","黒いバラは本当は深い赤。枯れない色かどうかも怪しい。"],"gacha":["憎しみ","惚れ直し","憎しみ。……すり抜けを憎んでいい。だが、天井まで回した君の想いは、憎しみより強かった。","その想いの強さに、俺は惚れ直した。","……惚れ、直した……","天井の課金額で惚れ直す男。"],"kasa":["恨み","トゲへの委託","恨み。……傘泥棒への恨みは、黒いバラに預けよう。このトゲが、代わりに恨みを持っていてくれる。","君の手は、恨みではなく、この花を握るためにある。","……握る……","トゲだらけの花を握れと言う。手が恨みを持ち始める。"],"sumaho":["決して滅びることのない愛","思い出の不滅","決して滅びることのない愛。……画面は割れても、そのスマホに詰まった思い出は滅びない。","君が撮った笑顔は、ひびの向こうで今も輝いている。","……今も……","割れたスマホに永遠の愛。"],"report":["憎しみ","誠実の文体","憎しみ。……強制再起動を憎んでいい。三時間を奪った罪は重い。","だが、憎しみで書く文章より、君の誠実さで書く文章の方が美しい。","……誠実さ……","憎しみの花を渡しながら憎しみを捨てろと言う。"],"maegami":["決して滅びることのない愛","想いの長さ","決して滅びることのない愛。……前髪は切られても、また伸びる。滅びないものは、ちゃんと戻ってくる。","伸びるまでの間も、君への想いは一ミリも短くならない。","……一ミリも……","前髪の長さと想いの長さを比べる。単位が合っていない。"],"akaten":["恨み","赤と黒","恨み。……赤点を恨んでいい。だが、赤と黒はよく似合う。君の答案とこの花は、今日、同じ舞台に立っている。","その舞台の主役は、追試で勝つ君だ。","……主役……","赤点と黒いバラの配色だけ褒めている。"],"tenkou":["決して滅びることのない愛","距離不滅論","決して滅びることのない愛。……友情も、愛の一つだ。距離では、滅びない。","この花の言葉どおり、君たちの友情は永遠だ。","……永遠……","友情の門出に喪の色の花。"],"geki":["憎しみ","憎むほどの記憶","憎しみ。……あの台詞を、今は憎んでいるだろう。だが、憎むほど覚えた台詞は、もう君の一部だ。","次の舞台で、その台詞は君を一番輝かせる。","……輝かせる……","噛んだ台詞を憎みながら愛せと言っている。"],"save":["恨み","恨みの上書き禁止","恨み。……消えたデータを恨む気持ちは分かる。だが、恨みは上書き保存しないでくれ。","君の心に保存するのは、百時間の楽しかった記憶だけでいい。","……楽しかった、記憶……","恨みの上書き保存を禁じる珍しい慰め。"],"loveletter":["決して滅びることのない愛","宛先の不滅","決して滅びることのない愛。……隣の靴箱に入っても、君の手紙に込めた愛は滅びない。","滅びない愛は、いつか必ず、本当の宛先に届く。","……本当の、宛先……","誤配の手紙に永久保証。差出人の羞恥は保証外。"],"yakisoba":["憎しみ","隣席の保証","憎しみ。……湯切り口を憎んでいい。あの小さな穴が、君の夕食を奪った。","だが、麺を失った夜にも、君の隣には俺がいる。","……隣に……","麺の代わりに男が隣にいる。腹は膨れない。"],"kafun":["恨み","トゲの代役","恨み。……花粉を恨んでいい。君の目を泣かせる罪は、花粉の方にある。","このバラは、トゲで刺すことはあっても、花粉で泣かせはしない。","……刺さっても、いいかも……っくしゅ……","花粉の代わりにトゲで刺す宣言。"],"baito":["憎しみ","憎しみの預かり","憎しみ。……自分を憎まないでくれ。三回間違えた君より、三回謝れた君を、俺は見ている。","その憎しみは、自分ではなく、この花に預けていけ。","……預けて、いく……","憎しみの預かり所を個人で開業している。"],"tanjoubi":["決して滅びることのない愛","祝福の不滅","決して滅びることのない愛。……誰も祝わない誕生日でも、俺の祝福は滅びない。","誕生日、おめでとう。来年も、その次も、この言葉は滅びない。","……その次も……","誕生日に黒いバラはお祝いの色ではない。"],"wasabi":["恨み","三秒の人柄","恨み。……わさびを恨んでいい。だが、その恨みは三秒で消える。君は、恨みを長く持てない人だ。","恨みが三秒で消える君は、きっと誰より優しい。","……三秒で……","わさびの辛さが引いた速さで人柄を判定する。"],"cookie":["憎しみ","愛ごとの受容","憎しみ。……似ている容器を憎んでいい。だが、君の作ったクッキーを憎む必要は、どこにもない。","このクッキーは、俺が全部受け止める。……愛ごと、な。","……愛ごと……","塩クッキーを愛ごと受け止める宣言。"]},"orangelily":{"kingyo":["華麗","鱗の色","華麗。……きんちゃんは、金魚鉢の中で一番華麗に泳いでいた。その姿を、この花で残そう。","この橙色は、きんちゃんの鱗の色だ。……君の思い出の中で、ずっと光る。","……ずっと、光る……","ユリの花粉は服につくと落ちない。喪服で受け取るのは危険。"],"pudding":["憎悪","プリンの護衛","憎悪。……プリンを奪った兄への憎悪を、この花は燃える色で代弁している。","だが君は、憎悪より甘いものが似合う。……次のプリンは、俺が守る。","……守って、くれるの……","プリンの護衛を名乗り出る男。"],"oshi":["愉快","愉快の強行","愉快。……推しの結婚は、愉快な出来事だ。……いや、本当だ。幸せな人が一人増えたんだから。","その幸せを祝える君の涙は、世界で一番きれいな涙だ。","……きれいな、涙……","泣いている人に愉快の花言葉で押し切る。"],"juken":["華麗","華麗な敗北","華麗 きな幸せは終わった。つまり君は、小さな幸せに気づける身軽な自分になれたってことさ"],["b","ほら、足元に咲いてるだろう。今ここに俺がいる。これがその小さな幸せだよ"],["g","蒼真くんが……小さな幸せ……なんか、そう言われると、ちょっと……"]],"m":"小さな幸せ","t":"大小反転・幸せ再配置法","k":40,"s":"自分を小さな幸せ枠に入れる謙虚さと図々しさの同居"}],"gacha":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。ナノハナだ。"],["g","え、菜の花? なんで急に花なの……"],["b","花言葉は快活。ただし、快活なのは君じゃない。天井まで回された君のガチャのほうだ。"],["b","だって考えてみてくれ。100連、200連と、ひと回しごとに元気いっぱい回り続けたんだろう?"],["b","あの子たちは疲れ知らずで、最後の最後まで快活に君のもとへ駆けつけた。目当てのキャラだけが、少し人見知りだっただけさ。"],["n","蒼真は一輪の菜の花を、ひよりの涙の高さにそっと差し出した。"],["b","快活な連中に囲まれた君が、暗い顔をしていては失礼だ。さあ、笑顔でガチャの労をねぎらってあげよう。"],["g","ガチャが……私のために、元気に回ってくれてたんだ……"]],"m":"快活","t":"快活主語スライド回転術","k":72,"s":"人見知りの限定キャラ 天井でやっと挨拶"}],"juken":[{"l":[["b","君の頬を伝うその雫は、俺の胸にだけ降る夜の雨だね"],["g","蒼真くん……なにそれ。てか、その手に持ってるの何"],["b","ナノハナだよ。花言葉は小さな幸せ。君にいちばん似合う花さ"],["n","蒼真は花束をベンチの隣にそっと置き、空を見上げた。"],["b","この花には伝説がある。昔、春を探して旅した人が、道端で最初に見つけたのがこの黄色だった"],["b","大きな春は遠くても、足元の小さな春は必ず先に咲く。これが小さな幸せの由来さ"],["b","第一志望という大きな春は散った。でも君はいま、その手前の春に立っている。ここが旅の始まりなんだ"],["g","私、春のスタート地点にいるの……？ なんか、ちょっと泣き止みそう"]],"m":"小さな幸せ","t":"春の先着理論","k":35,"s":"春の旅人が拾った最初の黄色は花ではなく黄信号だった"}],"kasa":[{"l":[["b","君の頬を濡らすのは、雨じゃなく涙か。ならば俺が、心に陽だまりを贈ろう。"],["n","蒼真は背中に隠していたナノハナを、すっと差し出した。"],["b","ナノハナ。花言葉は、明るさ。"],["g","蒼真くん、それ今いる? 傘の話だよ?"],["b","傘は雨の日の明るさを守る道具だ。それが消えた今、君は明るさを探す旅に出たんだよ。"],["b","明るさは未来の約束だ。君が泣き止んだ時、その傘は明るい思い出という名の傘に生まれ変わる。"],["b","つまり君は今、傘を失ったんじゃない。明るさの側に一歩だけ近づいたんだ。"],["g","なんか……そう言われると、ちょっと晴れてきたかも……"]],"m":"明るさ","t":"未来完了ポジティブ変換","k":62,"s":"傘を盗られた子に天気予報士が現れた"}],"kingyo":[{"l":[["b","夕陽が君の涙を拾って、宝石みたいに光らせているよ。でも、俺は笑顔の君が見たい。"],["n","蒼真は背中に隠していた黄色い花束を、すっと差し出した。"],["b","ナノハナだ。花言葉は、快活。"],["g","快活って……今、私めちゃくちゃ落ち込んでるんだけど。"],["b","そう、だからこそだ。快活とは、元気が有り余っている状態じゃない。元気を失った人にだけ、これから宿る光のことさ。"],["b","きんちゃんは今朝、君の毎日をあれだけ快活にして旅立った。その快活を受け取った君が、いま泣けるほど優しい。つまり君の涙は、快活の第二形態だ。"],["b","泣くのは悲しいからじゃない。きんちゃんの快活が、君の中で元気に暴れているんだよ。"],["g","私の涙って、きんちゃんが元気に泳いでる姿なの……？　なんか、そんな気がしてきた……。"]],"m":"快活","t":"涙は快活の第二形態理論","k":82,"s":"快活な涙という新ジャンルを堂々と開拓している"}],"oshi":[{"l":[["b","君に涙は似合わない。だから今日は、この花を連れてきた。"],["b","ナノハナ。花言葉は、快活。覚えておいてほしい。"],["g","菜の花…… er":[{"l":[["b","君の涙は夕陽よりきれいだけど、俺は笑顔のほうが見たいんだ。"],["n","蒼真は背中に隠していた一輪の花を、すっと差し出した。"],["b","ホオズキだ。花言葉は、ごまかし。"],["g","えっ、ごまかし……？ それ、今の私にはちょっと刺さるんだけど……。"],["b","考えてみてくれ。君の手紙は、隣の人の靴箱に入った。つまり君の想いは、一通で二人分の人生に届いたんだ。"],["b","ごまかしとは、ひとつの気持ちを百通りに見せる技術。君は今日、その百分の一を偶然に任せただけさ。"],["b","残りの九十九通りの君は、まだ誰にもバレていない。ホオズキの実が袋に包まれているのと同じだよ。"],["g","九十九通りの私……まだ、袋の中にいるんだ……。"]],"m":"ごまかし","t":"九十九分率ごまかし理論","k":88,"s":"九十九通りの私が袋の中で全員まちがえた靴箱の前にいる"}],"oshi":[{"l":[["b","君の頬を伝うその雫、宝石より綺麗だけど、今日は俺に拭わせてくれ。"],["n","蒼真は後ろ手に隠していたホオズキを、すっと差し出した。"],["b","ホオズキ。花言葉は、偽り。"],["g","え、偽り……？ 今それ渡す？"],["b","落ち着いて聞いてくれ。偽りは、過去形で読むんだ。偽りだった、と。"],["b","君は今日まで、あの人の隣にいる未来を、心のどこかで夢見ていた。その夢が偽りだったと、涙が教えてくれたんだよ。"],["b","でも偽りだったと気づけるのは、本物の気持ちで見つめ続けた人だけだ。君の涙は、本物の証明さ。"],["g","本物の……証明……。なんか、そんな気がしてきた……。"]],"m":"偽り","t":"過去形リフレーム理論","k":88,"s":"ホオズキの袋より先に話の風呂敷が膨らんでいる"}],"pudding":[{"l":[["b","君の頬を伝うその雫、俺の胸にだけは重すぎるな。これを受け取ってくれ。"],["n","蒼真は懐から、橙色の袋に包まれたホオズキをそっと差し出した。"],["b","ホオズキ。花言葉は、ごまかし。"],["g","え、ごまかし？ なんか悪い意味じゃない？"],["b","違う、主語を見てくれ。ごまかしているのは君じゃない、この世界だ。"],["b","プリンが消えた真実から君の心を守るため、世界が全力でごまかしてるんだ。"],["b","つまり君は、世界一ごまかされるほど大切にされている人ってことさ。"],["g","世界が、私のために……ごまかして……"]],"m":"ごまかし","t":"世界主語すり替え法","k":88,"s":"プリン犯の兄は世界の共犯者に昇格"}],"tanjoubi":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。ホオズキだ。"],["g","え、ホオズキ？ 蒼真くん、これ花言葉は……"],["b","ああ、ごまかし。知ってる。でも聞いてくれ。"],["g","ごまかしって……ちょっと待って、なんで今それ選んだの？"],["b","ホオズキは昔から、実をもんで中身を抜いて、口で鳴らして遊ぶ花だ。つまり音で泣き声をごまかしてくれる。"],["b","君が泣いても、ホオズキの音が重なれば誰にも泣き声だとは分からない。ごまかしとは、君の涙を守る優しい嘘なんだ。"],["n","蒼真は一点の曇りもない目で、赤い実をひよりの手にそっと握らせた。"],["b","それに誕生日を祝えなかった俺の気まずさも、ごまかせる。一石二鳥だ。"],["g","それ蒼真くんが助かってるだけな気もするけど……なんか、いい話に聞こえてきた……"]],"m":"ごまかし","t":"鳴らし笛の涙隠蔽理論","k":88,"s":"ホオズキの笛より先に蒼真の口笛が吹けていない"}],"wasabi":[{"l":[["b","君の頬を伝うその雫、世界で一番きれいな宝石だね。"],["b","これを君に。ホオズキだ。花言葉は、偽り。"],["g","えっ、偽り……？ なんで今それ選んだの？"],["b","聞いてくれ。偽りとは、百パーセントの本当に対する、ほんの一パーセントのズレのことだ。"],["b","君の涙は九十九パーセントがわさびで、残りの一パーセントが悲しみ。つまり君は世界の九十九パーセントを笑える強さで偽っている。"],["n","蒼真は真顔でホオズキをひよりの手のひらにそっと乗せた。"],["b","この小さな実には、君が一生で流す涙の何億分の一かが、もう入っているんだよ。"],["g","九十九パーセントの嘘って、なんか……すごいかも……"]],"m":"偽り","t":"九割九分偽装理論","k":88,"s":"嘘の割合を褒められて照れるわさび涙"}],"yakisoba":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで届いてるよ。これを受け取ってくれ"],["n","蒼真は橙色の袋に包まれた実をそっと差し出した。"],["b","ホオズキ。花言葉は、偽り。"],["g","え、偽り？ 慰めに来たんだよね、蒼真くん"],["b","ホオズキはね、あの鮮やかな実を薄い袋でそっと隠してるんだ。中身は偽らない、袋が偽るんだよ"],["b","君も同じさ。麺はシンクに落ちたけど、湯切りまでは本気だった。あの瞬間までの君に偽りはない"],["b","だから偽りとは、本物を最後まで包み守る優しさのことなんだ。君の涙も、その袋の中の宝石さ"],["g","そっか……私の本気は、ちゃんと本物だったんだ……"]],"m":"偽り","t":"袋入り本気理論","k":88,"s":"焼きそばよりホオズキの袋のほうが中身を守れている"}]},"misohagi":{"eiga":[{"l":[["b","君に涙は似合わない。だからこの花を、そっと君の手に置かせてくれ。"],["b","ミソハギ。花言葉は、悲哀だ。"],["g","えっ、悲哀って……今それ渡す？"],["b","聞いてくれ。悲哀とは、悲しみが終わったあとの名前なんだ。"],["b","君が今流している涙は現在進行形。だが、いつかこの日を悲哀と呼べる朝が来る。"],["b","つまりこの花は、君の未来から届いた『よく泣いたね』という手紙だ。"],["b","あの子と過ごした日々は、いつか悲哀という名の宝物になる。俺はそれを先に渡しただけさ。"],["g","未来から……手紙……先に……なんか、泣けてきた……"]],"m":"悲哀","t":"未来完了ポエム変換","k":88,"s":"未来から届いた手紙の差出人 たぶん今の蒼真くんの勢い"}],"furare":[{"l":[["b","君に涙は似合わないよ。だからこの花を持ってきた。ミソハギだ。"],["g","ミソハギ……？ 蒼真くん、それ花言葉なに？"],["b","愛の悲しみ。そう、愛の悲しみだ。"],["g","え、悲しみって書いてあるけど……ちょっと、きついんだけど。"],["b","よく見てくれ。悲しみの悲は、非と心に分かれる。心に非ず。つまり、愛の悲しみとは、愛の心に非ず、君の心はもう悲しみの外にあるということだ。"],["b","しかも悲の字は、非が心の上に乗っている。心の上に立つ者、それが君だ。三年間愛し抜いた君は、悲しみを踏み越えて立っている。"],["n","蒼真は一点の曇りもない目で、ミソハギをひよりの手にそっと握らせた。"],["g","私、悲しみの上に立ってるんだ……なんか、立てそうな気がしてきた。"]],"m":"愛の悲しみ","t":"悲の字・心上乗せ分解術","k":92,"s":"漢字の分解で慰められた人の初めての立ち姿"}],"gacha":[{"l":[["b","君の頬を伝うその雫、花束にしても足りないくらい綺麗だね。"],["b","これを贈るよ。ミソハギ。花言葉は、悲哀だ。"],["g","えっ、悲哀？ 今それ渡すの？ 傷口に塩じゃない？"],["b","聞いてくれ。ひ・あい。この響きを分けてごらん。ひ、と、あい。"],["b","ひ、は日。君を照らす日だ。あい、は愛。つまり悲哀とは、日々に愛あり、という意味なんだ。"],["n","蒼真は一点の曇りもない目で言い切った。"],["b","天井まで回した君の三百連は、毎日愛を注いだ証だ。悲哀とは、その愛の別名さ。"],["g","日々に愛あり……私の三百連、愛だったんだ……"]],"m":"悲哀","t":"悲哀ひもとき分解法","k":93,"s":"愛を注いだ先がガチャの排出口だった"}],"juken":[{"l":[["b","君の頬を伝うその雫、夕日より先に俺が見つけてしまったようだね。"],["n","蒼真は背中に隠していた一輪の紫の花を、すっと差し出した。"],["b","ミソハギだ。花言葉は、愛の悲しみ。受け取ってくれ。"],["g","え、悲しみ……？ 今それ渡す？"],["b","聞いてくれ。ミソハギは水辺の湿った土地でしか咲かない。つまり、涙で濡れた地面こそが、この花の咲く場所なんだ。"],["b","君が今日流した涙は、悲しみじゃない。愛の悲しみが花開くための、最高の土壌さ。第一志望の大学も、君に水をやりすぎた土地を用意してくれただけだよ。"],["g","私の涙……肥料みたいに言うのに、なんか胸にきちゃう……"],["b","ああ。君 、この花を選んだ。スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ、不幸な愛……？　いま渡す花言葉それなの？"],["b","考えてみてくれ。ふ、こう、な、あい。ほら、最初の二文字は「ふこう」じゃない。「ふ」と「こう」だ。"],["b","ふは不滅の不。「こう」は、あの子が君にくれた幸福の「幸」さ。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","つまり不幸な愛とは、不滅の幸せな愛。あの犬は、君にそれを残していったんだ。"],["g","不滅の幸せ……あの子が、私に……蒼真くん、それ……"]],"m":"不幸な愛","t":"音節分解・漢字読み替え法","k":93,"s":"不幸の幸を拾うその手つき 花より先に言葉を摘んでる"}],"furare":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで届いてしまったよ。これを受け取ってくれないか"],["n","蒼真が差し出したのは、淡い紫の丸い花だった。"],["b","スカビオサ。花言葉は、私はすべてを失った"],["g","えっ……それ、今の私に言う?"],["b","聞いてくれ。この花は丸い。丸とは、ゼロの形だ。すべてを失った君は、今ゼロに立っている"],["b","ゼロとは、何にも縛られず、どこへでも歩き出せる出発点のことだ。花がその形で咲くのは、君の背中を押すためなんだよ"],["b","それに、この花は一輪に小さな花が集まって咲く。失ったのは一つ、でも君の周りには、まだ数えきれない花が咲いている。その一つが、俺だ"],["g","ゼロから始めて、蒼真くんが一輪……なんか、ちょっと泣けてきた"]],"m":"私はすべてを失った","t":"ゼロ円環出発点理論","k":92,"s":"丸い花はゼロの形 ならば彼の恋の採点も満点のゼロ"}],"gacha":[{"l":[["b","君の頬を濡らす雫を、俺の不器用な花束で受け止めさせてくれ。"],["b","スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ……それ、今の私に言っちゃうの？"],["b","この花はね、花びらに見えるものが、実は小さな花の集まりなんだ。"],["b","つまり不幸な愛とは、不幸ひとつだけの愛じゃない。幸福な愛が混ざった群れの一部ってことさ。"],["b","天井まで回した君の愛は、百を超える小さな想いの花束だった。それはもう、一輪じゃない。"],["g","私の愛……花束だったんだ……"],["n","ひよりの涙は、いつのまにか画面越しの推しではなく、目の前の花を映していた。"]],"m":"不幸な愛","t":"花束分母すり替え論","k":88,"s":"天井まで回して出たのは花束と謎の理屈"}],"kasa":[{"l":[["b","君の涙は、どんな雨粒よりも綺麗だ。でも俺は、君に笑っていてほしい。"],["n","蒼真は背中に隠していた一輪の花を、すっと差し出した。"],["b","スカビオサ。花言葉は、私はすべてを失った。"],["g","え、ちょっと待って。傘盗られた子にそれ渡す？"],["b","この花には別名がある。西洋松虫草。松虫と書いて、待つ虫だ。"],["b","すべてを失った君は、もう何も奪われない。失うものがない人間は最強なんだ。"],["b","それに、傘を失った今の君は、空のすべてを浴びられる。雨も、虹もね。"],["g","なんか……最強な気がしてきたかも……"]],"m":"私はすべてを失った","t":"失う者無敵の理","k":88,"s":"松虫より先に蒼真の理屈が鳴きだした"}],"maegami":[{"l":[["b","君の頬を濡らす雫は、まだ早い。まずはこの花を受け取ってほしい。"],["b","スカビオサ。花言葉は、不幸な愛。"],["g","えっ、不幸なの？　いま私、不幸の話してる？"],["b","落ち着いて聞いてほしい。不幸な愛とは、幸せな愛に比べて圧倒的に量が多いという意味だ。"],["b","君の前髪は、美容師さんが数センチ切りすぎた。つまりその数センチ分、美容師さんは君に不幸なほど全力の愛を注いだことになる。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","しかも「おまかせ」は信頼の言葉だ。信頼と愛が重なった今日、君は世界で一番愛された前髪の持ち主なんだよ。"],["g","私の前髪、そんなに愛されてたんだ……"]],"m":"不幸な愛","t":"愛の総量水増し理論","k":93,"s":"前髪の短さが愛の深さの単位になった"}],"report":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで響いているよ。"],["b","だから今日は、この花を贈らせてほしい。スカビオサ。花言葉は、私はすべてを失った。"],["g","え、ちょっと待って。それ、今いちばん言っちゃダメなやつじゃない？"],["b","聞いてくれ。スカビオサは昔、ヨーロッパで皮膚病の薬草として使われた花だ。名前も、疥癬を意味するラテン語が由来さ。"],["b","つまり、すべてを失ったのは君じゃない。君の苦しみのほうだ。この花は、悩みを全部引き取って消し去る花なんだよ。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","三時間分のレポートも、君の心に積もった重さを先に持っていってくれたんだ。身代わりになって消えたのさ。"],["g","身代わり……そっか。レポート、私のために消えてくれたんだ……"]],"m":"私はすべてを失った","t":"薬草身代わり転嫁理論","k":93,"s":"薬草の花から身代わり説まで三時間分の煎じ薬級の飛躍"}],"sumaho":[{"l":[["b","君に涙は似合わないよ。この花を受け取ってくれ。"],["b","スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ、不幸って言った？　今、スマホ割れて泣いてるんだけど。"],["b","この花の名は、昔この花で皮膚病を癒やした伝説に由来するんだ。傷を治す花なんだよ。"],["b","つまり不幸な愛とは、傷ついた者だけが知る愛。割れた画面は、君がスマホを全力で愛し抜いた証だ。"],["n","蒼真は真剣そのものの顔で、ひびの入った画面にそっと花を添えた。"],["b","ひび割れは、愛が外へあふれ出した跡。不幸なのは愛じゃない。愛されきれなかった画面の保護フィルムのほうさ。"],["g","保護フィルム、貼ってなかったけど……なんか、いい話に聞こえてきた……"]],"m":"不幸な愛","t":"傷跡愛情あふれ出し理論","k":88,"s":"画面より先に保護フィルムが慰められている"}],"tamanegi":[{"l":[["b","君の頬を伝うその雫、夕陽より先に俺の心を染めてしまったよ。"],["n","蒼真は背中に隠していた一輪を、芝居がかった手つきで差し出した。"],["b","スカビオサ。花言葉は、私はすべてを失った。"],["g","えっ、ちょっと待って。それ、慰めの花言葉なの?"],["b","いいかい。すべてを失った人間は、失うものが全宇宙から一つも残っていない。つまり、これ以上悲しむ余地が世界に存在しないんだ。"],["b","君が今流している涙は、失った七十億の悲しみの最後の一滴。その一滴が玉ねぎだなんて、どれだけ贅沢な終わり方だと思う?"],["b","ゼロになった君の前には、もう伸びしろしかない。無限大の未来だ。"],["g","七十億の悲しみの最後が……玉ねぎ……なんか、すごい気がしてきた……"]],"m":"私はすべてを失った","t":"全喪失ゼロ起点無限成長論","k":92,"s":"七十億も失った覚えはないはずなのになぜか納得しかけている"}],"tenkou":[{"l":[["b","君に涙は似合わない。だから俺が、この花で止めてみせる。"],["b","スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ……不幸って言った？ 今、慰めてる最中だよね？"],["b","最後まで聞いてくれ。不幸な愛、と言うだろう。つまり愛が不幸なんだ。"],["b","でも君の友情は、泣けるほど幸せだった。だから不幸な愛とは正反対だ。"],["b","この花は、君の愛が不幸じゃないと証明するために、わざわざ不幸を名乗ってくれている。"],["n","蒼真は花を差し出した。その手には微塵の迷いもなかった。"],["g","花の方が、身を引いて……引き立て役を……？ ちょっと、いい話かも……"]],"m":"不幸な愛","t":"当て馬花言葉反転法","k":93,"s":"一番不幸なのは役を押しつけられたスカビオサ"}]},"azami":{"baito":[{"l":[["b","夕焼けより先に、君の涙が俺の目に染みたよ。これを受け取ってくれ。アザミだ。"],["g","え、トゲトゲしてるけど……これ、花言葉とかあるの?"],["b","ああ。アザミの花言葉は、報復だ。"],["g","ほ、報復? 慰めの花じゃなくない?"],["b","聞いてくれ。報復は、ほうふく。『ほう』は『報せ』、『ふく』は『福』。つまり、福を報せると書いて報福なんだ。"],["b","注文を三回間違えた君は、三回も福を報せたことになる。三福だ。店の運気は今、確実に上がっている。"],["n","蒼真は一点の曇りもない目で、トゲだらけの花をひよりの手に握らせた。"] 。花言葉は、夢うつつ。"],["g","ちょ、ちょっと待って、なんかすごい匂いするんだけど……！ 目にしみる……"],["b","それだよ、ひより。伝説では、この花の香りを嗅いだ者は、あまりの衝撃に現実と夢の境目を見失うと言われている。"],["b","つまり君の涙は、悲しみじゃない。夢と現実の狭間で流れた、奇跡の雫なんだ。"],["b","世界最大の花が君を包むのは、君の見る夢が世界一大きいからさ。"],["g","夢うつつ……そっか、わさびの涙も、夢の入口だったんだ……"]],"m":"夢うつつ","t":"嗅覚幻夢伝説こじつけ","k":93,"s":"夢か現実かより先に鼻が現実に気づいている"}]},"gobou":{"eiga":[{"l":[["b","君の涙を止められるのは、きっとこの一輪だけだよ。"],["b","ゴボウの花だ。花言葉は「いじめないで」。"],["n","蒼真は根菜売り場の値札がついたままの花を、そっと差し出した。"],["g","えっ、いじめないでって……ていうかこれ、野菜コーナーの……"],["b","いいかい、ひより。これは俺が君に言っているんじゃない。"],["b","あの子が最後に君へ託した言葉なんだ。いじめないで、自分を。"],["b","あの子は君に愛されて幸せだった。だから君も、泣いて自分を責めないでほしいってね。"],["b","根っこは深く、土の中で、ずっと君を支えている。ゴボウだけにね。"],["g","あの子が……そう言ってるの……？　なんか、そんな気がしてきた……"]],"m":"いじめないで","t":"天国からの代筆","k":88,"s":"ゴボウの根は深いが理屈の根は浅い"}],"furare":[{"l":[["b","君の頬を濡らす雫、俺の胸が受け止めきれないほど綺麗だよ。でも、もう泣き止もう。"],["b","これを受け取ってほしい。ゴボウの花だ。花言葉は、触らないで。"],["n","蒼真は根菜売り場の袋から、泥のついた茎をすっと取り出した。"],["g","ええ……根菜売り場から来たの？ しかも、触らないでって……"],["b","聞いてくれ。花言葉は触らないで、だ。これは今の君じゃない。三年前の君に向けた言葉なんだ。"],["b","あの頃の君は、触れないほど真っ直ぐに誰かを想っていた。その純粋さは、誰にも触れさせてはいけなかった。"],["b","そして今、君は泣いている。つまり、触らないでと守ってきた心が、ちゃんと本物だった証拠だよ。"],["g","三年間、触れさせなかった本物……そう言われると、なんだか、胸の奥が……"]],"m":"触らないで","t":"過去形ぶん投げ話法","k":88,"s":"ゴボウの地下では三年分の根を張っていたらしい"}],"gacha":[{"l":[["b","君に涙は似合わないよ。涙より似合うものを、俺が今ここで贈ろう。"],["n","蒼真が差し出したのは、一輪のゴボウの花だった。"],["g","……蒼真くん、それ、どこから持ってきたの？"],["b","根菜売り場さ。花屋にない出会いこそ運命だろう。ゴボウの花言葉は、いじめないで。"],["g","えっ、いじめないで？ なんか急に重いんだけど……"],["b","よく見て。いじめないで、の「いじめ」を分解すると、「い」と「じめ」。つまり「い」は、君の「い」だ。"],["b","そして「じめ」は、地面。君という「い」が、地面でしっかり根を張れと花は言っている。だから「い、地面」。ゴボウは根が命だからね。"],["b","天井まで回した君の指は、もう誰かにいじめられた指じゃない。大地に根を張った、立派な根菜の指だ。"],["g","根菜の指……なんか、すごく地に足がついた気がしてきた……"]],"m":"いじめないで","t":"根菜ルート逆流分解法","k":93,"s":"引き抜かれたのはキャラではなく理性だった"}],"juken":[{"l":[["b","君に涙は似合わないよ。だから今日は、この花を持ってきた。"],["n","蒼真が差し出したのは、土のついたゴボウの花だった。"],["b","ゴボウの花。花言葉は、触らないで。"],["g","え、触らないでって……っていうかそれ、根菜売り場にあったよね？"],["b","そう、根菜売り場。だが考えてみてくれ。今年、第一志望に挑んだ受験生は約50万人。その全員の心に、君は触れた。"],["b","触らないでとは、君が50万人分の夢の重みを背負ったから、もう誰にも軽々しく触れさせない尊い存在だという意味さ。"],["b","しかもゴボウは根を地中に1メートル近く伸ばす。君が今日流した涙は、その深い ている"],["g","……蒼真くん、これ、ネギ坊主だよね。ネギの花だよね"],["b","ああ。ネギ坊主。花言葉は、くじけない心だ。きんちゃんを想う君に、これ以上ふさわしい花はない"],["b","ネギは切られても切られても、また根元から伸びてくる。何度刈られても空へ向かうんだ"],["b","きんちゃんは今朝、天に向かって泳ぎ出した。つまりきんちゃんも、くじけず上を目指したんだよ"],["b","そして君の涙は、ネギを切ったときの涙と同じだ。人は本気で向き合ったものの前でだけ泣ける。君の涙は愛の証だよ"],["g","私の涙、ネギ扱いされてるのに……なんか、ちょっと沁みちゃった"]],"m":"くじけない心","t":"ネギ切り涙の愛情証明法","k":88,"s":"薬味のくせに泣かせにくる　しかも二重の意味で"}],"loveletter":[{"l":[["b","君の頬を伝うその雫、夕焼けより先に俺が受け止めさせてもらうよ。"],["n","蒼真は背中に隠していた一輪を、うやうやしく差し出した。丸くて白い、ネギ坊主だった。"],["b","ネギ坊主。花言葉は、愛嬌だ。"],["g","ねえ蒼真くん、これ、どう見てもネギの花だよね……?"],["b","そうさ。ネギ坊主は一本に約二千の小花が集まって、あの丸い形をつくる。つまり愛嬌が二千個だ。"],["b","君が靴箱に入れた手紙は一通。でも隣の彼には、君の愛嬌二千個分が先に届いたんだ。一通で二千、効率は二千倍だよ。"],["b","間違えて届いたんじゃない。君の愛嬌が、宛先より先に走り出しただけさ。"],["g","二千倍……私の愛嬌、そんなに出てたんだ……。"]],"m":"愛嬌","t":"小花二千倍換算の法","k":78,"s":"二千は小花の数で愛嬌の数ではないし手紙も一通だよ"}],"oshi":[{"l":[["b","泣かないで、ひより。君の瞳に映るべきは涙じゃなく、この一輪だ。"],["g","蒼真くん……それ、ネギ坊主だよね？ 丸いし、ちょっとネギの匂いするけど。"],["b","そう、ネギ坊主。花言葉は、くじけない心。"],["b","ネギは古来、冬の寒さに耐えて畑に立ち続けた。折れても刈られても、また緑を伸ばす。その姿を人は不屈と呼んだんだ。"],["b","そして花を咲かせるのは、ネギが何年も耐え抜いたご褒美さ。つまりこの玉は、くじけなかった者だけが咲かせる勲章なんだよ。"],["b","推しの幸せを祝いたいのに泣けてしまう。それでも君は祝う道を捨てていない。その涙こそ、くじけない心が絞り出した、君だけの露さ。"],["n","蒼真はネギ坊主をそっと差し出した。かすかに薬味の香りがした。"],["g","私の涙が……勲章の露……。なんか、そんな気がしてきた……。"]],"m":"くじけない心","t":"畑の不屈伝説転用法","k":72,"s":"薬味の香りで涙が引っ込む新展開"}],"pudding":[{"l":[["b","君の頬を伝うその雫、俺がそっと受け止めさせてもらうよ。"],["g","蒼真くん……それ、ネギ？ なんか頭がぼんぼりみたいになってるけど。"],["b","ネギ坊主だ。ネギの花さ。花言葉は愛嬌。君にぴったりだろう？"],["g","愛嬌って……今わたし、ぐしゃぐしゃに泣いてるんだけど。"],["b","考えてみてくれ。ネギは別名、一文字と書いて「ひともじ」。たった一文字で、人を笑顔にする草だ。"],["b","そして坊主とは、悟りを開いた者。君のお兄さんは、プリンを食べることで君に「執着を手放す愛嬌」を教えに来た、小さな僧侶なんだ。"],["n","蒼真は一点の曇りもない眼差しで、ネギ坊主をひよりの手にそっと握らせた。"],["g","お兄ちゃんが……僧侶……。なんか、そんな気がしてきた……。"]],"m":"愛嬌","t":"別名こじつけ式悟り開眼法","k":82,"s":"プリンを食べた兄が一晩で住職に昇進"}],"tanjoubi":[{"l":[["b","君に涙は似合わないよ。さあ、これを受け取ってくれ。"],["g","え、これ……ネギ坊主だよね？ 花っていうか、ネギだよね？"],["b","ああ、ネギ坊主だ。ネギの花だよ。そしてこの花の花言葉は、愛嬌。"],["b","愛嬌の「嬌」は、女へんに「高」と書く。つまり、君という女性がいちばん高く輝いている、ということさ。"],["b","愛は「受ける」の字を心で包んだ形。今日、誰にも祝われなかった君は、愛を受け取る準備がずっと整っていたんだ。"],["n","蒼真は真顔でネギ坊主を差し出した。ほのかにネギの香りがする。"],["b","ネギは涙を誘う。 const _last={};
function pickNR(key,arr){if(arr.length<2)return arr[0];let v;do{v=arr[rnd(arr.length)]}while(v===_last[key]);_last[key]=v;return v}
const fill=(s,o)=>s.replace(/\{f\}/g,o.f).replace(/\{m\}/g,o.m).replace(/\{c\}/g,o.c);
/* 生成台本があればそれを丸ごと使う。同じ組み合わせで複数あれば、直前と違うものを選ぶ */
const _lastS={};
function fromScripts(f,r){
  const a=SCRIPTS[f.id]&&r.id&&SCRIPTS[f.id][r.id];if(!a||!a.length)return null;
  const key=f.id+'|'+r.id;let i=rnd(a.length);if(a.length>1&&i===_lastS[key])i=(i+1)%a.length;_lastS[key]=i;
  const s=a[i],W={b:'boy',g:'girl',n:'narration'};
  return{lines:s.l.map(([w,t])=>({who:W[w]||'narration',text:t})),used_meaning:s.m,technique:s.t,kojitsuke:s.k,tsukkomi:s.s,mode:'script'};
}
function compose(f,r){
  const sc=fromScripts(f,r);if(sc)return sc;
  const d=f.d;
  const cb=COMBO[f.id]&&r.id&&COMBO[f.id][r.id];
  if(cb){
    const [m,tech,spin,close,fin,tsk]=cb, o={f:f.name,m,c:r.cause};
    const L=[];
    L.push({who:'boy',text:pickNR('open',POOL.open)});
    L.push({who:'narration',text:fill(pickNR('offer',f.odd?POOL.offerOdd:POOL.offer),o)});
    L.push({who:'boy',text:fill(pickNR('name',POOL.name),o)});
    if(f.odd&&Math.random()<.5)L.push({who:'girl',text:fill(pickNR('cfo',POOL.confuseOdd),o)});
    else if(NEGW.test(m))L.push({who:'girl',text:fill(pickNR('cf',POOL.confuse),o)});
    String(spin).split('｜').forEach(t=>t&&L.push({who:'boy',text:t}));
    if(close)L.push({who:'boy',text:close});
    L.push({who:'girl',text:fin});
    return{lines:L,used_meaning:m,technique:tech,kojitsuke:Math.min(100,d*17+rnd(14)),tsukkomi:tsk,mode:'fixed'};
  }
  const sp=pickNR('sp_'+f.id,SPINS[f.id]||[[f.m[0],'強行突破','『'+f.m[0]+'』。……つまり、そういうことだ。']]);
  const o={f:f.name,m:sp[0],c:r.cause};
  const L=[];
  L.push({who:'boy',text:pickNR('open',POOL.open)});
  L.push({who:'narration',text:fill(pickNR('offer',f.odd?POOL.offerOdd:POOL.offer),o)});
  L.push({who:'boy',text:fill(pickNR('name',POOL.name),o)});
  if(f.odd&&Math.random()<.5)L.push({who:'girl',text:fill(pickNR('cfo',POOL.confuseOdd),o)});
  else if(NEGW.test(sp[0]))L.push({who:'girl',text:fill(pickNR('cf',POOL.confuse),o)});
  else if(Math.random()<.4)L.push({who:'girl',text:pickNR('mild',POOL.mild)});
  L.push({who:'boy',text:fill(sp[2],o)});
  const usesCause=sp[2].includes('{c}');
  if(r.hook&&Math.random()<(usesCause?.4:.85))L.push({who:'boy',text:r.hook});
  if(Math.random()<.45)L.push({who:'narration',text:pickNR('aside',POOL.aside)});
  if(Math.random()<.7)L.push({who:'boy',text:pickNR('close',POOL.close)});
  L.push({who:'girl',text:pickNR('fin',POOL.fin)});
  const tsk=(f.odd&&Math.random()<.5)?fill(pickNR('tso',POOL.tskOdd),o):pickNR('ts'+d,POOL.tsk[d]);
  return{lines:L,used_meaning:sp[0],technique:sp[1],kojitsuke:Math.min(100,d*17+rnd(14)),tsukkomi:tsk,mode:'fixed'};
}

}

  gachaEl.innerHTML=cardHTML(f);gachaEl.hidden=false;dim.classList.add('on');
  ui.lock=false;ui.gachaWait=true;ui.flip=false;
  const t0=performance.now();
  while(!ui.flip&&performance.now()-t0<1100){await sleep(40,t)}
  ui.gachaWait=false;ui.flip=false;
  $('#card').classList.remove('shake');$('#card').classList.add('flip');
  refocus();
  await sleep(750,t);
  const R=RR[f.d];
  await say('narration',`【${R.label}・${R.name}】${f.name}。`);
  await say('narration',`花言葉は——${f.m.map(x=>'「'+x+'」').join('')}。`);
  await say('narration',DLINE[f.d]+(f.odd?'……しかも色物枠だ。':''));
  gachaEl.hidden=true;dim.classList.remove('on');
  if(!p.done){
    tb.hidden=false;tbName.hidden=true;tb.classList.add('nar');tb.classList.remove('big');arrow.hidden=true;
    tbText.textContent='蒼真は花言葉の解釈をねじ曲げている・・・';
    while(!p.done){chk(t);await sleep(100,t)}
  }
  return{f,s:p.val};
}
async function playScript(t,g){
  const {f,s}=g;
  
  
  const boys=s.lines.map((l,i)=>[l,i]).filter(x=>x[0].who==='boy');
  let ri=boys.find(x=>x[0].text.includes(f.name));
  ri=ri?ri[1]:(boys[1]?boys[1][1]:(boys[0]?boys[0][1]:0));
  for(let i=0;i<s.lines.length;i++){
    const l=s.lines[i];
    if(i===ri){$('#hand').innerHTML=flowerInner(f);boyEl.classList.add('reach')}
    await say(l.who,l.text);
  }
  stage.classList.add('pink');girlEl.classList.remove('cry');girlEl.classList.add('happy');startSparks();
  await say('girl','ｽﾃｷ……',{big:true});
}
function showResult(g){
  const {f,s}=g;const R=RR[f.d];
  stats.tries++;stats.success++;store.set('hk-stats',stats);
  const boysT=s.lines.filter(l=>l.who==='boy').map(l=>l.text);
  const best=boysT.reduce((a,b)=>b.length>a.length?b:a,'');
  const z=zk[f.id]||{count:0};zk[f.id]={count:z.count+1,line:best,used:s.used_meaning,technique:s.technique};store.set('hk-zukan',zk);
  tb.hidden=true;ui.lock=true;
  resultEl.innerHTML=`<div class="rbox"><div class="stamp" id="stamp">成立</div>
  <div class="rfl">${flowerSVG(f)}<div class="nm">${esc(f.name)}</div><span class="chip" style="background:${R.color}">${R.label}・${R.name}</span></div>
  <div class="rinfo">
   <div class="quote">「${esc(s.used_meaning)}」</div>
   <div class="row"><span class="k">こじつけ技法</span><span>${esc(s.technique)}</span></div>
   <div class="row"><span class="k">こじつけ度</span><div class="bar"><i id="bk"></i><b>${s.kojitsuke}%</b></div></div>
   <div class="row"><span class="k">ｽﾃｷ度</span><div class="bar"><i class="s" id="bs"></i><b>100%</b></div></div>
   <div class="tsk">${esc(s.tsukkomi)}</div>
   <div class="total">通算成立回数　${stats.success}回</div>
   <div class="rbtns"><button type="button" id="rAgain">別の花で贈る</button><button type="button" id="rOther">別の状況で</button><button type="button" id="rZ">花図鑑</button></div>
  </div></div>`;
  resultEl.hidden=false;
  $('#rAgain').onclick=()=>run('again');
  $('#rOther').onclick=()=>run('intro');
  $('#rZ').onclick=()=>openZukan();
  setTimeout(()=>{const st=$('#stamp');if(st)st.classList.add('go');const a=$('#bk'),b=$('#bs');if(a)a.style.width=s.kojitsuke+'%';if(b)b.style.width='100%'},60);
  try{$('#rAgain').focus({preventScroll:true})}catch(e){}
}
/* はじめる直後だけ流す暗転。「別の花で贈る」「別の状況で」では出さない */
const PROLOGUE=['花言葉。','それは、花に添えられた一輪の言葉。','いかなるシチュエーションにおいても<br>引用すれば、なんとなくそれっぽくなる<br>魔法の言葉。','それはたとえ','どんな花であったとしても……。'];
let plSkipped=false;
$('#plSkip').onclick=e=>{e.stopPropagation();plSkipped=true;poke()};
async function playPrologue(t){
  const pl=$('#prologue'),box=$('#plText'),ar=$('#plArrow');
  plSkipped=false;ctrlEl.hidden=true;tb.hidden=true;
  box.innerHTML=PROLOGUE.map((s,i)=>`<p${i===PROLOGUE.length-1?' class="last"':''}>${s}</p>`).join('');
  pl.classList.remove('out');pl.hidden=false;
  const ps=[...box.children];
  try{
    for(let i=0;i<ps.length&&!plSkipped;i++){
      if(i)ps[i-1].classList.add('past');
      ps[i].classList.add('on');
      ui.guard=performance.now()+400;await sleep(500,t);
      ar.classList.add('on');
      ui.waiting=true;ui.adv=false;
      try{while(!ui.adv&&!plSkipped){chk(t);await sleep(30,t)}}finally{ui.waiting=false;ui.adv=false}
      ar.classList.remove('on');
    }
  }finally{
    ar.classList.remove('on');pl.classList.add('out');
    setTimeout(()=>{if(pl.classList.contains('out'))pl.hidden=true},850);
  }
  ctrlEl.hidden=false;refocus();
}
async function run(from){
  const t=++token;poke();
  closeModal(true);resetStage();titleEl.hidden=true;ctrlEl.hidden=false;
  skipMode=false;autoMode=false;syncBtns();setMode(modeText());
  initSample();ui.lock=false;refocus();
  try{
    if(from==='start')await playPrologue(t);
    if(from==='intro'||from==='start'||!reason){reason=nextReason();await playIntro(t);await playChoices(t)}
    const g=await playGacha(t);
    await playScript(t,g);
    chk(t);showResult(g);
  }catch(e){
    if(!(e instanceof Abort)){console.error(e);if(t===token){tb.hidden=false;tbName.hidden=true;tbText.textContent='……何かがおかしい。タイトルに戻ってやり直そう。';}}
  }
}
function toTitle(){
  token++;poke();closeModal(true);resetStage();skipMode=false;autoMode=false;syncBtns();
  ctrlEl.hidden=true;titleEl.hidden=false;ui.lock=true;
  try{$('#mStart').focus({preventScroll:true})}catch(e){}
}

/* ---------- modals ---------- */
function closeModal(silent){
  const open=stage.querySelectorAll('.modal:not([hidden])');
  if(!open.length)return;
  const dz=$('#zDetail');
  if(!silent&&dz&&!dz.hidden&&$('#mZ').hidden===false){dz.hidden=true;return}
  open.forEach(m=>m.hidden=true);dz.hidden=true;
  if(!silent)refocus();
}
stage.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal()));
$('#zdBack').onclick=()=>{$('#zDetail').hidden=true};
function openLog(){
  const L=$('#logList');
  L.innerHTML=logs.length?logs.map(l=>`<div class="lg ${l.cls||''}">${l.n?`<span class="n">${esc(l.n)}</span>`:''}${esc(l.t)}</div>`).join(''):'<div class="lg nr">まだ記録がありません。</div>';
  $('#mLog').hidden=false;const b=$('#logBody');b.scrollTop=b.scrollHeight;
}
function openSettings(){
  const defs=[
    ['文字速度','speed',[[60,'ゆっくり'],[32,'ふつう'],[14,'はやい'],[0,'瞬間']],null],
    ['画面比率','ratio',[['auto','自動'],['169','16:9'],['43','4:3'],['916','縦長 9:16']],null],
    ['オートの待ち時間','autoWait',[[700,'700ms'],[1400,'1400ms'],[2400,'2400ms']],null]];
  const body=$('#setBody');body.innerHTML='';
  defs.forEach(([lb,key,opts,note])=>{
    const w=document.createElement('div');w.className='set';
    w.innerHTML=`<div class="lb">${lb}</div>`;
    const sg=document.createElement('div');sg.className='segs';
    opts.forEach(([v,tx])=>{const b=document.createElement('button');b.type='button';b.className='seg'+(cfg[key]===v?' on':'');b.textContent=tx;
      b.onclick=()=>{cfg[key]=v;store.set('hk-cfg',cfg);sg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(key==='ratio')fit();};sg.appendChild(b)});
    w.appendChild(sg);if(note){const p=document.createElement('p');p.textContent=note;w.appendChild(p)}
    body.appendChild(w);
  });
  $('#mSet2').hidden=false;
}
function openZukan(){
  const grid=$('#zGrid');grid.innerHTML='';let got=0;
  FL.forEach(f=>{
    const z=zk[f.id],R=RR[f.d];const c=document.createElement('div');c.className='zc'+(z?'':' un');c.style.setProperty('--rc',R.color);
    if(z){got++;c.innerHTML=`${flowerSVG(f)}<span class="zn">${esc(f.name)}</span><span class="zr">${R.label}</span><span class="zt">×${z.count}</span>`;c.onclick=()=>zDetail(f)}
    else c.innerHTML=`<div class="zq">？？？</div><span class="zr">${R.label}</span>`;
    grid.appendChild(c);
  });
  $('#zCount').textContent=`${got} / ${FL.length}`;
  $('#zDetail').hidden=true;$('#mZ').hidden=false;
}
function zDetail(f){
  const z=zk[f.id],R=RR[f.d];
  $('#zdT').textContent=f.name;
  $('#zdBody').innerHTML=`<div class="dtl">${flowerSVG(f)}<div><h3>${esc(f.name)} <span class="chip" style="background:${R.color}">${R.label}・${R.name}</span></h3><p><span class="k">${f.odd?'特徴':'漢字名'}</span>${esc(f.kana)}</p><p><span class="k">花言葉</span>${f.m.map(x=>'「'+esc(x)+'」').join('')}</p><p><span class="k">前回の技法</span>${esc(z.technique||'—')}（引用: 「${esc(z.used||'—')}」）</p><p><span class="k">決め台詞</span>「${esc(z.line||'—')}」</p><p><span class="k">贈った回数</span>${z.count}回</p></div></div>`;
  $('#zDetail').hidden=false;
}

/* ---------- wiring ---------- */
$('#mStart').onclick=()=>{initSample();run('start')};
$('#mZukan').onclick=()=>openZukan();
$('#mSet').onclick=()=>openSettings();
$('#bLog').onclick=()=>{openLog()};
$('#bAuto').onclick=()=>{autoMode=!autoMode;if(autoMode)skipMode=false;syncBtns();refocus()};
$('#bSkip').onclick=()=>{skipMode=!skipMode;if(skipMode)autoMode=false;syncBtns();if(skipMode)poke();refocus()};
$('#bSet').onclick=()=>openSettings();
$('#bTitle').onclick=()=>toTitle();

/* ---------- fit ---------- */
const DIM={'169':[1024,576],'43':[960,720],'916':[450,800]};
const TOUCH=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const TB_BASE={'169':38,'43':40,'916':40};
function fit(){
  const w=wrap.clientWidth||innerWidth,h=wrap.clientHeight||innerHeight;
  let r=cfg.ratio;if(!DIM[r])r=(w/h>=0.75)?'169':'916';
  let [W,H]=DIM[r];
  // 縦持ちのスマホは縦長の画面いっぱいに使う（幅は固定、高さだけ800〜1000で伸縮）
  if(r==='916')H=Math.round(Math.min(1000,Math.max(800,W*h/w)));
  stage.classList.remove('r169','r43','r916');stage.classList.add('r'+r);
  stage.style.width=W+'px';stage.style.height=H+'px';
  const k=Math.min(w/W,h/H);
  stage.style.transform=`translate(-50%,-50%) scale(${k})`;
  // 小さく表示されるとき・タッチ操作のときは、ボタンや小さい文字を大きくする
  const ui=Math.min(1.6,Math.max(TOUCH?1.25:1,0.85/k));
  stage.style.setProperty('--ui',ui.toFixed(3));
  stage.style.setProperty('--tbBottom',Math.round(TB_BASE[r]+(ui-1)*44)+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();setTimeout(fit,100);
try{document.fonts&&document.fonts.ready&&document.fonts.ready.then(fit)}catch(e){}
initSample();
setMode(modeText());
try{$('#mStart').focus({preventScroll:true})}catch(e){}

/* ---------- スマホ向けの小物 ---------- */
(function(){
  if(TOUCH){const h=$('#hint');if(h)h.textContent='画面をタップで進行';}
  const fb=$('#mFull');
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const canFS=document.fullscreenEnabled&&document.documentElement.requestFullscreen;
  if(fb&&TOUCH&&canFS&&!standalone){
    fb.hidden=false;
    fb.onclick=()=>{document.documentElement.requestFullscreen().catch(()=>{}).finally(()=>setTimeout(fit,150))};
    document.addEventListener('fullscreenchange',()=>{fb.hidden=!!document.fullscreenElement});
  }
})();
