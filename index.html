<style>
/* Layout: 固定論理解像度のステージを画面に合わせて等倍率で拡大縮小。余白は背景SVGのぼかし複製で埋める。 */
:root{
  --night:#14102e; --dusk:#2a2150; --veil:rgba(20,16,50,.88);
  --rose:#e0708f; --rose2:#a73f6b; --gold:#d9b36a; --cream:#f6ecff; --ink:#160f2a;
  --font-serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','MS PMincho',serif;
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font-ui);overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;inset:0;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none}
#bgfill{position:absolute;inset:-6%;filter:blur(28px) brightness(.42)}
#bgfill svg{width:100%;height:100%;display:block}
#stage{position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:#2a2a5e;box-shadow:0 0 40px rgba(0,0,0,.6)}
#stage *{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* --- stage layers --- */
#bg{position:absolute;inset:0;z-index:0}
#bg svg{width:100%;height:100%;display:block}
.petal{fill:#f7b6cc;opacity:.85;animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translate(0,-80px) rotate(0)}to{transform:translate(-420px,1020px) rotate(540deg)}}
#veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(255,196,226,.82),rgba(255,140,200,.62));opacity:0;transition:opacity 1.2s;pointer-events:none}
.pink #veil{opacity:1}
#cast{position:absolute;inset:0;z-index:5;pointer-events:none}
.char{position:absolute;bottom:0}
.char svg{height:100%;width:auto;display:block;overflow:visible;filter:drop-shadow(3px 0 0 rgba(255,168,110,.6))}
.char .sil{fill:var(--ink)}
.char .hair{fill:#2b1d48}
.char .ln{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
#girl .p-happy,#girl.happy .p-cry{display:none}
#girl.happy .p-happy{display:inline}
#girl.happy svg{filter:drop-shadow(0 0 7px #ff8fc8) drop-shadow(0 0 16px #ffc2e2)}
#girl.cry svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.tear{fill:#9bd1ff;animation:tear 1.2s ease-in infinite}
.tear.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
#boy .p-reach,#boy.reach .p-norm{display:none}

#sparks{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.sp{position:absolute;bottom:-20px;color:#fff;text-shadow:0 0 8px #ffd9ee;animation:rise linear forwards;opacity:0}
.sp.b{border:2px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,255,255,.18);text-shadow:none}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-640px) scale(1.1);opacity:0}}
#dim{position:absolute;inset:0;z-index:9;background:rgba(10,6,30,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#dim.on{opacity:1}
/* gacha card */
#gacha{position:absolute;z-index:12;left:50%;transform:translateX(-50%);perspective:900px;cursor:pointer}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.44);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.shake{animation:shake .45s ease-in-out infinite}

.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.6)}

.rband{background:var(--rc);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font:700 calc(var(--cw)*.075)/1.2 var(--font-ui);letter-spacing:.06em}

#tbText{font:500 var(--tbFs)/1.7 var(--font-serif);letter-spacing:.04em;white-space:pre-wrap;overflow:hidden;height:100%}

#arrow{position:absolute;right:16px;bottom:8px;color:var(--gold);animation:arr .8s ease-in-out infinite;font-size:16px}
@keyframes arr{50%{transform:translateY(5px)}}
#ctrl{position:absolute;z-index:17;left:6%;width:88%;bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#mode{display:none!important;font:500 11px/1 var(--font-ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:5px 8px;border-radius:10px;white-space:nowrap}
#ctrlBtns{display:flex;gap:5px}

.stamp.go{animation:stamp .5s .25s cubic-bezier(.3,1.6,.5,1) forwards}

.modal{position:absolute;inset:0;z-index:40;background:rgba(10,7,30,.82);display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none}
.mbox{width:90%;height:88%;background:var(--dusk);border:1.5px solid var(--gold);display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* ===== スマホ対応：小さい文字・ボタンを --ui 倍に ===== */

/* ---------- engine ---------- */
class Abort extends Error{}
let token=0,skipMode=false,autoMode=false;
const ui={typing:false,skipType:false,waiting:false,adv:false,lock:true,gachaWait:false,flip:false,guard:0};
const wakers=new Set();
const poke=()=>[...wakers].forEach(f=>f());
const chk=t=>{if(t!==token)throw new Abort()};
function sleep(ms,t){return new Promise((res,rej)=>{let h;const done=()=>{clearTimeout(h);wakers.delete(done);t!==token?rej(new Abort()):res()};h=setTimeout(done,ms);wakers.add(done)})}
const logs=[];
function pushLog(n,t,cls){logs.push({n,t,cls});if(logs.length>200)logs.shift()}
const modalOpen=()=>!!stage.querySelector('.modal:not([hidden])');
function refocus(){try{tb.focus({preventScroll:true})}catch(e){}}
function syncBtns(){$('#bAuto').classList.toggle('on',autoMode);$('#bSkip').classList.toggle('on',skipMode)}
function setMode(txt){$('#mode').textContent='台詞: '+txt}
function modeText(){return ''}

async function say(who,text,o={}){
  const t=token;chk(t);
  const nar=who!=='boy'&&who!=='girl';
  const name=who==='boy'?'蒼真':who==='girl'?'ひより':'';
  const shown=nar?text:'「'+text+'」';
  pushLog(name,shown,nar?'nr':'');
  tb.hidden=false;tbName.hidden=!name;tbName.textContent=name;
  tb.classList.toggle('nar',nar);tb.classList.toggle('big',!!o.big);
  arrow.hidden=true;tbText.textContent='';
  ui.typing=true;ui.skipType=false;ui.guard=performance.now()+150;
  const sp=cfg.speed;
  for(let i=1;i<=shown.length;i++){
    chk(t);
    if(ui.skipType||sp===0||skipMode){tbText.textContent=shown;break}
    tbText.textContent=shown.slice(0,i);
    await sleep(/[、。！？…]/.test(shown[i-1])?sp*5:sp,t);
  }
  tbText.textContent=shown;ui.typing=false;
  if(o.noWait)return;
  arrow.hidden=false;
  await waitAdvance(t,shown.length);
  arrow.hidden=true;
}
async function waitAdvance(t,len){
  ui.waiting=true;ui.adv=false;let start=performance.now();
  try{
    for(;;){
      chk(t);
      if(modalOpen()||ui.lock){start=performance.now()}
      else{
        if(ui.adv){ui.adv=false;break}
        const el=performance.now()-start;
        if(skipMode&&el>=90)break;
        if(autoMode&&el>=cfg.autoWait+len*28)break;
      }
      await sleep(30,t);
    }
  }finally{ui.waiting=false}
}
function advance(){
  if(modalOpen()||ui.lock)return;
  // オート・スキップ中の入力は、まずモードを止めるだけにする（勝手に読み飛ばさない）
  if(skipMode||autoMode){skipMode=false;autoMode=false;syncBtns();return}
  if(ui.gachaWait){ui.flip=true;poke();return}
  // 行が出た直後・全文表示した直後の連打は無視（ダブルクリックで1行飛ばさないため）
  const now=performance.now();if(now<ui.guard)return;
  if(ui.typing){ui.skipType=true;ui.guard=now+220;poke();return}
  if(ui.waiting){ui.adv=true;poke()}
}
wrap.addEventListener('click',e=>{if(e.target.closest('button,.modal,#gacha,#choices,#result,#title'))return;advance()});
gachaEl.addEventListener('click',()=>{if(ui.gachaWait){ui.flip=true;poke()}});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  if(!choicesEl.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const bs=[...choicesEl.querySelectorAll('button')];let i=bs.indexOf(document.activeElement);
    i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].focus();e.preventDefault();return}
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){
    if(e.repeat){e.preventDefault();return}
    const a=document.activeElement;
    if(a&&a.tagName==='BUTTON'&&a.offsetParent!==null)return;
    if(modalOpen()||ui.lock)return;
    e.preventDefault();advance();
  }
});

function choice(opts){
  return new Promise(res=>{
    ui.lock=true;skipMode=false;syncBtns();tb.hidden=true;
    choicesEl.innerHTML='';
    opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='band';b.textContent=o;
      b.onclick=()=>{choicesEl.hidden=true;ui.lock=false;pushLog('','▶ '+o,'c');refocus();res(i)};choicesEl.appendChild(b)});
    choicesEl.hidden=false;choicesEl.firstChild.focus();
  });
}

ら閉じ込める。"],"baito":["寂しさ","説教の延長戦","寂しさ。……怒られた後の帰り道は、寂しい。三回分の『すみません』が、まだ胸に残っている。","その三回分は、俺が全部聞く。君の『いらっしゃいませ』が、また明るく戻るまで。","……全部、聞いてくれるの……","店長の説教の後で男が延長戦を申し出る。"],"tanjoubi":["寂しさ","花からの伝聞","寂しさ。……誰にも気づかれない誕生日は、寂しい。だが、キンセンカは、どの月の誕生日にも咲いている花だ。","この花だけは、最初から知っていた。俺は……この花から聞いたんだ。誕生日、おめでとう。","……花から、聞いたの……","誕生日を知った経緯が花からの伝聞。"],"wasabi":["失望","三秒の価値","失望。……わさびか。この涙が三秒で消えるのは、少しだけ残念だ。それほど、君の涙は綺麗だった。","三秒で消える涙のためにも、この花は咲いていた。","……三秒、のために……","わさびの涙に三秒限定の値がついた。"],"cookie":["別れの悲しみ","望まない出会い","別れの悲しみ。……このクッキーは、砂糖と別れ、塩と出会ってしまった。望まない出会いだ。","望まない出会いから始まる恋もある。……このクッキーも、きっと誰かを笑顔にする。","……誰かを、笑顔に……","砂糖と塩の取り違えを恋愛ものとして語っている。"]},"erica":{"kingyo":["孤独","孤独の不在証明","孤独。……きんちゃんは、ずっと水槽で一匹だった。……だが、毎朝君が覗いていた。孤独なんて、知らずに生きたんだ。","この花は、孤独を知らずに逝った金魚への勲章だ。……君が、そうさせたんだ。","……私が、きんちゃんを……","金魚に勲章は重すぎる。しかも授与式に本人がいない。"],"pudding":["孤独","孤独な夜の開花","孤独。……今夜、プリンを失った君は孤独だ。冷蔵庫を開けても、誰も待っていない。","だが、孤独な夜にだけ咲く花がある。……それが、今の君だ。","……プリンの夜に、咲く……","プリン一個にしては夜が深い。"],"oshi":["寂しさ","全国合唱論","寂しさ。……今夜、全国のファンが同じ寂しさを抱えている。君は一人で泣いているんじゃない。合唱しているんだ。","君たちは、小さな花が集まって咲くエリカだ。その中で一番きれいに泣いているのが、君だ。","……一番、きれいに……","全国のファンを敵に回す発言。本人は褒めたつもりでいる。"],"juken":["孤独","荒れ地の英才教育","孤独。……エリカは、他の花が育たない荒れ地で咲く。今の君は、たぶん荒れ地にいる。","荒れ地に咲く花は、どこよりも強い。来年の春、君はどこでも咲ける。","……どこでも、咲ける……","荒れ地育ちを英才教育とは言わない。"],"taikai":["孤独","孤独の栄誉","孤独。……あの一球のとき、君は孤独だった。誰も代わりに投げられないからな。","だが、その孤独に耐えた者だけが、最後の一球を任される。……誇っていい。","……誇って、いいのかな……","その一球で負けてはいる。"],"tamanegi":["寂しさ","みじん切りの手向け","寂しさ。……玉ねぎは今、まな板の上で寂しく刻まれている。君の涙は、玉ねぎへの手向けだ。","玉ねぎのためにさえ泣ける君は、世界一優しい人だ。","……玉ねぎ、なんだけどな……","褒める相手は玉ねぎの方では。"],"eiga":["寂しさ","忠犬の後任","寂しさ。……映画館を出ると、犬のいない世界に戻ってくる。それが、一番寂しい。","なら、これからは俺が君のそばにいる。……あの犬ほど、忠実にな。","……あの犬ほど……ずるい……","犬と張り合う男。"],"furare":["孤独","泣きながらの開花","孤独。……エリカは、荒れ地でも一人で咲く。三年分の想いを抱えたまま、一人で咲けるか、今試されている。","答えはもう出ている。泣きながら咲く花ほど、美しいものはない。","……咲いてる、のかな……私……","号泣を開花と言い張る強さ。"],"gacha":["寂しさ","一途さの換算","寂しさ。……ガチャ画面の中で、目当てのキャラも寂しがっている。天井まで回してくれた君に、会えなかったからな。","だが、天井まで想い続けた君の一途さは、どんなレアより輝いている。","……一途、だったんだ……私……","一途の代償が天井分。愛の値段としてはわりと具体的。"],"kasa":["孤独","人間傘の着任","孤独。……盗まれた傘は今、知らない人の家の傘立てで、孤独に立っている。","傘が孤独に耐えているのなら、今日は俺が、君の傘になる。","……傘に、なってくれるの……","人間は傘ほど畳めない。"],"sumaho":["寂しさ","通知より速い男","寂しさ。……画面が割れて、今夜は誰からの連絡も読みにくい。寂しい夜になるな。","だが、どんな通知より先に、俺がここに来た。君のために。","……通知より、先に……","通知より速く駆けつける男はだいたい怖い。花を持っている分さらに怖い。"],"report":["孤独","三時間の証人","孤独。……三時間、君は画面と二人きりだった。孤独な作業だ。その相手に、最後は裏切られた。","その孤独な三時間を知っているのは、もう俺とこの花だけだ。","……知ってて、くれるんだ……","証人が二人いる。どちらも中身を一行も読んでいない。"],"maegami":["孤独","鏡への同席","孤独。……美容院の椅子は、孤独な場所だ。鏡の中の自分と二人きりで、切られていくのを見ているしかない。","だが今、鏡の中の君は一人じゃない。……隣に、俺が映っている。","……隣に……","鏡に映り込む位置取りがうまい。"],"akaten":["寂しさ","花丸の自主採点","寂しさ。……赤点の答案は、丸が少なくて寂しい。だが見てくれ。この花は、小さな丸がたくさん並んで咲く。","君の答案に足りなかった丸は、全部この花が咲かせてくれる。","……丸、いっぱい……","花丸は採点ではなく自己申告。"],"tenkou":["寂しさ","寂しさの本番","寂しさ。……来月から、寂しくなる。だが、まだ一か月ある。寂しさは、本番まで取っておこう。","本番が来たとき、思い出の多い方が勝つ。……今月は、俺も付き合う。","……付き合って、くれるんだ……","寂しさにもリハーサルがあるらしい。"],"geki":["孤独","舞台の荒れ地","孤独。……舞台の上は、孤独だ。噛んだ瞬間、助けてくれる人は誰もいない。","それでも最後まで言い切った。荒れ地のエリカのように、君は舞台で咲いたんだ。","……咲いて、たのかな……","噛んだ人に開花宣言。"],"save":["寂しさ","仲間枠の自薦","寂しさ。……新しいセーブデータは、最初はいつも寂しい。仲間もアイテムも、まだ何もない。","最初の仲間は、俺だ。……百時間でも、二百時間でも付き合う。","……二百時間……ずるい……","二百時間付き合うと言い出した男が一番重い。"],"loveletter":["孤独","空き箱の伏線","孤独。……本命の靴箱は今、手紙を待ったまま、孤独に空っぽだ。","空っぽの靴箱は、まだ君の想いを待っている。……二通目は、きっと一通目より強く書ける。","……もう一回、書けるかな……","誤配を伏線と呼ぶのは書き手だけ。"],"yakisoba":["孤独","麺の看取り","孤独。……シンクに落ちた麺は、ソースにも会えず、孤独に冷えていく。","せめて君だけは、あの麺の最期を覚えていてやれ。それが、別れの作法だ。","……麺の、最期……","麺に別れの作法は要らない。"],"kafun":["寂しさ","大きさの逆転","寂しさ。……この花は小さすぎて、目立たない。……今の君の目では、たぶん見えてもいない。","見えないほど小さな花でも、君を想う気持ちは、誰より大きい。","……ずるい……っくしゅ……","花粉の話から逃げ切った。"],"baito":["孤独","開花予定地","孤独。……怒られた後のバイト先は、孤独だ。誰とも目が合わない。","だが、この花は荒れ地でこそ咲く。明日の店は、君が咲く場所だ。","……咲く場所……","職場は開花予定地ではない。"],"tanjoubi":["寂しさ","来年の予約","寂しさ。……寂しい誕生日には、寂しさの花がいい。今日の君の気持ちを、ちゃんと分かっている花だからな。","この花は、来年まで咲かせておく。……来年は、誰より先に祝うために。","……一番に、祝ってね……","今年の分はどこへ行ったのか。来年まで咲かせる気なのも気になる。"],"wasabi":["孤独","三秒の立会人","孤独。……わさびが鼻を抜ける、あの一瞬。人は誰もが、ひとりきりだ。","だが君はもう、ひとりじゃない。その三秒を、俺が隣で数えていた。","……三秒、一緒に……","わさびの三秒に運命が立ち会った。"],"cookie":["寂しさ","一枚目の予約","寂しさ。……塩のクッキーは、誰にも手に取ってもらえず、寂しく皿に残る。","なら、その一枚目は俺がもらう。君の手作りが、寂しいわけがない。","……しょっぱいのに……","一枚目だけ予約する慎重さ。"]},"marigold":{"kingyo":["悲しみ","死者の道しるべ","悲しみ。……マリーゴールドは、亡くなった者が帰ってくる道しるべの花でもあるんだ。お盆には、きんちゃんがこの花を目印に帰ってくる。","水槽は、そのままにしておこう。","……帰ってきたら、エサあげなきゃ……","お盆の金魚のために水槽を予約した。"],"pudding":["嫉妬","嫉妬の正当化","嫉妬。……プリンを食べたお兄さんに、嫉妬していい。いや、するべきだ。あの甘さを味わうのは、本来君だったんだから。","嫉妬は、次のプリンを二倍おいしくする。","……二倍……","嫉妬をプリンの隠し味にした。"],"oshi":["絶望","絶望の先輩","絶望。……この花は、先に絶望を知っている先輩だ。推しの結婚に絶望した君の気持ちを、誰よりも分かってくれる。","先輩の背中を見ろ。ちゃんと、毎年咲いている。","……先輩、強い……","花が推しの結婚を乗り越えた先輩扱い。"],"juken":["絶望","絶望の底打ち","絶望。……絶望とは、底のことだ。底に着いたなら、あとは上がるしかない。蹴れる地面がある分、むしろ有利だ。","マリーゴールドは、どんな痩せた土でも咲く。","……底、蹴っていいんだ……","不合格を踏み切り板にした。"],"taikai":["悲しみ","涙の価値","悲しみ。……悲しいのは、本気だった証拠だ。適当にやっていた奴は、最後の一球で泣かない。","この花は、本気だった奴にだけ渡すことにしている。","……本気だったよ……","悔し涙に本気の証明書が発行された。"],"tamanegi":["悲しみ","偽の悲しみへの献花","悲しみ。……玉ねぎの涙は、悲しみのない涙だ。だから、この花で、涙に悲しみを足してあげよう。それで釣り合いが取れる。","……いや、足さなくていいか。","……足さなくていいよ……","涙に悲しみを足そうとしてやめた。"],"eiga":["悲しみ","共同喪主","悲しみ。……あの犬のために、一緒に悲しもう。君一人で背負うには、あの犬は良い子すぎた。","今日は、二人で喪に服そう。……映画の犬の。","……映画の犬の、喪……","フィクションの犬の喪に二人で服した。"],"furare":["絶望","絶望の分解","絶望。……望みが絶える、と書く。つまり、あの人への望みは今日で絶えた。空いた場所に、新しい望みが入る。","この花は、引っ越しのお祝いだ。","……心の、引っ越し……","失恋が心の引っ越し扱い。"],"gacha":["絶望","天井の物理学","絶望。……天井まで回して出ないのは、絶望だ。だが、天井があるということは、その上に空があるということだ。","……次は、空を目指そう。","……空って、なに……？","天井の上の空とは何なのか。"],"kasa":["嫉妬","傘への嫉妬","嫉妬。……俺は、君の傘に嫉妬していた。毎日君と一緒に帰れるなんて、ずるいじゃないか。","これからは、俺が隣を歩く。……傘の代わりに。","……蒼真くん、雨は防げないよね……","傘泥棒より動機のある男がここにいる。"],"sumaho":["悲しみ","画面の涙","悲しみ。……画面のひびは、スマホが流した涙の跡なんだ。君と一緒に、泣いてくれたんだ。","修理に出すまで、この花を待ち受けにしよう。","……ひび越しの、待ち受け……","スマホのひびが涙の跡になった。"],"report":["絶望","絶望の再利用","絶望。……三時間分の絶望は、無駄にならない。次のレポートのテーマにすればいい。『データ消失と人間の心理』だ。","実体験に勝る資料はない。","……それ、何の授業……？","データ消失を次のレポートの題材にした。"],"maegami":["嫉妬","眉への嫉妬","嫉妬。……今まで前髪に隠れていた君の眉に、世界が嫉妬している。こんなにいい形の眉を、隠していたなんて。","前髪は伸びるが、今の君は今しか見られない。","……眉、褒められたの、はじめて……","前髪の失敗が眉の公開記念日に。"],"akaten":["絶望","赤の同一視","絶望。……赤点は、絶望の色じゃない。この花と同じ、燃える色だ。……オレンジに近い、赤だ。","追試の答案は、この色で燃やしてやれ。……いや、燃やしたら駄目だ。解いてくれ。","……燃やしちゃ、駄目なんだ……","赤とオレンジを同じ色だと言い張った。"],"tenkou":["悲しみ","道しるべ","悲しみ。……マリーゴールドは、大切な人が帰ってくる道の目印に飾る花なんだ。親友が帰ってくる日のために、育てておこう。","毎年咲くたびに、その日が近づく   L.push({who:'girl',text:pickNR('fin',POOL.fin)});
  const tsk=(f.odd&&Math.random()<.5)?fill(pickNR('tso',POOL.tskOdd),o):pickNR('ts'+d,POOL.tsk[d]);
  return{lines:L,used_meaning:sp[0],technique:sp[1],kojitsuke:Math.min(100,d*17+rnd(14)),tsukkomi:tsk,mode:'fixed'};
}

function initSample(){}
async function getScript(f,r){return compose(f,r)}

/* ---------- gacha card ---------- */
function cardHTML(f){
  const R=RR[f.d];
  return `<div class="card shake" id="card"><div class="face back">？</div><div class="face front${f.d===5?' ur':''}" style="--rc:${R.color}"><div class="rband"><span class="stars">${'★'.repeat(f.d)}</span><b>${R.label}</b><span>${R.name}</span></div><div class="cfl">${flowerSVG(f)}</div><div class="cname">${esc(f.name)}</div><div class="ckana">${esc(f.kana)}</div><div class="cm">${f.m.map(x=>'「'+esc(x)+'」').join('')}</div>${f.odd?'<div class="oddtag">色物</div>':''}</div></div>`;
}
const DLINE={1:'……うん、普通にいい花だ。',2:'……ちょっと雲行きが怪しい。',3:'……これは、苦しいぞ。',4:'……どう考えても、泣いている女の子に渡す花ではない。',5:'……これはもう、渡す前から事故だ。'};

/* ---------- game flow ---------- */
let reason=null,lastFlower=null,cur=null;
/* 泣いている理由は「山札」方式：48件を一巡するまで同じものは出さない。山の切れ目でも直前と同じにはしない */
let reasonBag=[];
function nextReason(){
  if(!reasonBag.length){
    reasonBag=RS.slice();
    for(let i=reasonBag.length-1;i>0;i--){const j=rnd(i+1);[reasonBag[i],reasonBag[j]]=[reasonBag[j],reasonBag[i]]}
    if(reason&&reasonBag.length>1&&reasonBag[reasonBag.length-1]===reason){const k=rnd(reasonBag.length-1);[reasonBag[k],reasonBag[reasonBag.length-1]]=[reasonBag[reasonBag.length-1],reasonBag[k]]}
  }
  return reasonBag.pop();
}
async function playIntro(t){
  await say('narration','放課後。夕暮れの公園。');
  await say('narration','ベンチの端で、ひよりが肩を震わせていた。');
  await say('girl',reason.line);
  await say('boy','……ひより。');
}
async function playChoices(t){
  const hank=['蒼真はポケットを探った。出てきたのは、使用済みのレシートだけだった。','差し出されたハンカチは、なぜかしっとり湿っていた。——昨日の雨だ。','ハンカチを出そうとして、蒼真は気づいた。持っているのはティッシュの空き袋だけだった。'];
  const quiet=['蒼真は黙って隣に立った。……三分後、ひよりが小声で言った。「なんか言ってよ」','そっとしておくことにした。夕日が沈む。蒼真の足がしびれる。','静寂が流れた。その間、蒼真は二回、カッコいいポーズを変えた。'];
  for(;;){
    const i=await choice(['花を贈る','ハンカチを差し出す','そっとしておく']);
    if(i===0)return;
    await say('narration',pick(i===1?hank:quiet));
  }
}
async function playGacha(t){
  let f;do{f=pick(FL)}while(f.id===lastFlower&&FL.length>1);
  lastFlower=f.id;
  const p={done:false,val:null};
  p.promise=getScript(f,reason).then(v=>{p.val=v;p.done=true});
  skipMode=false;syncBtns();
  await say('narration','彼は懐に手を入れた。そこには——',{noWait:true});
  chk(t);
  gachaEl.innerHTML=cardHTML(f);gachaEl.hidden=false;dim.classList.add('on');
  ui.lock=false;ui.gachaWait=true;ui.flip=false;
  const t0=performance.now();
  while(!ui.flip&&performance.now()-t0<1100){await sleep(40,t)}
  ui.gachaWait=false;ui.flip=false;
  $('#card').classList.remove('shake');$('#card').classList.add('flip');
  refocus();
  await sleep(750,t);
  const R=RR[f.d];
  await say('narration',`【${R.label}・${R.name}】${f.name}。`);
  await say('narration',`花言葉は——${f.m.map(x=>'「'+x+'」').join('')}。`);
  await say('narration',DLINE[f.d]+(f.odd?'……しかも色物枠だ。':''));
  gachaEl.hidden=true;dim.classList.remove('on');
  if(!p.done){
    tb.hidden=false;tbName.hidden=true;tb.classList.add('nar');tb.classList.remove('big');arrow.hidden=true;
    tbText.textContent='蒼真は花言葉の解釈をねじ曲げている・・・';
    while(!p.done){chk(t);await sleep(100,t)}
  }
  return{f,s:p.val};
}
async function playScript(t,g){
  const {f,s}=g;
  
  
  const boys=s.lines.map((l,i)=>[l,i]).filter(x=>x[0].who==='boy');
  let ri=boys.find(x=>x[0].text.includes(f.name));
  ri=ri?ri[1]:(boys[1]?boys[1][1]:(boys[0]?boys[0][1]:0));
  for(let i=0;i<s.lines.length;i++){
    const l=s.lines[i];
    if(i===ri){$('#hand').innerHTML=flowerInner(f);boyEl.classList.add('reach')}
    await say(l.who,l.text);
  }
  stage.classList.add('pink');girlEl.classList.remove('cry');girlEl.classList.add('happy');startSparks();
  await say('girl','ｽﾃｷ……',{big:true});
}
function showResult(g){
  const {f,s}=g;const R=RR[f.d];
  stats.tries++;stats.success++;store.set('hk-stats',stats);
  const boysT=s.lines.filter(l=>l.who==='boy').map(l=>l.text);
  const best=boysT.reduce((a,b)=>b.length>a.length?b:a,'');
  const z=zk[f.id]||{count:0};zk[f.id]={count:z.count+1,line:best,used:s.used_meaning,technique:s.technique};store.set('hk-zukan',zk);
  tb.hidden=true;ui.lock=true;
  resultEl.innerHTML=`<div class="rbox"><div class="stamp" id="stamp">成立</div>
  <div class="rfl">${flowerSVG(f)}<div class="nm">${esc(f.name)}</div><span class="chip" style="background:${R.color}">${R.label}・${R.name}</span></div>
  <div class="rinfo">
   <div class="quote">「${esc(s.used_meaning)}」</div>
   <div class="row"><span class="k">こじつけ技法</span><span>${esc(s.technique)}</span></div>
   <div class="row"><span class="k">こじつけ度</span><div class="bar"><i id="bk"></i><b>${s.kojitsuke}%</b></div></div>
   <div class="row"><span class="k">ｽﾃｷ度</span><div class="bar"><i class="s" id="bs"></i><b>100%</b></div></div>
   <div class="tsk">${esc(s.tsukkomi)}</div>
   <div class="total">通算成立回数　${stats.success}回</div>
   <div class="rbtns"><button type="button" id="rAgain">別の花で贈る</button><button type="button" id="rOther">別の状況で</button><button type="button" id="rZ">花図鑑</button></div>
  </div></div>`;
  resultEl.hidden=false;
  $('#rAgain').onclick=()=>run('again');
  $('#rOther').onclick=()=>run('intro');
  $('#rZ').onclick=()=>openZukan();
  setTimeout(()=>{const st=$('#stamp');if(st)st.classList.add('go');const a=$('#bk'),b=$('#bs');if(a)a.style.width=s.kojitsuke+'%';if(b)b.style.width='100%'},60);
  try{$('#rAgain').focus({preventScroll:true})}catch(e){}
}
async function run(from){
  const t=++token;poke();
  closeModal(true);resetStage();titleEl.hidden=true;ctrlEl.hidden=false;
  skipMode=false;autoMode=false;syncBtns();setMode(modeText());
  initSample();ui.lock=false;refocus();
  try{
    if(from==='intro'||!reason){reason=nextReason();await playIntro(t);await playChoices(t)}
    const g=await playGacha(t);
    await playScript(t,g);
    chk(t);showResult(g);
  }catch(e){
    if(!(e instanceof Abort)){console.error(e);if(t===token){tb.hidden=false;tbName.hidden=true;tbText.textContent='……何かがおかしい。タイトルに戻ってやり直そう。';}}
  }
}
function toTitle(){
  token++;poke();closeModal(true);resetStage();skipMode=false;autoMode=false;syncBtns();
  ctrlEl.hidden=true;titleEl.hidden=false;ui.lock=true;
  try{$('#mStart').focus({preventScroll:true})}catch(e){}
}

/* ---------- modals ---------- */
function closeModal(silent){
  const open=stage.querySelectorAll('.modal:not([hidden])');
  if(!open.length)return;
  const dz=$('#zDetail');
  if(!silent&&dz&&!dz.hidden&&$('#mZ').hidden===false){dz.hidden=true;return}
  open.forEach(m=>m.hidden=true);dz.hidden=true;
  if(!silent)refocus();
}
stage.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal()));
$('#zdBack').onclick=()=>{$('#zDetail').hidden=true};
function openLog(){
  const L=$('#logList');
  L.innerHTML=logs.length?logs.map(l=>`<div class="lg ${l.cls||''}">${l.n?`<span class="n">${esc(l.n)}</span>`:''}${esc(l.t)}</div>`).join(''):'<div class="lg nr">まだ記録がありません。</div>';
  $('#mLog').hidden=false;const b=$('#logBody');b.scrollTop=b.scrollHeight;
}
function openSettings(){
  const defs=[
    ['文字速度','speed',[[60,'ゆっくり'],[32,'ふつう'],[14,'はやい'],[0,'瞬間']],null],
    ['画面比率','ratio',[['auto','自動'],['169','16:9'],['43','4:3'],['916','縦長 9:16']],null],
    ['オートの待ち時間','autoWait',[[700,'700ms'],[1400,'1400ms'],[2400,'2400ms']],null]];

  defs.forEach(([lb,key,opts,note])=>{
    const w=document.createElement('div');w.className='set';

      b.onclick=()=>{cfg[key]=v;store.set('hk-cfg',cfg);sg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(key==='ratio')fit();};sg.appendChild(b)});
    w.appendChild(sg);if(note){const p=document.createElement('p');p.textContent=note;w.appendChild(p)}
    body.appendChild(w);
  });

}

}

/* ---------- fit ---------- */
const DIM={'169':[1024,576],'43':[960,720],'916':[450,800]};
const TOUCH=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const TB_BASE={'169':38,'43':40,'916':40};
function fit(){
  const w=wrap.clientWidth||innerWidth,h=wrap.clientHeight||innerHeight;
  let r=cfg.ratio;if(!DIM[r])r=(w/h>=0.75)?'169':'916';
  let [W,H]=DIM[r];
  // 縦持ちのスマホは縦長の画面いっぱいに使う（幅は固定、高さだけ800〜1000で伸縮）
  if(r==='916')H=Math.round(Math.min(1000,Math.max(800,W*h/w)));
  stage.classList.remove('r169','r43','r916');stage.classList.add('r'+r);
  stage.style.width=W+'px';stage.style.height=H+'px';
  const k=Math.min(w/W,h/H);
  stage.style.transform=`translate(-50%,-50%) scale(${k})`;
  // 小さく表示されるとき・タッチ操作のときは、ボタンや小さい文字を大きくする
  const ui=Math.min(1.6,Math.max(TOUCH?1.25:1,0.85/k));
  stage.style.setProperty('--ui',ui.toFixed(3));
  stage.style.setProperty('--tbBottom',Math.round(TB_BASE[r]+(ui-1)*44)+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();setTimeout(fit,100);
try{document.fonts&&document.fonts.ready&&document.fonts.ready.then(fit)}catch(e){}
initSample();
setMode(modeText());
try{$('#mStart').focus({preventScroll:true})}catch(e){}

/* ---------- スマホ向けの小物 ---------- */
(function(){
  if(TOUCH){const h=$('#hint');if(h)h.textContent='画面をタップで進行';}
  const fb=$('#mFull');
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const canFS=document.fullscreenEnabled&&document.documentElement.requestFullscreen;
  if(fb&&TOUCH&&canFS&&!standalone){
    fb.hidden=false;
    fb.onclick=()=>{document.documentElement.requestFullscreen().catch(()=>{}).finally(()=>setTimeout(fit,150))};
    document.addEventListener('fullscreenchange',()=>{fb.hidden=!!document.fullscreenElement});
  }
})();
