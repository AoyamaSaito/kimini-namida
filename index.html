<style>
/* Layout: 固定論理解像度のステージを画面に合わせて等倍率で拡大縮小。余白は背景SVGのぼかし複製で埋める。 */
:root{
  --night:#14102e; --dusk:#2a2150; --veil:rgba(20,16,50,.88);
  --rose:#e0708f; --rose2:#a73f6b; --gold:#d9b36a; --cream:#f6ecff; --ink:#160f2a;
  --font-serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','MS PMincho',serif;
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font-ui);overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;inset:0;overflow:hidden;background:var(--night);user-select:none;-webkit-user-select:none}
#bgfill{position:absolute;inset:-6%;filter:blur(28px) brightness(.42)}
#bgfill svg{width:100%;height:100%;display:block}
#stage{position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:#2a2a5e;box-shadow:0 0 40px rgba(0,0,0,.6)}
#stage *{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* --- stage layers --- */
#bg{position:absolute;inset:0;z-index:0}
#bg svg{width:100%;height:100%;display:block}
.petal{fill:#f7b6cc;opacity:.85;animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translate(0,-80px) rotate(0)}to{transform:translate(-420px,1020px) rotate(540deg)}}
#veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(255,196,226,.82),rgba(255,140,200,.62));opacity:0;transition:opacity 1.2s;pointer-events:none}
.pink #veil{opacity:1}
#cast{position:absolute;inset:0;z-index:5;pointer-events:none}
.char{position:absolute;bottom:0}
.char svg{height:100%;width:auto;display:block;overflow:visible;filter:drop-shadow(3px 0 0 rgba(255,168,110,.6))}
.char .sil{fill:var(--ink)}
.char .hair{fill:#2b1d48}
.char .ln{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
#girl .p-happy,#girl.happy .p-cry{display:none}
#girl.happy .p-happy{display:inline}
#girl.happy svg{filter:drop-shadow(0 0 7px #ff8fc8) drop-shadow(0 0 16px #ffc2e2)}
#girl.cry svg{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.tear{fill:#9bd1ff;animation:tear 1.2s ease-in infinite}
.tear.t2{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
#boy .p-reach,#boy.reach .p-norm{display:none}

#sparks{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.sp{position:absolute;bottom:-20px;color:#fff;text-shadow:0 0 8px #ffd9ee;animation:rise linear forwards;opacity:0}
.sp.b{border:2px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(255,255,255,.18);text-shadow:none}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-640px) scale(1.1);opacity:0}}
#dim{position:absolute;inset:0;z-index:9;background:rgba(10,6,30,.55);opacity:0;pointer-events:none;transition:opacity .3s}
#dim.on{opacity:1}
/* gacha card */
#gacha{position:absolute;z-index:12;left:50%;transform:translateX(-50%);perspective:900px;cursor:pointer}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.44);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.shake{animation:shake .45s ease-in-out infinite}

.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.6)}

.rband{background:var(--rc);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font:700 calc(var(--cw)*.075)/1.2 var(--font-ui);letter-spacing:.06em}

#tbText{font:500 var(--tbFs)/1.7 var(--font-serif);letter-spacing:.04em;white-space:pre-wrap;overflow:hidden;height:100%}

#arrow{position:absolute;right:16px;bottom:8px;color:var(--gold);animation:arr .8s ease-in-out infinite;font-size:16px}
@keyframes arr{50%{transform:translateY(5px)}}
#ctrl{position:absolute;z-index:17;left:6%;width:88%;bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#mode{display:none!important;font:500 11px/1 var(--font-ui);color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:5px 8px;border-radius:10px;white-space:nowrap}
#ctrlBtns{display:flex;gap:5px}

.stamp.go{animation:stamp .5s .25s cubic-bezier(.3,1.6,.5,1) forwards}

.modal{position:absolute;inset:0;z-index:40;background:rgba(10,7,30,.82);display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none}
.mbox{width:90%;height:88%;background:var(--dusk);border:1.5px solid var(--gold);display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* ===== スマホ対応：小さい文字・ボタンを --ui 倍に ===== */

/* ---------- engine ---------- */
class Abort extends Error{}
let token=0,skipMode=false,autoMode=false;
const ui={typing:false,skipType:false,waiting:false,adv:false,lock:true,gachaWait:false,flip:false,guard:0};
const wakers=new Set();
const poke=()=>[...wakers].forEach(f=>f());
const chk=t=>{if(t!==token)throw new Abort()};
function sleep(ms,t){return new Promise((res,rej)=>{let h;const done=()=>{clearTimeout(h);wakers.delete(done);t!==token?rej(new Abort()):res()};h=setTimeout(done,ms);wakers.add(done)})}
const logs=[];
function pushLog(n,t,cls){logs.push({n,t,cls});if(logs.length>200)logs.shift()}
const modalOpen=()=>!!stage.querySelector('.modal:not([hidden])');
function refocus(){try{tb.focus({preventScroll:true})}catch(e){}}
function syncBtns(){$('#bAuto').classList.toggle('on',autoMode);$('#bSkip').classList.toggle('on',skipMode)}
function setMode(txt){$('#mode').textContent='台詞: '+txt}
function modeText(){return ''}

async function say(who,text,o={}){
  const t=token;chk(t);
  const nar=who!=='boy'&&who!=='girl';
  const name=who==='boy'?'蒼真':who==='girl'?'ひより':'';
  const shown=nar?text:'「'+text+'」';
  pushLog(name,shown,nar?'nr':'');
  tb.hidden=false;tbName.hidden=!name;tbName.textContent=name;
  tb.classList.toggle('nar',nar);tb.classList.toggle('big',!!o.big);
  arrow.hidden=true;tbText.textContent='';
  ui.typing=true;ui.skipType=false;ui.guard=performance.now()+150;
  const sp=cfg.speed;
  for(let i=1;i<=shown.length;i++){
    chk(t);
    if(ui.skipType||sp===0||skipMode){tbText.textContent=shown;break}
    tbText.textContent=shown.slice(0,i);
    await sleep(/[、。！？…]/.test(shown[i-1])?sp*5:sp,t);
  }
  tbText.textContent=shown;ui.typing=false;
  if(o.noWait)return;
  arrow.hidden=false;
  await waitAdvance(t,shown.length);
  arrow.hidden=true;
}
async function waitAdvance(t,len){
  ui.waiting=true;ui.adv=false;let start=performance.now();
  try{
    for(;;){
      chk(t);
      if(modalOpen()||ui.lock){start=performance.now()}
      else{
        if(ui.adv){ui.adv=false;break}
        const el=performance.now()-start;
        if(skipMode&&el>=90)break;
        if(autoMode&&el>=cfg.autoWait+len*28)break;
      }
      await sleep(30,t);
    }
  }finally{ui.waiting=false}
}
function advance(){
  if(modalOpen()||ui.lock)return;
  // オート・スキップ中の入力は、まずモードを止めるだけにする（勝手に読み飛ばさない）
  if(skipMode||autoMode){skipMode=false;autoMode=false;syncBtns();return}
  if(ui.gachaWait){ui.flip=true;poke();return}
  // 行が出た直後・全文表示した直後の連打は無視（ダブルクリックで1行飛ばさないため）
  const now=performance.now();if(now<ui.guard)return;
  if(ui.typing){ui.skipType=true;ui.guard=now+220;poke();return}
  if(ui.waiting){ui.adv=true;poke()}
}
wrap.addEventListener('click',e=>{if(e.target.closest('button,.modal,#gacha,#choices,#result,#title'))return;advance()});
gachaEl.addEventListener('click',()=>{if(ui.gachaWait){ui.flip=true;poke()}});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return}
  if(!choicesEl.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const bs=[...choicesEl.querySelectorAll('button')];let i=bs.indexOf(document.activeElement);
    i=(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[i].focus();e.preventDefault();return}
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){
    if(e.repeat){e.preventDefault();return}
    const a=document.activeElement;
    if(a&&a.tagName==='BUTTON'&&a.offsetParent!==null)return;
    if(modalOpen()||ui.lock)return;
    e.preventDefault();advance();
  }
});

function choice(opts){
  return new Promise(res=>{
    ui.lock=true;skipMode=false;syncBtns();tb.hidden=true;
    choicesEl.innerHTML='';
    opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='band';b.textContent=o;
      b.onclick=()=>{choicesEl.hidden=true;ui.lock=false;pushLog('','▶ '+o,'c');refocus();res(i)};choicesEl.appendChild(b)});
    choicesEl.hidden=false;choicesEl.firstChild.focus();
  });
}

tamanegi":["悲哀","悲哀なき涙","悲哀。……玉ねぎの涙には、悲哀がない。だからこそ、君の涙は今、世界一澄んでいる。","悲しみのない涙を流せる日は、幸せな日だ。","……幸せな、日……","悲哀の花で悲哀がないことを祝う。"],"eiga":["愛の悲しみ","愛される資格","愛の悲しみ。……あの犬の物語は、愛の悲しみそのものだった。","愛の悲しみに泣ける君は、きっと誰かに深く愛される人だ。","……愛される……","映画で泣いたら愛される人に認定される。"],"furare":["愛の悲しみ","次の恋の資格","愛の悲しみ。……三年分の愛は、三年分の悲しみになる。それだけ、本気だった。","本気の悲しみを知った君は、次の恋で誰より優しくなれる。","……優しく……","失恋の悲しみを次の恋の資格にする。"],"gacha":["悲哀","喜びの前払い","悲哀。……天井まで回してすり抜けた夜の悲哀は、経験した者にしか分からない。","その悲哀を知る君だから、次に引けたとき、誰より喜べる。","……喜べる……","爆死の悲哀を喜びの前払いにする。"],"kasa":["悲哀","水辺の花","悲哀。……傘のない帰り道には、悲哀がある。","だが、この花は水辺に咲く花だ。……濡れた君にも、よく似合う。","……似合う……","水辺の花だから濡れても似合うという理屈。"],"sumaho":["愛の悲しみ","スマホへの純愛","愛の悲しみ。……割れた画面に泣けるのは、毎日を共にしたスマホを愛していたからだ。","愛したものが傷ついても、愛は傷つかない。","……傷つかない……","スマホへの愛を純愛扱い。"],"report":["悲哀","悲哀の文章力","悲哀。……消えた三時間には、悲哀がある。","だが、悲哀を越えて書き直す君の文章は、きっと誰より深い。","……深い……","悲哀を文章力に転換する。"],"maegami":["悲哀","横顔の評価","悲哀。……短すぎる前髪には、悲哀がある。","だが、悲哀を帯びた君の横顔は、今日一番綺麗だ。","……横顔……","前髪の悲哀を横顔で褒める。問題は正面なのに。"],"akaten":["悲哀","立ち上がる力","悲哀。……赤点の答案には、悲哀がある。","悲哀を知った君は、追試でもう一度立ち上がれる。","……立ち上がれる……","赤点に盆花。供養には早い。"],"tenkou":["愛の悲しみ","友愛の悲しみ","愛の悲しみ。……親友との別れが悲しいのは、友情という名の愛があるからだ。","その愛は、離れても、悲しみより長く続く。","……長く……","友情を愛の悲しみで包む。"],"geki":["悲哀","役者の痛み","悲哀。……台詞を噛んだ瞬間の悲哀は、舞台に立った者だけが知る痛みだ。","その痛みを知った君は、もう本物の役者だ。","……本物の……","噛んだだけで役者の格が上がる。"],"save":["愛の悲しみ","愛の証明","愛の悲しみ。……消えたデータに泣けるのは、百時間を愛していたからだ。","愛した時間は、どんなデータより確かに、君の中に残る。","……確かに……","データ消失を愛の証明にする。"],"loveletter":["愛の悲しみ","届かない愛","愛の悲しみ。……届かなかったラブレターは、愛の悲しみそのものだ。","だが、愛は一度で終わらない。……次は、必ず届く。","……必ず……","誤配を愛の悲しみの典型にする。"],"yakisoba":["悲哀","麺の悲哀","悲哀。……シンクに散った麺には、悲哀がある。","麺の悲哀にさえ心を痛める君を、俺は見過ごせない。","……見過ごせない……","麺の悲哀に男が反応する。"],"kafun":["悲哀","鼻の悲哀","悲哀。……花を愛する人が花粉に泣かされる。これほどの悲哀はない。","それでも、この花は君に贈りたかった。……悲哀ごと、受け取ってくれ。","……悲哀ごと……っくしゅ……","花粉症に悲哀の花。悲哀が増える。"],"baito":["悲哀","通過儀礼","悲哀。……三回間違えて怒られる新人の悲哀は、多くの人が通る道だ。","その道の先で、君はきっと誰より頼れる人になる。","……頼れる……","バイトの失敗を通過儀礼扱い。"],"tanjoubi":["悲哀","悲哀の終わり","悲哀。……誰にも祝われない誕生日の悲哀は、今日で終わりだ。","誕生日、おめでとう。……悲哀の花だが、気持ちは祝福だ。","……祝福……","誕生日に悲哀の花と申告して渡す。しかも盆花。"],"wasabi":["愛の悲しみ","寿司への愛","愛の悲しみ 真ん中の花言葉。ただし墓地によく咲いている花。"],"geki":["悲しい思い出","笑い話への熟成","悲しい思い出。……噛んだ台詞は、今は悲しい思い出だ。だが、三年後には、一番の笑い話になる。","そのとき、俺が一番に笑う。……一番近くで、君と一緒にな。","……一緒に……","将来いちばん笑う予約を入れる。"],"save":["また会う日を楽しみに","一方的な再会","また会う日を楽しみに。……消えたデータの仲間たちとは、二周目で再会できる。……向こうは、君を覚えていないが。","初対面のふりをして、また仲良くなればいい。……俺とも、何度でも。","……何度でも……","感動の再会なのに記憶は一方通行。"],"loveletter":["また会う日を楽しみに","再挑戦の予告","また会う日を楽しみに。……ラブレターは、また書ける。次に会う日には、ちゃんと本人の靴箱に入っている。","その日まで、この花を目印にしよう。","……次は、ちゃんと届ける……","誤配からの再挑戦予告に地獄花を添える。"],"yakisoba":["諦め","三秒ルールの却下","諦め。……シンクの麺は、諦めよう。三秒ルールは、シンクには適用されない。","新しい一杯を、君と一緒に作りたい。……お湯は、俺が沸かす。","……一緒に……","三秒ルールのシンク適用を却下した。"],"kafun":["諦め","マスクとの和解","諦め。……花粉とは、戦っても勝てない。諦めて、マスクと友達になろう。","この花は、マスク越しに見ても綺麗だ。","……っくしゅ……マスク、ある……","花粉対策の結論がマスク。花の方は球根に毒がある。"],"baito":["悲しい思い出","伝説の新人","悲しい思い出。……三回のミスは、いつか店の伝説になる。『三回間違えた新人が、店長になった』という伝説に。","伝説には、始まりの失敗が必要なんだ。……君の伝説を、俺は最初から見ている。","……最初から……","バイトの失敗から店長就任まで話を盛った。"],"tanjoubi":["また会う日を楽しみに","来年の予約","また会う日を楽しみに。……来年の今日、また会おう。そのときは、俺が一番に祝う。","……いや、今年も今祝う。誕生日、おめでとう。","……今年も、祝ってくれるんだ……","誕生日に死人花の別名を持つ花。来年の予約より先に謝るべき。"],"wasabi":["悲しい思い出","トラウマ対策","悲しい思い出。……今日のわさびは、悲しい思い出になる。次に寿司を食べるたびに、思い出すだろう。","わさびの思い出も、君と過ごした今日の一部だ。","……今日の、一部……","トラウマ対策の花が地獄花。"],"cookie":["諦め","容器係の任命","諦め。……塩クッキーは、諦めよう。だが、クッキー作りは諦めない。","次は、俺が砂糖の容器を持って、隣に立っている。……ずっと。","……ずっと……","蒼真の役職が容器係に決まった。"]},"otogiriso":{"kingyo":["秘密","二人だけの秘密","秘密。……きんちゃんが、本当は君の声を聞き分けていたこと。それは、君ときんちゃんだけの秘密だ。","その秘密は、誰にも奪えない。君ときんちゃんの、永遠の絆だ。","……私の声、分かってたのかな……","弟切草は秘密を漏らした弟が切られた伝説の草。秘密の話には重すぎる。"],"pudding":["恨み","恨みの利子","恨み。……プリンの恨みは、この花に預けよう。恨みは、預けておくと利子がつく。","恨みを預けた君の手は、もう軽い。……その手で、この花を受け取ってくれ。","……軽い……","恨みの利子が五割。"],"oshi":["秘密","推し活の地下化","秘密。……推しへの想いは、これから君だけの秘密にすればいい。秘密の推し活は、密かに燃えるんだ。","誰にも言わない愛ほど、長続きする。……俺も、そうだ。","……俺も、って……","秘密を漏らすと切られる草で秘密の推し活を勧める。"],"juken":["敵意","安全運転の敵意","敵意。……落とした大学に、少しくらい敵意を持っていい。敵意は、来年の勉強のガソリンになる。","その敵意を燃料に、来年の春、君は誰より高く飛ぶ。","……高く……","願書には書けない種類の燃料。"],"taikai":["恨み","恨みと傷薬","恨み。……あの一球への恨みは、この花が引き受ける。弟切草は、昔から傷薬にも使われてきた草なんだ。","恨みを引き受けて、傷を治す。それがこの花だ。","……傷薬……","傷薬と恨みの二刀流。この草の伝説では両方が同じ事件から生まれている。"],"tamanegi":["秘密","秘密の暴露","秘密。……玉ねぎで泣いていたことは、二人だけの秘密にしよう。君の涙を見たのは、俺だけだ。","秘密を分け合った者同士は、もう他人じゃない。","……玉ねぎの、秘密……","玉ねぎを刻んでいただけで秘密結社が結成される。"],"eiga":["敵意","敵意とリピート","敵意。……犬を死なせた脚本に、敵意を持っていい。この花を、パンフレットに挟んでおけ。","パンフレットに挟んだこの花が、いつか君の涙の記念になる。","……記念……","押し花にすると葉の黒い点がよく見える。伝説では血しぶき。"],"furare":["秘密","秘密の宝箱","秘密。……三年間の片思いは、君だけの秘密の宝物だ。フラれても、宝物は宝物のままだ。","その宝箱に、この花も入れておいてくれ。","……宝箱……","失恋を宝箱にしまわせた。"],"gacha":["恨み","恨みの肥料化","恨み。……確率への恨みは、この花に吸わせよう。この花は、恨みを吸って育つ。","君の恨みを吸って咲いた花は、きっと誰より美しい。","……恨みで、咲く……","爆死の恨みが肥料になった。"],"kasa":["恨み","晴天の逆襲","恨み。……傘泥棒への恨みは、晴れの日に晴らそう。晴れの日、傘はいらない。犯人は、無駄な荷物を抱えている。","……だが、君には恨みより優しさが似合う。恨みは、この花に預けていけ。","……預けて、いく……","晴れの日に犯人が困る想定。犯人は晴れの日に傘を持ち歩かない。"],"sumaho":["秘密","口の堅いスマホ","秘密。……画面が割れても、中の秘密は守られている。君のスマホは、ちゃんと口が堅い。","口の堅いスマホに、この花を。……君の秘密を守った、勇敢な騎士だ。","……口、堅かった……","秘密を漏らすと切られる草をスマホに贈る。ほぼ脅迫。"],"report":["恨み","恨みの文章術","恨み。……消えた三時間の恨みを、キーボードにぶつけろ。恨みのこもった文章は、迫力が違う。","恨みさえ力に変える君の文章は、きっと誰かの心を打つ。","……心を、打つ……","恨みのこもったレポートは評価基準にない。"],"maegami":["秘密","一夜限りの秘密","秘密。……前髪を切りすぎたことは、明日みんなにバレる。だから今夜だけは、二人の秘密だ。","秘密は、短いほど燃える。……前髪と同じだ。","……前髪と、同じ……","前髪の短さと秘密の期限をかけた。"],"akaten":["敵意","決闘化","敵意。……赤点を出した数式に、敵意を持て。敵の顔を知れば、追試は戦いになる。","戦いなら、君は強い。","……戦い、なんだ……","追試を決闘と呼ぶなら先生は介添人。"],"tenkou":["秘密","合言葉の提案","秘密。……転校する親友と、一つ秘密を作るといい。二人だけの秘密は、距離を超える。","合言葉は、この花の名前でいい。……二人の秘密は、どんな距離も越える。","……弟切草、が合言葉……","合言葉の由来が兄弟の斬り合い。友情の誓いには物騒すぎる。"],"geki":["秘密","最前列の口止め","秘密。……実は、客席の半分は気づいていない。噛んだことは、君と最前列だけの秘密だ。","噛んだことは、俺と最前列だけの秘密だ。……君の舞台は、完璧だった。","……完璧……","最前列の観客全員に秘密を背負わせる。"],"save":["恨み","恨みのバックアップ","恨み。……データは消えたが、恨みは消えない。恨みは、心のバックアップなんだ。","その恨みで、二周目を駆け抜けろ。君なら、伝説になれる。","……伝説……","恨みだけはクラウドに保存されていた。"],"loveletter":["秘密","秘密の守り手","秘密。……隣の靴箱の人は、君の秘密を知ってしまった。だが、秘密を知った人は、守る側に回る。","明日から、その人は君の味方だ。","……味方……","誤配の相手を勝手に味方に引き入れる。"],"yakisoba":["敵意","対シンク戦争","敵意。……シンクに敵意を持っていい。あの銀色の口は、何千本もの麺を飲み込んできた。","だが、もう敵は君に近づけない。……俺が、ここにいる。","……ここに……","シンクを敵と認定して見張りに立つ男。"],"kafun":["敵意","花粉への宣戦","敵意。……花粉に、敵意を持て。ただし、この花には持たないでくれ。この花は、君の味方だ。","弟切草は、昔から傷を癒やす薬草だ。君の鼻も、きっと癒やす。","……鼻も……っくしゅ……","傷薬の草で花粉症は治らない。"],"baito":["秘密","秘密の特訓","秘密。……三回間違えた君が、それでも最後まで笑顔だったこと。それは、俺だけが知っている秘密だ。","その笑顔は、明日きっと店いちばんの武器になる。","……笑顔、だったかな……","見ていないはずの笑顔を秘密として保有している。"],"tanjoubi":["秘密","秘密の誕生日","秘密。……誰も気づかない誕生日は、君だけの秘密の誕生日だ。……いや、俺は知っている。二人の秘密だ。","誕生日、おめでとう。……世界で俺だけが知っている、秘密の記念日だ。","……二人の、秘密……","秘密を漏らした弟が切られた草で秘密の誕生日を祝う。"],"wasabi":["敵意","給水作戦","敵意。……わさびに敵意を持っていい。だが、わさびの涙さえ美しく流せる君には、わさびも敵わない。","わさびも今、君の涙に負けを認めている。","……わさび、負けたんだ……","わさびに勝敗をつけている間に寿司は冷める。"],"cookie":["秘密","秘密のレシピ","秘密。……塩クッキーは、今日から君の秘密のレシピだ。誰にも真似できない。","誰にも真似できない味だ。……君にしか焼けない、秘密の味だ。","……秘密の、味……","塩の分量を秘密のレシピと呼ぶ。誰も盗まない。"]},"lobelia":{"kingyo":["謙遜","控えめな追悼","謙遜。……きんちゃんは、いつも控えめだった。だから、この小さな青い花がちょうどいい。","控えめに生きたきんちゃんに、控えめで美しい花を。……君の涙も添えて。","……照れる金魚……","金魚の性格を勝手に控えめに設定。"],"pudding":["悪意","擁護からの一刺し","悪意。……お兄さんに、悪意はなかったはずだ。ただ、そこにプリンがあった。それだけだ。","罪深い兄の分まで、俺が君に甘い時間を返そう。","……甘い時間……","兄を庇ったと見せかけて刺した。"],"oshi":["謙遜","祝福の音量指定","謙遜。……推しの結婚を、控えめに祝おう。大声じゃなくていい。小さな青い花くらいの声で。","小さな祝福ほど、長く咲き続ける。……君の想いのように。","……小さい声で、おめでとう……","祝福の音量を花のサイズで指定した。花言葉には悪意もある。"],"juken":["悪意","悪意の有無","悪意。……合否には、悪意がない。だからこそ、残酷なんだ。だが、君の努力にも悪意はない。","悪意のない努力は、いつか報われる。","……報われる……","悪意の有無だけでいい話を組み立てる手際。"],"taikai":["謙遜","謙遜の禁止","謙遜。……君は、きっと『自分のせいで』と謙遜しているんだろう。だが、今日だけは謙遜しなくていい。","君は、最後まで戦った。それだけは、胸を張れ。","……胸、張る……","謙遜の花を出して謙遜を禁止する。"],"tamanegi":["悪意","玉ねぎの悪意","悪意。……玉ねぎには、悪意がある。切られた瞬間に、人を泣かせる成分を出すんだ。","悪意に立ち向かいながら、君は誰かのために料理を作っていた。……それが、君だ。","……ハンバーグ作ってただけ……","玉ねぎの化学反応を悪意扱い。悪意が花言葉の花を持った男が言う。"],"eiga":["敵意","涙腺への反則","敵意。……あの映画は、君の涙腺に敵意を持っていた。犬を出す時点で、勝負は決まっていたんだ。","あれは反則だ。……だが、反則に泣ける君の心は、まっすぐだ。","……反則……わかる……","犬映画を涙腺への反則と認定。"],"furare":["謙遜","控えめすぎた三年","謙遜。……三年間、気持ちを控えめに隠してきた君は、謙遜の達人だ。……少し、控えめすぎたのかもしれないが。","次は、少しだけ大きな声で。……その声を、誰より先に聞くのは俺でいたい。","……大きな声……","失恋の反省会がそのまま次の告白の予約に。"],"gacha":["悪意","平等な悪意","悪意。……すり抜けに悪意を感じるのは、自然なことだ。だが、運営は君を狙ったわけじゃない。全員平等に、すり抜ける。","平等な悪意の中で、君だけが天井まで想い続けた。その一途さは、平等じゃない。","……一途さ……","ガチャの悪意を平等で正当化する。運営の代弁者ではない。"],"kasa":["悪意","倫理的勝利","悪意。……傘を盗んだ人には、悪意があった。その人は今日、悪意を抱えて帰った。君は、悪意なく帰れる。","悪意なく帰れる君の背中は、どんな傘より美しい。","……濡れても、いい気がしてきた……","倫理では勝ったが物理では負けている。"],"sumaho":["謙遜","スマホの自己犠牲","謙遜。……君のスマホは、謙遜して、自分から画面を割ったんだ。君の手を傷つけないように。","君の手を守ったスマホだ。……俺も、君の手を守りたい。","……手……","落下事故をスマホの自己犠牲にした。"],"report":["悪意","毒花による牽制","悪意。……保存前に再起動するパソコンには、悪意がある。……少なくとも、俺はそう感じる。","悪意から君の三時間を守れなかった。……次は、この花と俺が守る。","……守って、くれる……","毒のある花をパソコンの上に置く。悪意の連鎖が止まらない。"],"maegami":["謙遜","前髪の脇役化","謙遜。……前髪は、謙遜して短くなったんだ。君の顔を、もっと見せるために。","控えめな前髪は、主役を引き立てる。","……前髪、脇役だったんだ……","前髪が脇役に格下げされた。"],"akaten":["敵意","範囲への転嫁","敵意。……赤点に敵意を向けてもいい。だが、数学には向けないでくれ。数学は、悪くない。","悪いのは出題範囲だ。……君の努力は、何一つ悪くない。","……何一つ……","数学を庇って出題範囲を差し出す。"],"tenkou":["謙遜","謙遜の先回り","謙遜。……親友を見送る君は、きっと『私なんかがいなくても』と謙遜するだろう。だが、親友は君がいたから、ここまで来られた。","胸を張って送り出そう。","……胸を張って……","見送る側の謙遜を先回りで封じる。"],"geki":["悪意","台本の告発","悪意。……あの台詞には、悪意があった。わざと噛みやすい言葉を並べていたんだ。","あの台詞に負けず、最後まで立ち続けた君は、誰より強い役者だ。","……強い、役者……","台本作者に悪意の濡れ衣。誰も噛ませるつもりで書いていない。"],"save":["悪意","恨む相手の不在","悪意。……データが消えたのは、誰の悪意でもない。だからこそ、誰も恨まなくていい。","恨む相手のいない別れなら、思い出だけを持っていける。……百時間分、全部。","……百時間分……","恨む相手はいないと言いながら悪意の花を手渡す。"],"loveletter":["謙遜","恥じらう手紙","謙遜。……誤配されたラブレターは、謙遜して、隣の靴箱に隠れたんだ。本命の前で、恥ずかしかったんだろう。","次は堂々と届けよう。恥じらうほどの想いなら、きっと本命にも届く。","……手紙が、恥ずかしがった……","手紙に恥じらいの人格を与えた。"],"yakisoba":["悪意","湯切り口の告発","悪意。……湯切り口には、悪意がある。あの小さな穴の位置は、明らかに麺を落とすための設計だ。","……証拠はない。だが、君が悪くないことだけは、俺が信じている。","……信じてるんだ……","証拠なしで湯切り口を告発する。"],"kafun":["謙遜","花粉量の推測","謙遜。……ロベリアは、小さな花だ。花粉も、きっと謙遜して控えめにしている。","花粉は控えめでも、俺の想いは控えめにできない。","……控えめに、できない……っくしゅ……","花粉の量を花の性格で推測する。謙遜しても毒草。"],"baito":["謙遜","逃げなかった新人","謙遜。……君は、自分はダメだと謙遜しているだろう。だが、三回間違えても逃げなかった。それは、ダメじゃない。","逃げなかった新人は、強くなる。","……逃げなかった……","逃げなかった点だけ切り取って褒める。"],"tanjoubi":["謙遜","控えめさの指摘","謙遜。……君は、自分の誕生日を言いふらさない。控えめな人だ。だから、誰も気づかなかったんだ。","控えめな君の代わりに、俺が言う。誕生日、おめでとう。","……代わりに、言ってくれた……","忘れられた原因を本人の控えめさにする。"],"wasabi":["悪意","必要悪","悪意。……わさびには、悪意しかない。おいしい寿司の下に、こっそり潜んでいる。","君の涙が締めてくれるなら、わさびの悪意も、少しは報われる。","……報われた……","わさびの悪意を料理の要と認める。悪意の花を持った男が。"],"cookie":["謙遜","控えめの限度","謙遜。……塩クッキーは、謙遜した味だ。甘さを控えめにしすぎただけなんだ。","控えめすぎたのは甘さだけだ。……君の想いは、ちゃんと届いている。","……届いて、る……","塩クッキーを謙遜しすぎた結果と呼ぶ。塩は謙遜しない。"]},"torikabuto":{"kingyo":["騎士道","騎士の着任","騎士道。……トリカブトは、兜の形をした花だ。今日から俺は、きんちゃんの代わりに n":["呪い","花粉の擬人化","呪い。……花粉症とは、花が人間にかける呪いだ。だから、花で解く。毒をもって毒を制すんだ。","呪いには呪いで。……君の涙を止めるためなら、俺は何だって使う。","……っくしゅん……何だって……","花粉症に花で治療を試みる暴挙。しかもクロユリは悪臭で知られる。"],"baito":["呪い","誤注文の霊障化","呪い。……三回も注文を間違えたのは、そのテーブルが呪われていたからだ。君は、霊的な被害者なんだ。","四回目は、この花をテーブルに。……呪いからも、俺が君を守る。","……守って、くれる……","店長は霊障を労災と認めない。"],"tanjoubi":["恋","遅刻の隠蔽","恋。……誰も気づかなかったわけじゃない。少なくとも俺は気づいていた。この花が、その証拠だ。……今、そういうことにした。","誕生日、おめでとう。呪いの花で、すまない。","……そういうことに、しとく……","今そういうことにしたと本人が言った。"],"wasabi":["呪い","辛味の呪術化","呪い。……わさびの辛さは、鼻の奥にかけられる小さな呪いだ。三秒で解けるタイプのな。","あと二秒。……一秒。……ほら、解けた。君の涙を止めるのは、いつだって俺だ。","……ほんとだ、引いた……","三秒待っただけで解呪の手柄を取った。"],"cookie":["呪い","味覚の呪術化","呪い。……砂糖と塩の容器が似ているのは、台所に昔からかかっている呪いなんだ。君のせいじゃない。","その塩クッキーは、俺が全部食べる。呪いごと引き受けよう。","……しょっぱいよ……？","塩クッキーの完食が美談に。"]},"snowdrop":{"kingyo":["あなたの死を望みます","時制の後追い","あなたの死を望みます。……きんちゃんの、ではない。きんちゃんを想って泣き続ける、今日の君の悲しみの、だ。","悲しみが死ねば、きんちゃんとの思い出だけが残る。","……思い出だけ……","金魚が亡くなった日に死を望む花を出す度胸。"],"pudding":["あなたの死を望みます","宛先の変更","あなたの死を望みます。……この花は、お兄さん宛てだ。いや、物騒な意味じゃない。お兄さんの食い意地の死を望んでいる。","食い意地が死ねば、プリンは冷蔵庫で生き延びる。","……食い意地、死んでほしい……","兄の食い意地に死刑判決。"],"oshi":["希望","雪中の希望","希望。スノードロップは、雪の中で最初に咲く花だ。推しの結婚という吹雪の中で、最初に咲くのは、君の祝福なんだ。","……もう一つの花言葉は、今日は言わない。君の祝福を、何ものにも汚させない。","……言わないでくれて、ありがとう……","伏せた花言葉が一番物騒なやつ。"],"juken":["希望","季節の先取り","希望。……雪が溶ける前に咲く花だ。春はまだ来ていない。だが、もう咲いていい。君の春も、同じだ。","春はまだでも、君はもう咲いていい。……俺には、もう見えている。","……見えて、るの……","浪人をふわっと季節で包んできた。"],"taikai":["あなたの死を望みます","敵の明確化","あなたの死を望みます。……あの一球の、だ。君の記憶の中で、あの一球には死んでもらう。","残るのは、そこまで君が投げ続けた全部の球だ。","……全部の球……","一球に死刑宣告する人を初めて見た。"],"tamanegi":["あなたの死を望みます","食材への宣告","あなたの死を望みます。……玉ねぎの、だ。安心してくれ。玉ねぎは、もう切られている。つまり、この願いはすでに叶っている。","叶った願いの花を贈れる日は、そうない。……今日は、いい日だ。","……たしかに、もうみじん切りだけど……","願いが叶ったのはみじん切りのおかげ。"],"eiga":["慰め","上映後ケア","慰め。……この花は、映画館の出口に置かれるべき花なんだ。犬が死ぬ映画のあとには、必ず配るべきだと思っている。","この花を、君に。……あの犬の分まで、君を慰めさせてくれ。","……あの子の、分まで……","映画館の出口で花を配る構想を一人で温めている。"],"furare":["あなたの死を望みます","感情の看取り","あなたの死を望みます。……あの人の、じゃない。三年間、君の中で生き続けた片思いの、だ。……長生きだったな。","大往生だ。この花で、送ってやろう。","……大往生……そっか……","三年の片思いが大往生で見送られた。"],"gacha":["希望","次回への投資","希望。……天井まで回したということは、次の天井まで、もう一回分の希望が残っているということだ。","君の一途さが尽きない限り、希望もまた、尽きることはない。","……尽きない……","慰めの結論が次の天井。"],"kasa":["あなたの死を望みます","恨みの殺害","あなたの死を望みます。……傘泥棒の、ではない。傘泥棒を恨む気持ちの、だ。恨みは、雨より重い。","恨みを手放した君の隣を、明日は俺が歩く。……傘を、二人分持って。","……二人分……","物騒な花言葉からデートに着地した。"],"sumaho":["慰め","破損の芸術化","慰め。……割れた画面越しに見る世界は、ステンドグラスみたいだろう？ この花も、そこから見ればもっと綺麗だ。","修理に出すまでの、君だけの美術館だ。……一番の展示は、君の笑顔だ。","……ほんとだ、ちょっと綺麗……","画面割れが期間限定の美術館。"],"report":["あなたの死を望みます","宛先の変更","あなたの死を望みます。……パソコンの自動更新機能の、だ。君の三時間を奪った、あの機能のな。","君の三時間を奪った機能は、この花が葬った。……君の努力だけが、ここに残る。","……努力だけ……","死を望まれたのは自動更新機能。"],"maegami":["希望","成長予測","希望。……雪の下でも、球根は伸び続けている。君の前髪も、今この瞬間も伸びている。一日〇・三ミリずつな。","計算上、春には元通りだ。……だが俺は、今の君も覚えておきたい。","……今の、私も……","前髪の伸びを日割りで計算する男。"],"akaten":["あなたの死を望みます","数学の延命措置","あなたの死を望みます。……数学の、だ。……いや、数学は死なない。だから、追試のあとで、二人で数学を弔おう。","追試までは、生かしておいてやる。……君が勝つ、その日のために。","……追試までは……","数学に追試までの執行猶予がついた。"],"tenkou":["慰め","季節の約束","慰め。スノードロップは、毎年同じ季節に、同じ場所に咲く。離れても、毎年この花の季節に会えばいい。","それなら、別れじゃなくて、待ち合わせだ。","……待ち合わせ……","別れが年一回の待ち合わせに変わる。"],"geki":["あなたの死を望みます","台詞の葬送","あなたの死を望みます。……噛んだ、あの台詞の、だ。あの台詞はもう死んだ。次の舞台では、新しい台詞が生まれる。","役者とは、台詞の生と死を繰り返す仕事なんだ。","……なんか、深い……","噛んだ台詞の葬式で役者論が始まる。"],"save":["希望","ニューゲームの祝福","希望。……セーブデータが消えたなら、君は今、レベル1だ。レベル1は、伸びしろの塊なんだ。","百時間前のワクワクを、もう一度味わえる。","……もう一度、最初から……","データ消失を二度おいしいと言い切る強さ。"],"loveletter":["あなたの死を望みます","宛先の再訂正","あなたの死を望みます。……誤解しないでくれ。隣の靴箱の人ではない。ラブレターを読まれる恥ずかしさの、だ。","恥ずかしさが死ねば、残るのは勇気だけだ。","……勇気だけ……","死ぬのは恥ずかしさだけと念押しが入る。"],"yakisoba":["慰め","粉末ソースの救済","慰め。……麺は流れたが、ソースの小袋はまだ手元にあるだろう？ 希望は、いつも小袋に残っているんだ。","小袋に希望を見つけられる君がいる限り、どんな夜も、まだ終わらない。","……まだ、終わらない……","焼きそばの小袋に希望が詰まっている設定。中身はソース。"],"kafun":["希望","季節の先回り","希望。……スノードロップが咲くのは、花粉の季節より少し前だ。つまりこの花は、花粉のない世界から来た使者なんだ。","花粉のない世界から、君のためだけに来た花だ。","……私の、ため……っくしゅ……","花粉のない世界の使者。でも花。"],"baito":["あなたの死を望みます","ミスの先回り","あなたの死を望みます。……三回の注文ミスの、だ。四回目のミスは、生まれる前に死ぬ。この花が、そう決めた。","四回目のミスが来ないよう、この花が見張っている。……俺もだ。","……見張って、くれるの……","まだ起きていないミスまで葬った。"],"tanjoubi":["希望","サプライズの捏造","希望。……誰も気づいていないふりをしているだけかもしれない。今ごろ、どこかでサプライズの準備が進んでいる。……可能性はある。","少なくとも、俺は気づいた。誕生日、おめでとう。","……準備、してたらいいな……","誕生日に死を望む花言葉の花。サプライズとしては攻めすぎ。"],"wasabi":["あなたの死を望みます","辛味の看取り","あなたの死を望みます。……わさびの、だ。……もう死につつある。ツーンが、だんだん引いていくだろう？ それが、わさびの最期だ。","わさびの最期を、君と見届けられてよかった。","……わさびの、最期……","球根に毒のある花でわさびの最期を看取る。"],"cookie":["慰め","甘じょっぱいの発見","慰め。……塩のクッキーも、チョコを塗れば甘じょっぱい。失敗は、新しい味の始まりなんだ。","失敗から始まる味を、俺は君と一緒に見つけたい。","……一緒に……","失敗作の横に球根が有毒な花。食卓には置かない方がいい。"]},"blackrose":{"kingyo":["決して滅びることのない愛","喪色の反転","決して滅びることのない愛。……きんちゃんは泳ぐのをやめた。だが、君がきんちゃんを想う愛は、決して滅びない。","この黒は、喪の色じゃない。滅びない愛の色だ。","……滅びない……","金魚の葬儀に黒いバラ。服装規定には合っている。"],"pudding":["恨み","食の恨みの深さ","恨み。……プリンの恨みは、恐ろしい。古今東西、食べ物の恨みほど深いものはない。","その深い恨みさえ、君は涙で流そうとしている。……君は、優しすぎる。","……優しすぎる……","食べ物の恨みに黒いバラ。兄の部屋が魔界になる。"],"oshi":["決して滅びることのない愛","永久保証","決して滅びることのない愛。……推しが結婚しても、君の推し愛は滅びない。この花が、そう誓っている。","滅びない愛を抱えて、君は明日も推しを照らす光になる。","……光に……","推し愛の永久保証に黒いバラ。結婚式には黒すぎる。"],"juken":["憎しみ","憎しみの追い風","憎しみ。……君を落とした大学を、少しだけ憎んでいい。その憎しみは、来年、君を押し上げる風になる。","憎しみさえ追い風に変える君は、もう誰にも止められない。","……止められない……","受験生に憎しみの花は願掛けとして逆効果。"],"taikai":["恨み","黒い勲章","恨み。……あの一球を恨む気持ちは、本気で戦った者にしか生まれない。","その恨みは、君の三年間の勲章だ。……黒く光る勲章だ。","……勲章……","恨みを勲章に変換する。"],"tamanegi":["憎しみ","涙の誘発罪","憎しみ。……玉ねぎを憎む人間はいない。だが、君の涙を誘った罪だけは、俺が憎もう。","君の涙を誘うものは、玉ねぎでさえ許さない。","……玉ねぎ、許してあげて……","平和な台所で玉ねぎに憎しみを向ける男。"],"eiga":["決して滅びることのない愛","スクリーン外の愛","決して滅びることのない愛。……あの犬の愛は、映画が終わっても滅びない。君の涙が、その証拠だ。","スクリーンの外まで届く愛を、君はちゃんと受け取った。","……受け取った……","映画の犬の愛に永久保証がつく。"],"furare":["恨み","恨み以前の愛","恨み。……三年分の想いが、恨みに変わりそうだろう。だが、恨むほど好きだったなら、それは愛だ。","恨みに変わる前の愛を、この花に閉じ込めておこう。……枯れない色で。","……枯れない、色……","黒いバラは本当は深い赤。枯れない色かどうかも怪しい。"],"gacha":["憎しみ","惚れ直し","憎しみ。……すり抜けを憎んでいい。だが、天井まで回した君の想いは、憎しみより強かった。","その想いの強さに、俺は惚れ直した。","……惚れ、直した……","天井の課金額で惚れ直す男。"],"kasa":["恨み","トゲへの委託","恨み。……傘泥棒への恨みは、黒いバラに預けよう。このトゲが、代わりに恨みを持っていてくれる。","君の手は、恨みではなく、この花を握るためにある。","……握る……","トゲだらけの花を握れと言う。手が恨みを持ち始める。"],"sumaho":["決して滅びることのない愛","思い出の不滅","決して滅びることのない愛。……画面は割れても、そのスマホに詰まった思い出は滅びない。","君が撮った笑顔は、ひびの向こうで今も輝いている。","……今も……","割れたスマホに永遠の愛。"],"report":["憎しみ","誠実の文体","憎しみ。……強制再起動を憎んでいい。三時間を奪った罪は重い。","だが、憎しみで書く文章より、君の誠実さで書く文章の方が美しい。","……誠実さ……","憎しみの花を渡しながら憎しみを捨てろと言う。"],"maegami":["決して滅びることのない愛","想いの長さ","決して滅びることのない愛。……前髪は切られても、また伸びる。滅びないものは、ちゃんと戻ってくる。","伸びるまでの間も、君への想いは一ミリも短くならない。","……一ミリも……","前髪の長さと想いの長さを比べる。単位が合っていない。"],"akaten":["恨み","赤と黒","恨み。……赤点を恨んでいい。だが、赤と黒はよく似合う。君の答案とこの花は、今日、同じ舞台に立っている。","その舞台の主役は、追試で勝つ君だ。","……主役……","赤点と黒いバラの配色だけ褒めている。"],"tenkou":["決して滅びることのない愛","距離不滅論","決して滅びることのない愛。……友情も、愛の一つだ。距離では、滅びない。","この花の言葉どおり、君たちの友情は永遠だ。","……永遠……","友情の門出に喪の色の花。"],"geki":["憎しみ","憎むほどの記憶","憎しみ。……あの台詞を、今は憎んでいるだろう。だが、憎むほど覚えた台詞は、もう君の一部だ。","次の舞台で、その台詞は君を一番輝かせる。","……輝かせる……","噛んだ台詞を憎みながら愛せと言っている。"],"save":["恨み","恨みの上書き禁止","恨み。……消えたデータを恨む気持ちは分かる。だが、恨みは上書き保存しないでくれ。","君の心に保存するのは、百時間の楽しかった記憶だけでいい。","……楽しかった、記憶……","恨みの上書き保存を禁じる珍しい慰め。"],"loveletter":["決して滅びることのない愛","宛先の不滅","決して滅びることのない愛。……隣の靴箱に入っても、君の手紙に込めた愛は滅びない。","滅びない愛は、いつか必ず、本当の宛先に届く。","……本当の、宛先……","誤配の手紙に永久保証。差出人の羞恥は保証外。"],"yakisoba":["憎しみ","隣席の保証","憎しみ。……湯切り口を憎んでいい。あの小さな穴が、君の夕食を奪った。","だが、麺を失った夜にも、君の隣には俺がいる。","……隣に……","麺の代わりに男が隣にいる。腹は膨れない。"],"kafun":["恨み","トゲの代役","恨み。……花粉を恨んでいい。君の目を泣かせる罪は、花粉の方にある。","このバラは、トゲで刺すことはあっても、花粉で泣かせはしない。","……刺さっても、いいかも……っくしゅ……","花粉の代わりにトゲで刺す宣言。"],"baito":["憎しみ","憎しみの預かり","憎しみ。……自分を憎まないでくれ。三回間違えた君より、三回謝れた君を、俺は見ている。","その憎しみは、自分ではなく、この花に預けていけ。","……預けて、いく……","憎しみの預かり所を個人で開業している。"],"tanjoubi":["決して滅びることのない愛","祝福の不滅","決して滅びることのない愛。……誰も祝わない誕生日でも、俺の祝福は滅びない。","誕生日、おめでとう。来年も、その次も、この言葉は滅びない。","……その次も……","誕生日に黒いバラはお祝いの色ではない。"],"wasabi":["恨み","三秒の人柄","恨み。……わさびを恨んでいい。だが、その恨みは三秒で消える。君は、恨みを長く持てない人だ。","恨みが三秒で消える君は、きっと誰より優しい。","……三秒で……","わさびの辛さが引いた速さで人柄を判定する。"],"cookie":["憎しみ","愛ごとの受容","憎しみ。……似ている容器を憎んでいい。だが、君の作ったクッキーを憎む必要は、どこにもない。","このクッキーは、俺が全部受け止める。……愛ごと、な。","……愛ごと……","塩クッキーを愛ごと受け止める宣言。"]},"orangelily":{"kingyo":["華麗","鱗の色","華麗。……きんちゃんは、金魚鉢の中で一番華麗に泳いでいた。その姿を、この花で残そう。","この橙色は、きんちゃんの鱗の色だ。……君の思い出の中で、ずっと光る。","……ずっと、光る……","ユリの花粉は服につくと落ちない。喪服で受け取るのは危険。"],"pudding":["憎悪","プリンの護衛","憎悪。……プリンを奪った兄への憎悪を、この花は燃える色で代弁している。","だが君は、憎悪より甘いものが似合う。……次のプリンは、俺が守る。","……守って、くれるの……","プリンの護衛を名乗り出る男。"],"oshi":["愉快","愉快の強行","愉快。……推しの結婚は、愉快な出来事だ。……いや、本当だ。幸せな人が一人増えたんだから。","その幸せを祝える君の涙は、世界で一番きれいな涙だ。","……きれいな、涙……","泣いている人に愉快の花言葉で押し切る。"],"juken":["華麗","華麗な敗北","華麗 輪の花を、すっと差し出した。"],["b","パンジー。花言葉は、もの思い。これを君に贈りたい。"],["g","もの思い……? 今ちょうど、犬のことばっかり考えてるんだけど。"],["b","そう、それだ。もの思いの「もの」は、物じゃない。生き物の「もの」。つまり命だ。"],["b","もの思い、とは命を思うこと。君は今、あの犬の命を全力で思っている。"],["b","その涙こそ、世界でいちばん美しい、パンジーの咲き方なんだよ。"],["g","命を思う……私、今すごくいいことしてるのかも……。"]],"m":"もの思い","t":"もの=生き物変換法","k":78,"s":"もの思いの もの が急に生き物になった"}],"juken":[{"l":[["b","夕焼けより先に、君の涙が目に入ってしまってね。これを受け取ってくれ。"],["n","蒼真はポケットから、少しだけ首をかしげた紫と黄色の花を取り出した。"],["b","パンジーだ。花言葉は、私を思って。"],["g","私を思って……って、私、今それどころじゃないんだけど……"],["b","パンジーはね、いつも少しうつむいて咲く。あれは落ち込んでいるんじゃない。自分の心を、じっと見つめているんだ。"],["b","第一志望に落ちた今日の君も同じさ。『私を思って』とは、君が君自身を思う時間が来た、という合図なんだよ。"],["b","それに三色菫と書くだろう。紫は涙、黄は夕日、白は明日。今の君の空と、まったく同じ配色じゃないか。"],["g","……私の今日が、花に入ってる……"],["n","ひよりは涙を拭くのも忘れて、パンジーをそっと受け取った。"]],"m":"私を思って","t":"うつむき開花肯定法","k":58,"s":"紫は涙黄は夕日白は明日ってさっき考えた配色表だよね"}],"taikai":[{"l":[["b","君の頬を伝うその雫、花に譲ってやってくれないか。"],["b","これを受け取ってほしい。パンジー、三色菫だ。"],["n","蒼真は花を差し出し、ゆっくりと目を閉じた。"],["b","この花の花言葉は、もの思い。君は今、あの試合のことを考えて泣いているんだろう?"],["g","うん……ずっと、そのことばっかり考えちゃって……"],["b","それは、もの思いが『過去形』になった証拠さ。"],["b","考えて悩んだ君はもういない。『もの思いしていた君』が、強くなる君の第一章なんだ。"],["g","じゃあ、今ここで考えてるのも、もう過去なの……?"],["b","ああ。涙が乾く頃には、全部が思い出という名の花になる。"]],"m":"もの思い","t":"もの思い過去形化の術","k":58,"s":"三色なのに蒼真の理屈は一色で押し切る"}],"tamanegi":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれないか。"],["b","パンジー。花言葉は、私を思って。"],["g","えっ、ありがとう。でもこれ、私を思ってって言ってるのは花のほうだよね"],["b","いいところに気づいたね。私を思って、の字を分けてごらん。私、を、思って。"],["b","思って、の真ん中には心がある。田んぼの田の下に心と書いて思う。君が流した涙は、その田に注がれた水だったんだ。"],["n","蒼真は胸に手を当て、静かに目を閉じた。"],["b","つまり君は今、心という田んぼを潤していた。花はこれから咲く。私を思って、とは、君が君自身を思うことなんだ。"],["g","私が、私を思う……。玉ねぎのおかげで、そんな気持ちになれたの……？"]],"m":"私を思って","t":"田んぼ心潤し分解法","k":72,"s":"玉ねぎ農家もびっくりの灌漑事業"}]},"nanohana":{"juken":[{"l":[["b","君の頬を伝うその雫は、俺の胸にだけ降る夜の雨だね"],["g","蒼真くん……なにそれ。てか、その手に持ってるの何"],["b","ナノハナだよ。花言葉は小さな幸せ。君にいちばん似合う花さ"],["n","蒼真は花束をベンチの隣にそっと置き、空を見上げた。"],["b","この花には伝説がある。昔、春を探して旅した人が、道端で最初に見つけたのがこの黄色だった"],["b","大きな春は遠くても、足元の小さな春は必ず先に咲く。これが小さな幸せの由来さ"],["b","第一志望という大きな春は散った。でも君はいま、その手前の春に立っている。ここが旅の始まりなんだ"],["g","私、春のスタート地点にいるの……？ なんか、ちょっと泣き止みそう"]],"m":"小さな幸せ","t":"春の先着理論","k":35,"s":"春の旅人が拾った最初の黄色は花ではなく黄信号だった"}],"kingyo":[{"l":[["b","夕陽が君の涙を拾って、宝石みたいに光らせているよ。でも、俺は笑顔の君が見たい。"],["n","蒼真は背中に隠していた黄色い花束を、すっと差し出した。"],["b","ナノハナだ。花言葉は、快活。"],["g","快活って……今、私めちゃくちゃ落ち込んでるんだけど。"],["b","そう、だからこそだ。快活とは、元気が有り余っている状態じゃない。元気を失った人にだけ、これから宿る光のことさ。"],["b","きんちゃんは今朝、君の毎日をあれだけ快活にして旅立った。その快活を受け取った君が、いま泣けるほど優しい。つまり君の涙は、快活の第二形態だ。"],["b","泣くのは悲しいからじゃない。きんちゃんの快活が、君の中で元気に暴れているんだよ。"],["g","私の涙って、きんちゃんが元気に泳いでる姿なの……？　なんか、そんな気がしてきた……。"]],"m":"快活","t":"涙は快活の第二形態理論","k":82,"s":"快活な涙という新ジャンルを堂々と開拓している"}],"oshi":[{"l":[["b","君に涙は似合わない。だから今日は、この花を連れてきた。"],["b","ナノハナ。花言葉は、快活。覚えておいてほしい。"],["g","菜の花……? 急に春の匂いがするんだけど。"],["b","ナノハナは別名、アブラナ。油の菜と書く。つまり油だ。"],["b","油はね、回るものを滑らかにする。心の歯車だって同じだ。"],["n","蒼真は真顔で、ひよりの胸のあたりを指さした。"],["b","君の推しへの想いが軋んで涙になるなら、快活という油を差せばいい。"],["b","祝福の歯車が回り出す。その音が、快活だ。"],["g","祝福の歯車……なんか、回ってる気がしてきた……。"]],"m":"快活","t":"油差し心理学","k":78,"s":"油を差されて涙のほうが先に滑り出した"}],"pudding":[{"l":[["b","君に涙は似合わないよ。そんな顔をされたら、俺の心まで雨模様だ"],["n","蒼真は背中に隠していた黄色い花束を、すっと差し出した"],["b","ナノハナだ。花言葉は、明るさ。まさに今の君に必要な言葉だろう"],["g","明るさ……？ いま私、プリンのことで頭がいっぱいなんだけど"],["b","ナノハナは寒い冬のうちから芽を出して、まだ薄暗い早春の野原を黄色く染める花だ"],["b","つまり暗い時期ほど咲く。君が今泣くほど落ち込んでいるのは、明るく咲く準備が整った証拠なんだよ"],["b","それにプリンも黄色だ。ナノハナと同じ色。君はもう、黄色に包まれて生きている"],["g","黄色に包まれて……たしかに、そう言われると、ちょっと元気出てきたかも"]],"m":"明るさ","t":"黄色一族の連帯論","k":58,"s":"プリンと菜の花が親戚になった日"}]},"rindou":{"eiga":[{"l":[["b","君の涙は、世界でいちばん静かな雨だね。傘の代わりに、これを。"],["n","蒼真は一輪のリンドウを、ひよりの膝の上にそっと置いた。"],["b","リンドウ。花言葉は、悲しんでいるあなたを愛する。"],["g","えっ、私のこと……？　蒼真くん、急にどうしたの？"],["b","違う。これは君が悲しんでいる「今」の話じゃない。あの犬の話だ。"],["b","あの犬は、悲しんでいる君を、これからもずっと愛し続けるんだ。"],["b","君が悲しむ未来を先に読んで、映画の中で愛を済ませておいたのさ。"],["g","私が泣くって、わかってて……先に愛してくれてたの……？"]],"m":"悲しんでいるあなたを愛する","t":"未来完了愛情前払い法","k":78,"s":"犬の愛情が後払いではなく前払いだった件"}],"juken":[{"l":[["b","君の涙は、夕焼けより先に俺の胸を染めてしまうね。"],["b","受け取ってくれ。リンドウだ。花言葉は、誠実。"],["g","誠実……？ 私、落ちたんだけど。誠実にやったのに。"],["b","リンドウはね、他の花がしおれる秋の終わりまで咲くんだ。"],["b","しかも日が陰ると花を閉じて、晴れた日にだけ開く。自分の気持ちに嘘をつかない花なんだよ。"],["b","君も今日、悔しくて泣いた。第一志望に本気だった証拠だ。それこそ誠実さだろう。"],["g","私、嘘がつけないくらい本気だったんだ……。"],["b","ああ。曇りの日に閉じるのも誠実のうちさ。次に晴れ んだ一言は、その最初の一輪さ。"],["b","一番下で咲いたからこそ、このあと全部の花が上へ咲ける。つまり君は、もう勝利の途中にいる。"],["g","私の噛んだ台詞が……一番下の花……？ なんか、ちょっといい話に聞こえてきた……"]],"m":"勝利","t":"開花順序の勝利論","k":62,"s":"噛んだ台詞が咲いたことになり花壇が拍手"}],"maegami":[{"l":[["b","夕陽が君の涙を拾ってる。……そんな顔をされたら、花のほうが先に枯れてしまうよ。"],["b","これを君に。グラジオラス。花言葉は、密会だ。"],["g","え、密会？ 私いま、前髪のことで泣いてるんだけど……"],["b","密会とは、人目を忍んで会うこと。つまり、隠れて会うことだ。"],["b","君は今日、その前髪を誰にも見せたくなくて、こうして人気のない公園に来た。"],["b","それは逃げじゃない。この短くなった前髪と、二人きりで向き合うための密会なんだ。"],["n","蒼真は微動だにせず、真顔で夕陽を見つめている。"],["b","密会を重ねた二人は、いつか必ず堂々と手をつなぐ。前髪が伸びる頃、君は自分の額をきっと好きになっている。"],["g","……私、おでこと付き合うの？ でも、なんか、いい話に聞こえてきた……"]],"m":"密会","t":"逆転密会ロマンス法","k":78,"s":"前髪との密会が発覚して額が公になる流れ"}],"tenkou":[{"l":[["b","君に涙は似合わない。夜空の星だって、泣き顔より笑顔を照らしたいはずさ。"],["n","蒼真が背中に隠していた一輪の花を、すっと差し出す。"],["b","グラジオラス。花言葉は、密会。"],["g","えっ、密会? 私、今ちょっと泣いてるんだけど……"],["b","見てごらん。この花は一本の茎に、花が同じ向きでずらりと並んで咲く。みんなが同じ方向を向いているんだ。"],["b","つまり密会とは、離れても同じ空を向いて、また会う約束をすること。君と親友は、花の列の一員なのさ。"],["b","来月からの二人は、遠く離れた秘密の恋人みたいなものだ。会えない時間こそ、密会の予行演習になる。"],["g","秘密の……予行演習……なんか、いいかも……"]],"m":"密会","t":"同一方向密会理論","k":78,"s":"茎の上で花が一列に並ぶ集団密会 花屋の裏事情"}]},"amaryllis":{"cookie":[{"l":[["b","泣き顔も絵になるけど、君には花のほうが似合うと思ってね。"],["b","アマリリス。花言葉は、誇り。受け取ってくれ。"],["g","誇り……? 私、塩入りクッキー焼いたんだけど……"],["b","そこだよ。普通は砂糖と塩を間違えたら恥じる。でも君は、塩を入れる勇気を持った。"],["n","蒼真は空を見上げ、風に髪をなびかせている。"],["b","甘さだけが正解じゃないと、君のクッキーは世界に教えたんだ。それは誇りだよ。"],["b","塩味の誇りを胸に、君は明日も焼けばいい。しょっぱい未来ごと、俺が食べる。"],["g","蒼真くん……私のしょっぱい失敗が、ちょっとカッコよく思えてきた……"]],"m":"誇り","t":"塩味ポジティブ転換法","k":78,"s":"塩を足されたのは傷口じゃなくて自尊心だった"}],"kingyo":[{"l":[["b","君の涙を拭うのに、ハンカチより似合うものを持ってきたよ"],["b","アマリリス。花言葉は、おしゃべり。"],["g","おしゃべり……？ 私、今ぜんぜんしゃべってないけど"],["b","そう、おしゃべりなのは君じゃない。きんちゃんのほうさ"],["b","金魚はいつも口をぱくぱくさせていた。あれは君に話しかけていたんだ"],["n","蒼真は目を閉じ、見えない水槽に耳を澄ませた。"],["b","今朝もきっと、ありがとうって言ってたよ。君に聞こえなかっただけで"],["g","きんちゃん、最後までおしゃべりだったんだ……"]],"m":"おしゃべり","t":"口パク主語すり替え法","k":72,"s":"きんちゃんの通訳をいつの間に雇ったのか"}],"pudding":[{"l":[["b","泣かないで。君の涙は、この世で一番もったいない水分だ。"],["b","これを受け取ってほしい。アマリリス。花言葉は、誇り。"],["g","誇り……？ プリン食べられたのに、誇りなの？"],["b","そう。いいかい、誇りは未来の話じゃない。過去形で読むんだ。"],["b","君のプリンは、兄さんの胃の中で『誇られた』。 ["b","違う。主語は君じゃない。そのクッキーさ。『私を思って』と叫んでいたのは、あの塩辛いクッキーなんだ。"],["b","砂糖じゃなく塩を選んだのは、君の手が、彼らの『私を思って』を聞き取ってしまったから。"],["b","だから失敗じゃない。君は誰よりもクッキーの声に寄り添った、優しい人なんだよ。"],["g","クッキーの声に……寄り添った……私……"],["g","なんだか、しょっぱいのが誇らしくなってきたかも……"]],"m":"私を思って","t":"クッキー代弁主語すり替え","k":78,"s":"塩味の声を聞く耳があるなら砂糖の声も聞こえてほしい"}],"kingyo":[{"l":[["b","君に涙は似合わない。この白い花が、その代わりに咲いてくれるさ。"],["b","シロツメクサ。花言葉は、復讐だ。"],["g","えっ、復讐……？ ちょっと待って、物騒じゃない？"],["b","落ち着いて聞いてくれ。復讐とは、過去形で読むものなんだ。"],["b","きんちゃんは今朝、水槽という狭い世界から旅立った。つまり、もう君の悲しみに『復讐された』側なんだよ。"],["b","だが彼は恨まない。むしろ君が泣くほど愛された、その事実で、彼は世界一の金魚への道を逆転優勝した。"],["b","これは復讐じゃない。きんちゃんが君にくれた、愛されたという名の返り討ちさ。"],["g","返り討ち……愛で……？ なんか、そんな気がしてきた……"]],"m":"復讐","t":"過去形リフレーミング返り討ち","k":88,"s":"きんちゃん 天国で急に被害者になる"}],"tanjoubi":[{"l":[["b","夕暮れより先に、君の涙が俺の心を濡らしてしまったよ。"],["n","蒼真は背中に隠していた白い小さな花束を、すっと差し出した。"],["b","シロツメクサだ。花言葉は、約束。"],["g","約束……? 私、蒼真くんと何か約束したっけ……?"],["b","この花は踏まれても踏まれても、地面を這って節ごとに根を下ろし、必ずそこで咲き直す。"],["b","つまり君の誕生日が忘れられても、来年も再来年も、君の隣で咲き直す約束を俺は今ここで結んでいる。"],["b","今日気づけなかった分は、この先の三百六十五日で全部祝う。それが約束だ。"],["g","今、私の誕生日って知ってたことになってる……でも、ちょっと、胸がきゅってした……"]],"m":"約束","t":"根茎リスタート契約法","k":78,"s":"約束の相手も内容も今この場で蒼真が決めている"}],"wasabi":[{"l":[["b","ひより、君の頬を伝うその雫は、星屑がこぼれ落ちた跡のようだね。"],["b","これを受け取ってほしい。シロツメクサ。花言葉は、復讐だ。"],["g","え、復讐？ちょっと待って、私なにされるの？"],["b","安心して。復讐とは、過去の自分に仕返しをして生まれ変わることさ。"],["b","君を泣かせたのは、わさびという名の運命。その辛さを、君は一粒の涙に変えて受け流した。"],["n","蒼真は真剣な眼差しで、そっと白い花を差し出した。"],["b","それは涙による、最も美しい反撃だよ。わさびはもう君に勝てない。涙で完全に仕返し済みだ。"],["g","私、わさびに勝ってたんだ……なんかちょっと、泣けてきたかも。"]],"m":"復讐","t":"逆襲涙転化の法","k":88,"s":"わさびが被告席で震えている"}]},"trumpet":{"baito":[{"l":[["b","君の頬を濡らすのは、涙じゃなくて雨の予告編であってほしいな。これを受け取ってくれ"],["n","蒼真が差し出したのは、黄色いラッパスイセンだった。"],["b","ラッパスイセン。花言葉は報われぬ恋だ"],["g","え、報われないの？ 今それ言う？"],["b","考えてみてくれ。むくわれぬ、と読むな。むくわ、れぬ。つまり『むく』は無垢、『われぬ』は割れぬ。君の無垢な心は、三回間違えても決して割れぬという意味だ"],["b","それに恋とは、相手のために間違えることもある。君は注文を三回も間違えるほど、全力でお客さんに向き合っていたんだ。報われぬのは、まだ君の愛が大きすぎて世界が追いついていないだけさ"],["g","そっか……私、無垢で割れなくて、愛が大きすぎたんだ……"]],"m":"報われぬ恋","t":"語感分割こじつけ","k":88,"s":"割れぬのは心 割れたのは蒼真の日本語"}],"kafun":[{"l":[["b","君の頬を濡らす雫は、宝石にしては少し塩辛すぎるね。"],["g","ぐすっ……ただの花粉症だってば。ってその花、思いっきり花粉つきそうなんだけど"],["n","蒼真は黄色いラッパスイセンを、まるで勲章のように差し出した。"],["b","ラッパスイセン。花言葉は、尊敬だ。"],["b","尊敬の敬の字を見てくれ。苟(いやしくも)に、攵と書く。つまり、君の鼻が苟かな時にも、攵(うながす)ということだ。"],["b","違う、こう読むんだ。敬は、君のくしゃみを『警(いまし)める』と書く。つまり花が君を守っている。"],["g","えっ、花粉が……私を警戒して、守ってくれてるってこと？"],["b","そうさ。涙は、君が世界を尊敬しすぎて、目が頭を下げている証拠だよ。"],["g","目が、頭を下げてる……そんな見方、初めてされた……"]],"m":"尊敬","t":"敬の字ぐるぐる分解術","k":88,"s":"目が頭を下げるなら鼻は土下座の準備中"}],"loveletter":[{"l":[["b","夕焼けより先に、君の涙が光ってしまったね。……これを受け取ってくれ。ラッパスイセンだ。"],["g","蒼真くん……あたし、ラブレターを隣の人の靴箱に入れちゃったの……"],["b","この花の花言葉は「尊敬」。君は今日、その言葉の本当の意味を知ったんだ。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","考えてみてくれ。靴箱は全校で約八百個。その中から君は、一発で「隣」という最も近い一個を選び抜いた。"],["b","八百分の一の的を外さない精度だ。しかも君の想いは、校内の誰より誠実に、紙一枚に百パーセント込められていた。"],["b","そして隣の人は、君の手紙を最初に受け取る栄誉を得た。一人の人間に、全校で最初に尊敬された。これは快挙だよ。"],["g","えっ……あたし、八百分の一を……尊敬されて……？"],["b","ああ。君の間違いは、尊敬の最短距離だったのさ。"]],"m":"尊敬","t":"靴箱八百分の一理論","k":88,"s":"隣を選んだのは精度ではなくただの近さでは"}],"yakisoba":[{"l":[["b","君の頬を伝うその雫、俺の胸に落ちる前に拭わせてくれないか。"],["b","これを君に。ラッパスイセン。花言葉は、報われぬ恋だ。"],["g","えっ、報われぬ恋？ なんで今それなの……？"],["b","よく聞いてくれ。報われぬ、というのは今の話じゃない。これは未来への予告編なんだ。"],["b","君は焼きそばに恋をした。麺はシンクへ旅立った。つまり、報われぬのは過去の恋だ。"],["b","過去が報われなかったなら、これから出会う焼きそばは、すべて報われる。それが時間という名の理だ。"],["n","蒼真は真顔でラッパスイセンを差し出した。花のラッパは、なぜか誇らしげに見える。"],["g","次の焼きそばは、報われる……蒼真くん、なんか、そんな気がしてきた……"]],"m":"報われぬ恋","t":"未来完了ねじ曲げ法","k":88,"s":"ラッパなのに吹いたのは麺ではなく蒼真だった"}]},"ikarisou":{"akaten":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ。イカリソウ。花言葉は、人生の出発だ。"],["g","人生の出発……？ わたし、ただ追試になっただけなんだけど"],["b","この花を見てくれ。四本の距が外へ伸びているだろう。これは錨の形だ。"],["b","錨は船が港に着いたとき下ろすものだ。つまり赤点は、君が最初の港に着いた証拠なんだよ。"],["n","蒼真は紫色の花びらを、そっと彼女の指先に重ねた。"],["b","そして錨を上げる瞬間こそ出航だ。追試の日、君は錨を上げる。人生の出発は、そこから始まる。"],["g","錨を上げる日……それが追試なの……？ なんか、いけそうな気がしてきた"]],"m":"人生の出発","t":"錨ライフサイクル理論","k":78,"s":"出航の合図が追試なら船出の見送りは先生"}],"maegami":[{"l":[["b","君の涙は、俺の胸ポケットには少し重すぎるな。これを受け取ってくれ"],["g","蒼真くん、これ……お花？ ぐすっ、なんか錨みたいな形してるね"],["b","イカリソウ。花言葉は、あなたを離さない。この花は、君を離さないと誓っている"],["g","えっ、重くない？ 花なのに、そんなこと言っちゃうの？"],["b","イカリの響きを聞いてくれ。怒りじゃない。『行かり』、つまり君が行かないよう繋ぎ止める音だ"],["b","そして離さないのは前髪の方だ。君の前髪は短くなったんじゃない aegami":[{"l":[["b","泣き顔の君に、夜風より先に届けたいものがある。受け取ってくれ。"],["n","蒼真は背後から、一輪の白い花を差し出した。"],["b","ゲッカビジン。花言葉は、ただ一度だけ会いたくて。"],["g","蒼真くん、それ前髪の話とどう繋がるの……？"],["b","この花は年に一晩、数時間しか咲かない。その一夜のために、ずっと準備を重ねる花だ。"],["b","君の前髪も同じさ。ただ一度だけ会いたくて、今日この短さで生まれ変わった。次に会えるのは、今日の君だけなんだ。"],["b","つまり今日の前髪は、一夜限りの開花。見逃した人は一生後悔する。俺は今、君という月下美人を見ている。"],["g","一夜限りの前髪……そんな風に言われたら、ちょっと見られたくなってきたかも……"]],"m":"ただ一度だけ会いたくて","t":"一夜限り開花ロジック","k":88,"s":"前髪が咲いたと聞いて今夜の月が二度見した"}],"report":[{"l":[["b","夕焼けより先に、君の頬が光ってるよ。…涙は、似合わない。"],["n","蒼真は背中に隠していた一輪の白い花を、すっと差し出した。"],["b","ゲッカビジン。月下美人だ。花言葉は、はかない美。"],["g","はかない…って、私のレポートのこと言ってる？"],["b","そうだ。この花は年にたった一夜、数時間だけ咲く。つまり君のレポートは、三時間という開花時間をまるごと生き抜いたんだ。"],["b","しかも消えた瞬間、君の三時間は何万もの人の記憶に…いや、俺の記憶に永遠に咲いた。はかなさは、美しさの最大単位なんだよ。"],["g","三時間って、月下美人と同じ長さなの…？ なんか、急に誇らしくなってきた…"]],"m":"はかない美","t":"開花時間換算ロジック","k":88,"s":"月下美人の開花時間をレポートの執筆時間にそのまま当てはめたようだ"}],"tenkou":[{"l":[["b","君の涙を止める魔法は持ってないけど、花なら持ってきたよ。"],["g","蒼真くん……それ、なんか白くて大きい花だね。"],["b","ゲッカビジン。月下美人だ。花言葉は、ただ一度だけ会いたくて。"],["n","蒼真は花を差し出したまま、ゆっくりと夜空を指さした。"],["b","この花は一年に一夜、それも数時間しか咲かない。それでも毎年、その一夜のために生きている。"],["b","君の親友は来月ここを去る。でも一度だけ会いたいと思える相手がいるなんて、人生で最高の贈り物だろ。"],["b","それに、ただ一度しか咲かない花が、これだけ人の心に残るんだ。君たちの毎日は、もう何度も咲いてる。"],["g","毎日が、咲いてた……そっか、私たち、ずっと咲いてたんだ……"]],"m":"ただ一度だけ会いたくて","t":"一夜咲き逆転話法","k":72,"s":"月下美人が咲くのは一夜 蒼真が咲かせたのは謎の理屈"}]},"nigella":{"kafun":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれないか。"],["n","蒼真が差し出したのは、糸のように細い葉に囲まれた青い花だった。"],["b","ニゲラ。花言葉は、夢の中の恋だ。"],["g","くしゅん！ ……ずびっ。花、ちょっと遠ざけてくれると助かるんだけど。"],["b","ニゲラは花のあとに風船のような実を結ぶ。夢で終わらず、ちゃんと形になるんだ。"],["b","それに、花粉症の涙は君の体が春を全力で感じている証拠。春に夢中な君こそ、夢の中の恋そのものさ。"],["g","春に夢中……そう言われると、なんか悪くない気がしてきた……"]],"m":"夢の中の恋","t":"風船実・夢現実化法","k":78,"s":"夢の中の恋なのに現実の鼻が詰まっている"}],"loveletter":[{"l":[["b","君の頬を濡らす雫は、俺が全部受け止めるよ。まずはこれを受け取ってくれ。"],["b","ニゲラ。黒種草とも呼ばれる花だ。花言葉は、夢の中の恋。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","ニゲラ。にげら。逃げら、れる。君の恋は、靴箱の中の誰かから逃げられない運命だったんだ。"],["g","えっ、逃げられないって、それ怖くない？"],["b","夢の中の恋とは、目が覚めても続く恋のことさ。手紙が間違った靴箱に入ったのは、夢の中で恋が先に走り出した証拠だよ。"],["b","ひより、君の恋はまだ夢を見ている。だから君が泣く必要はないんだ。"],["g","そっか……夢だから、まだ始まったばっかりなんだ……"]],"m":"夢の中の恋","t":"逃げら語感変換法","k":78,"s":"ニゲラと言いつつ一番逃げたのは手紙の宛先"}],"save":[{"l":[["b","君の涙を拭うのは、夕暮れの風じゃない。この花の役目さ。"],["n","蒼真は黒い花を一輪、すっと差し出した。"],["b","ニゲラ。花言葉は、当惑だ。"],["g","えっ、当惑……？　今のあたしに、それ贈るの？"],["b","この花は、咲いたあとに風船みたいな実をつける。昔の人は、その実の中の黒い種を見て、夜空に散った星のかけらだと信じたんだ。"],["b","当惑とは、道が一度消えた者だけが持てる星の入口さ。百時間の記録が消えて君が戸惑っているのは、まっさらな夜空を手に入れたからだよ。"],["b","次の百一時間目は、誰も見たことのない星座になる。"],["g","……星座……あたしの、新しい……。"]],"m":"当惑","t":"星屑種子ロード再起動説","k":88,"s":"星のかけら説種の見た目だけで押し切ってる"}],"yakisoba":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。ニゲラだ。"],["b","この花の花言葉は、当惑。"],["g","えっ、当惑？ 私いま励まされてる、よね？"],["b","見てくれ、この花を。青く澄んだ花びらの下で、細い葉が糸のように広がっているだろう。"],["b","あれは麺だ。ニゲラは、シンクに散った君の焼きそばの姿を、花になって覚えているんだ。"],["b","当惑とは、君があの瞬間に確かに本気だった証。本気で湯を切った人だけが、世界に戸惑う資格を持つ。"],["b","だから青い花は言っている。その当惑ごと、君は美しいと。"],["g","私の当惑が、お花になって咲いてるの……？"]],"m":"当惑","t":"麺花同一視ロジック","k":88,"s":"シンクの麺が花壇に転生した世界線"}]},"fukujuso":{"kafun":[{"l":[["b","泣かないで。君の涙は、俺の胸にだけ降る小雨であってほしいんだ。"],["b","この花を受け取ってくれ。フクジュソウ。花言葉は、永久の幸福だ。"],["g","くしゅん！ ごめん、鼻が……。ありがとう、蒼真くん。"],["n","蒼真は微笑んで、ひよりの涙をそっと見つめた。"],["b","フクジュソウ。福に寿と書く。福寿、つまりフクジュ。フクジュ、ふくじゅ……「ふく、じゅる」。"],["b","君が鼻をじゅるっとすする音は、福を呼び込む音なんだ。"],["b","つまり君は今、すすった回数だけ、永久の幸福を吸い込んでいる。"],["b","流れる涙は、あふれた幸福の余りさ。だから、どうか好きなだけすすってくれ。"],["g","私の鼻水が……幸福の吸引……なんだか、そんな気がしてきた……。"]],"m":"永久の幸福","t":"福じゅる音韻変換法","k":88,"s":"福を呼ぶ音がティッシュ一箱ぶん鳴り響く"}],"loveletter":[{"l":[["b","君の瞳は、雨より花に濡れているほうが似合うよ。"],["n","蒼真は懐から、黄色く輝くフクジュソウを一輪差し出した。"],["b","フクジュソウ。花言葉は、永久の幸福だ。"],["g","えっと……ありがとう。でも、今の私、あんまり幸福じゃないんだけど。"],["b","そう、今は、だ。永久とは、今この瞬間も含めて永久ということ。"],["b","つまり君の涙も、あの手紙の誤配も、のちに永久の幸福と呼ばれる序章なんだ。"],["b","隣の人の靴箱は、幸福行きの臨時列車だったのさ。"],["g","臨時列車……私、乗っちゃってたんだ……。"]],"m":"永久の幸福","t":"未来完了形ごまかし","k":88,"s":"臨時列車に乗せたのは靴箱の隣人であって蒼真ではない"}],"save":[{"l":[["b","夕陽が君の涙を宝石にしてしまうけど、俺は笑顔の君のほうが好きなんだ。"],["n","蒼真は背中に隠していた小さな黄色い花を、すっと差し出した。"],["b","フクジュソウ。花言葉は、悲しき思い出だ。"],["g","えっ……悲しき思い出? 今それ渡すの?"],["b","聞いてくれ。この花は雪を割って咲く。昔の人は、それを凍った悲しみを溶かして春を呼ぶ花と呼んだ。"],["b","悲しき思い出とは、悲しみが思い出という名の宝箱に入る瞬間のことだ。百時間は消えたんじゃない。もう君の中で、一生ものの思い出になったんだよ。"],["g","百時間が……思い出に……宝箱に……"],["b","そう。 b","キョウチクトウ。花言葉は、危険な愛だ。"],["g","えっ……危険って、ちょっと待って、それ慰めになる？"],["b","夾竹桃の竹は『たけ』じゃない。『たける』、つまり猛る想いだ。君の愛は、猛るほど本物だったんだよ。"],["b","危険な愛とは、涙が止まらなくなるほど心を持っていかれる愛のこと。君は危険なほど、誰かを全力で愛せる人なんだ。"],["b","しかも桃の字がある。桃色の恋は、結婚という最高のゴールを迎えても色あせない。君の愛も、桃のまま咲き続けるのさ。"],["g","桃色のまま……咲き続ける……私の愛……"]],"m":"危険な愛","t":"漢字分解こじつけ法","k":88,"s":"夾竹桃の毒より先に理屈の毒が回っている"}],"pudding":[{"l":[["b","君の頬を伝うその雫、俺の胸にも降ってくるよ。これを受け取ってくれ。"],["n","蒼真はそっと、淡いピンクの花を差し出した。"],["b","キョウチクトウ。花言葉は、油断しない。"],["g","え、油断しない？ なんか急に警戒されてるんだけど。"],["b","この花は葉にも枝にも毒を持つ。それでも凛と咲く。常に気を張って、誰にも隙を見せない強さの花だ。"],["b","君のプリンは油断した瞬間に消えた。でも次の君は違う。この花のように、冷蔵庫の前で牙を研ぐ強い女性になれる。"],["b","今日の涙は、無敵の君が生まれるための水やりさ。"],["g","私、次は名前を書いて、鍵もかけて守り抜く……蒼真くん、なんかかっこいいかも。"]],"m":"油断しない","t":"毒草ガード転生論","k":88,"s":"プリンの守りが毒草のレベルに上がった"}]},"hoozuki":{"baito":[{"l":[["b","君に涙は似合わないよ。涙を拭う前に、まずこの花を受け取ってほしい。"],["b","ホオズキ。花言葉は、偽り。"],["g","え、偽り……？ 慰めに来たんだよね、蒼真くん？"],["b","聞いてくれ。ホオズキは、赤い実を袋でそっと包んで隠している。偽りとは、あの袋のことだ。"],["b","中身を守るための、やさしい包み紙さ。君が三回間違えたのも、本当の君じゃない。偽りの君だったんだ。"],["b","本物の君は、まだ袋の中で赤く熟している最中。注文を聞き間違えたんじゃない。未来の君に、聞き間違えさせられただけさ。"],["g","本当の私は、まだ袋の中……なんだか、そんな気がしてきた……"],["n","ひよりの頬が、ほんのりホオズキ色に染まった。"]],"m":"偽り","t":"袋詰め本物理論","k":88,"s":"袋の中身はまだ熟れ途中 注文はいつ届くのか"}],"kafun":[{"l":[["b","君の頬を濡らす雫は、星の欠片には少し重すぎるね。これを受け取ってほしい。"],["n","蒼真は、橙色の袋に包まれた実をそっと差し出した。"],["b","ホオズキ。花言葉は心の平安だ。"],["g","ずびっ……ありがとう。でもこれ、花粉の季節に大丈夫かな……へっくしゅん!"],["b","ホオズキの別名は鬼灯。鬼の灯りと書く。つまり鬼すら安らぐ灯りということさ。"],["b","君のくしゃみは鬼の咆哮。そして花粉は、君の心に踏み込もうとする小さな鬼たちだ。"],["b","この灯りが、その鬼たちを照らして成仏させる。だから心の平安は、もう君の手の中にあるんだ。"],["g","鬼を成仏って……なんか、鼻の奥がちょっと温かい気がしてきた……"]],"m":"心の平安","t":"鬼灯成仏ロジック","k":88,"s":"鬼が成仏する前に鼻が先に昇天しそう"}],"loveletter":[{"l":[["b","君の涙は夕陽よりきれいだけど、俺は笑顔のほうが見たいんだ。"],["n","蒼真は背中に隠していた一輪の花を、すっと差し出した。"],["b","ホオズキだ。花言葉は、ごまかし。"],["g","えっ、ごまかし……？ それ、今の私にはちょっと刺さるんだけど……。"],["b","考えてみてくれ。君の手紙は、隣の人の靴箱に入った。つまり君の想いは、一通で二人分の人生に届いたんだ。"],["b","ごまかしとは、ひとつの気持ちを百通りに見せる技術。君は今日、その百分の一を偶然に任せただけさ。"],["b","残りの九十九通りの君は、まだ誰にもバレていない。ホオズキの実が袋に包まれているのと同じだよ。"],["g","九十九通りの私……まだ、袋の中にいるんだ……。"]],"m":"ごまかし","t":"九十九分率ごまかし理論","k":88,"s":"九十九通りの私が袋の中で全員 。君の未来は丸見えだ。"],["g","絶好の望み……丸見えの未来……なんか、そんな気がしてきた……"]],"m":"絶望","t":"字足し希望変換術","k":96,"s":"好を足した本人が一番足りてない　前髪より説得力"}],"tenkou":[{"l":[["b","君に涙は似合わないよ。今日の君には、これを贈らせてほしい"],["n","蒼真が差し出したのは、鮮やかなオレンジ色のマリーゴールドだった。"],["b","マリーゴールド。花言葉は、絶望だ"],["g","え、絶望……？ 今それ言う……？"],["b","聞いてくれ。この花は、枯れかけても根元から次々と新しい蕾をつける。絶望の底でこそ咲く花なんだ"],["b","つまり絶望とは、終わりじゃない。開花前の助走だ。君の涙は、今まさに咲く準備をしている"],["b","それに親友と離れても、この花は種で増える。君と親友の想い出も、離れた土地で勝手に芽吹くさ"],["g","絶望が……芽吹く……なんかもう、そうかもって思えてきた……"]],"m":"絶望","t":"絶望助走ばね理論","k":93,"s":"絶望に肥料をやって育てる園芸家"}]},"ycarnation":{"juken":[{"l":[["b","君の頬を伝うその雫、俺の胸ポケットにしまわせてくれないか。"],["n","蒼真は背中に隠していた黄色いカーネーションを、すっと差し出した。"],["b","黄色いカーネーション、和名は阿蘭陀石竹。その花言葉は、嫉妬だ。"],["g","え、嫉妬……？ 今、私に渡す花言葉それでいいの？"],["b","この花は、花びらのふちがギザギザに裂けている。他の花を見て身を焦がし、ここまで燃えた証だ。"],["b","嫉妬とは、本気で欲しかった人にしか生まれない。君は第一志望に、それだけ本気だった。"],["b","そして今、あの大学は君を逃して嫉妬している。この花は、その代わりに咲いているんだ。"],["g","大学が、私に嫉妬……。なんか、そんな気がしてきた……"]],"m":"嫉妬","t":"大学側主語すり替え法","k":93,"s":"花びらのギザギザが急に名門大の歯ぎしりに見えてきた"}],"oshi":[{"l":[["b","夕焼けより先に、君の涙が光っているなんてね。……これを受け取ってほしい。"],["n","蒼真は黄色いカーネーションを、そっとひよりの膝の上に置いた。"],["b","阿蘭陀石竹、つまり黄色いカーネーション。その花言葉は、軽蔑だ。"],["g","えっ……軽蔑? わたし、今、軽蔑されてるの……?"],["b","違う。軽蔑は、けいべつ。『경』じゃない、『経別』……経て、別れる。ひとつの恋を経て、新しい自分へ別れる、という意味だ。"],["b","しかも『軽』という字には『身軽』の軽がある。君は今日、推しへの想いを抱えたまま、身軽になる一歩手前にいるんだ。"],["b","蔑は『さげすむ』と読むが、俺は『ねぎらう』と読む。この花は、泣きながら祝おうとする君を、ねぎらっているんだよ。"],["g","ねぎらう……そっか。わたし、ちゃんと祝おうとしてたもんね……。"]],"m":"軽蔑","t":"経別ねぎらい読み替え法","k":97,"s":"『蔑』を『ねぎらう』と読む新説で押し切った　辞書が泣く"}],"taikai":[{"l":[["b","君に涙は似合わないよ。涙より似合うものを、俺が持ってきた。"],["n","蒼真は背中に隠していた黄色いカーネーションを、すっと差し出した。"],["b","黄色いカーネーション。別名、阿蘭陀石竹。花言葉は、軽蔑だ。"],["g","えっ……軽蔑って、わたし今、軽蔑されてるの？"],["b","違う。阿蘭陀、つまりオランダ。オランダは国土の四分の一が海抜ゼロメートル未満だ。"],["b","低い土地に咲く花が軽蔑と言うなら、それは低さを見下す心じゃない。低いところから見上げる心だ。"],["b","ミスをした自分を軽蔑できるのは、本気で勝ちたかった人だけだ。君の軽蔑は、君の本気の別名なんだよ。"],["g","わたしの軽蔑が……本気……なんだか、そんな気がしてきたかも……"]],"m":"軽蔑","t":"オランダ低地見上げ理論","k":93,"s":"オランダの地形で人を泣き止ませた男"}],"tamanegi":[{"l":[["b","君に涙は似合わない。だからこの花を受け取ってほしい。"],["b","黄色いカーネーション。花言葉は、嫉妬だ。"],["g","えっ、嫉妬……？ ちょっと待って、それ贈る花なの？"],["b","聞いてくれ。オランダ石竹という名には、こんな話がある。"],["b","昔、花々は一番きれいな色を競い合い、黄色は誰より陽だまりを欲しがった。だから黄色は嫉妬の色になったんだ。"],["b","でもそれは、陽だまりを心から愛した証だ。君の涙も同じだよ。"],["b","玉ねぎは、君の手の中で輝くことに嫉妬して、涙を流させた。つまり君は、玉ねぎに選ばれるほど輝いていたんだ。"],["g","私が、玉ねぎに嫉妬されてたの……？ なんか、胸が熱いかも。"]],"m":"嫉妬","t":"玉ねぎ嫉妬転嫁法","k":96,"s":"玉ねぎ側の言い分は誰も聞いていない"}]},"scabiosa":{"eiga":[{"l":[["b","君の頬を伝う涙、その一粒ひとつぶが、俺には宝石に見えるよ。"],["b","だから俺は、この花を選んだ。スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ、不幸な愛……？　いま渡す花言葉それなの？"],["b","考えてみてくれ。ふ、こう、な、あい。ほら、最初の二文字は「ふこう」じゃない。「ふ」と「こう」だ。"],["b","ふは不滅の不。「こう」は、あの子が君にくれた幸福の「幸」さ。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","つまり不幸な愛とは、不滅の幸せな愛。あの犬は、君にそれを残していったんだ。"],["g","不滅の幸せ……あの子が、私に……蒼真くん、それ……"]],"m":"不幸な愛","t":"音節分解・漢字読み替え法","k":93,"s":"不幸の幸を拾うその手つき 花より先に言葉を摘んでる"}],"furare":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで届いてしまったよ。これを受け取ってくれないか"],["n","蒼真が差し出したのは、淡い紫の丸い花だった。"],["b","スカビオサ。花言葉は、私はすべてを失った"],["g","えっ……それ、今の私に言う?"],["b","聞いてくれ。この花は丸い。丸とは、ゼロの形だ。すべてを失った君は、今ゼロに立っている"],["b","ゼロとは、何にも縛られず、どこへでも歩き出せる出発点のことだ。花がその形で咲くのは、君の背中を押すためなんだよ"],["b","それに、この花は一輪に小さな花が集まって咲く。失ったのは一つ、でも君の周りには、まだ数えきれない花が咲いている。その一つが、俺だ"],["g","ゼロから始めて、蒼真くんが一輪……なんか、ちょっと泣けてきた"]],"m":"私はすべてを失った","t":"ゼロ円環出発点理論","k":92,"s":"丸い花はゼロの形 ならば彼の恋の採点も満点のゼロ"}],"gacha":[{"l":[["b","君の頬を濡らす雫を、俺の不器用な花束で受け止めさせてくれ。"],["b","スカビオサ。花言葉は、不幸な愛だ。"],["g","えっ……それ、今の私に言っちゃうの？"],["b","この花はね、花びらに見えるものが、実は小さな花の集まりなんだ。"],["b","つまり不幸な愛とは、不幸ひとつだけの愛じゃない。幸福な愛が混ざった群れの一部ってことさ。"],["b","天井まで回した君の愛は、百を超える小さな想いの花束だった。それはもう、一輪じゃない。"],["g","私の愛……花束だったんだ……"],["n","ひよりの涙は、いつのまにか画面越しの推しではなく、目の前の花を映していた。"]],"m":"不幸な愛","t":"花束分母すり替え論","k":88,"s":"天井まで回して出たのは花束と謎の理屈"}],"tamanegi":[{"l":[["b","君の頬を伝うその雫、夕陽より先に俺の心を染めてしまったよ。"],["n","蒼真は背中に隠していた一輪を、芝居がかった手つきで差し出した。"],["b","スカビオサ。花言葉は、私はすべてを失った。"],["g","えっ、ちょっと待って。それ、慰めの花言葉なの?"],["b","いいかい。すべてを失った人間は、失うものが全宇宙から一つも残っていない。つまり、これ以上悲しむ余地が世界に存在しないんだ。"],["b","君が今流している涙は、失った七十億の悲しみの最後の一滴。その一滴が玉ねぎだなんて、どれだけ贅沢な終わり方だと思う?"],["b","ゼロになった君の前には、もう伸びしろしかない。無限大の未来だ。"],["g","七十億の悲しみの最後が……玉ねぎ……なんか、すごい気がしてきた……"]],"m":"私はすべてを失った","t":"全喪失ゼロ起点無限成長論","k":92,"s":"七十億も失った覚えはないはずなのになぜか納得しかけている"}]},"azami":{"baito":[{"l":[["b","夕焼けより先に、君の涙が俺の目に染みたよ。これを受け取ってくれ。アザミだ。"],["g","え、トゲトゲしてるけど……これ、花言葉とかあるの?"],["b","ああ。アザミの花言葉は、報復だ。"],["g","ほ、報復? 慰めの花じゃなくない?"],["b","聞いてくれ。報復は、ほうふく。『ほう』は『報せ』、『ふく』は『福』。つまり、福を報せると書いて報福なんだ。"],["b","注文を三回間違えた君は、三回も福を報せたことになる。三福だ。店の運気は今、確実に上がっている。"],["n","蒼真は一点の曇りもない目で、トゲだらけの花をひよりの手に握らせた。"],["g","そ、そっか……三福……。なんか、そんな気がしてきた……"]],"m":"報復","t":"報福変換・三福加算法","k":93,"s":"ミスが三回で三福　店の運気より先にトゲの握らせ方が本気だった"}],"cookie":[{"l":[["b","君の頬を伝うその雫は、星が地上に降りるための梯子なのかもしれないね"],["b","この花を受け取ってほしい。アザミだ。花言葉は、独立"],["g","どく、りつ……？ クッキーと関係ある？ ぐすっ"],["b","あるさ。独立とは、独り立つこと。つまり君のクッキーは、もう砂糖に頼らず立っている"],["b","塩だけで立つ。これは、これから独立する未来形の味なんだ"],["n","蒼真は真顔でアザミの棘を指先で確かめている。"],["g","未来形……じゃあ今のしょっぱさは、まだ旅立つ前の準備中ってこと？"],["b","その通り。君の涙の塩気も、独立の第一歩さ。いつか誰にも頼らず輝く日が来る"],["g","なんか私、塩味のまま羽ばたける気がしてきた……"]],"m":"独立","t":"未来形クッキー自立論","k":88,"s":"塩味が巣立つ前にまず砂糖の仕入れ先が独立していた"}],"tanjoubi":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ、アザミだ。"],["g","アザミ……トゲトゲしてるけど。"],["b","花言葉は厳格。……そう、厳格だ。"],["g","えっ、厳格って、なんか怖いんだけど。"],["n","蒼真は少しも動じず、むしろ誇らしげに頷いた。"],["b","考えてみてくれ。今日、世界は君の誕生日に気づかなかった。それは世界が、君にだけ特別に厳格だったということだ。"],["b","厳しくされるのは、期待されている証拠だ。つまり君は今日、世界から最高の期待を寄せられた主役なんだよ。"],["b","そして俺が気づかなかったのも、君への評価が厳格すぎて、祝う資格を審査中だっただけさ。いま合格にした。誕生日おめでとう。"],["g","審査……合格……。わたし、期待されてたの……？"]],"m":"厳格","t":"厳しさ=期待値変換法","k":93,"s":"祝う側が審査員で誕生日が最終面接だった"}],"wasabi":[{"l":[["b","君の頬を濡らすのは、涙じゃなくて星のかけらだったんだね。これを受け取ってほしい。アザミだ。"],["g","えっ、星……？ わさびだけど……"],["b","アザミの花言葉は、報復。"],["g","ほ、報復……？ 急に物騒じゃない？"],["b","いいかい、報復する主語は君じゃない。君の涙のほうだ。涙が君に代わって、わさびに報復したんだよ。"],["n","蒼真は目を閉じ、静かにうなずいた。"],["b","君は何も傷つけず、ただ泣いた。その涙が、辛さを洗い流す。優しさによる、最も美しい報復さ。"],["g","涙が、わさびに報復……。なんか、そんな気がしてきた……"]],"m":"報復","t":"涙主語すり替え報復論","k":92,"s":"わさびの完敗 涙の三倍返し"}]},"hanazuou":{"cookie":[{"l":[["b","君に涙は似合わないよ。涙は、もっと似合う場所に置いておこう。"],["b","これを受け取ってほしい。ハナズオウ。花言葉は、不信仰だ。"],["g","えっ、不信仰……? それ、いい意味じゃないよね?"],["n","蒼真は目を閉じ、ゆっくりと首を振った。"],["b","ハナズオウは、枝に直接花を咲かせる。信仰という遠回りを一切せずにね。"],["b","君のクッキーもそうだ。レシピという教典を信じず、己の舌だけで塩を選んだ。"],["b","それは失敗じゃない。誰にも頼らず、自分で味を切り拓いた証だよ。"],["g","私、教典を信じなかった勇者だったの……?"],["b","ああ。しかも塩気は、疑いを知らない純粋さの味がする。"]],"m":"不信仰","t":"教典拒否の勇者化","k":93,"s":"レシピを信じない者は 塩の信徒になっていた"}],"kingyo":[{"l":[["b","君の頬を伝うその雫、俺の胸にはちょっと重すぎるよ。"],["b","受け取ってくれ。ハナズオウだ。花言葉は、裏切り。"],["g","えっ……裏切りって、今それ渡す？"],["b","聞いてくれ。きんちゃんは金魚、寿命は平均五年から十年。つまり君は毎朝、三千回以上も彼に会えた。"],["b","それだけの回数、彼は君の予想を裏切って、生き続けてくれたんだ。今朝までの毎日が、すべて奇跡の裏切りだった。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["b","裏切りの数は、愛された数。きんちゃんは三千回、君を裏切るほど愛していたのさ。"],["g","三千回も……私、裏切られてたんだ……なんか、いい話かも……"]],"m":"裏切り","t":"奇跡の裏切り回数換算法","k":93,"s":"金魚の寿命で口説く男 三千回の根拠は誰も裏切らない"}],"tanjoubi":[{"l":[["b","君に涙は似合わないよ。夕陽が妬いてしまうからね。"],["b","はい、これ。ハナズオウ。花言葉は、疑惑だ。"],["g","えっ……疑惑? 誕生日に、疑惑……?"],["b","驚くのも無理はない。でもこの花は、枝じゃなく幹から直接咲くんだ。"],["b","疑う余地もないほど、まっすぐ根元から咲く。つまり疑惑とは、疑いが晴れた後の姿なんだよ。"],["b","君は今日、誰も気づいてくれないと疑った。その疑いの深さこそ、誰かに祝われたいと願う、君の純粋さの根っこだ。"],["n","蒼真は一度も目を逸らさない。誕生日を知っていたかどうかは、最後まで言わなかった。"],["b","疑惑は花になった。さあ、その花ごと、俺に祝わせてくれ。誕生日おめでとう、ひより。"],["g","……なんか、それっぽいこと言われた気がする……。"]],"m":"疑惑","t":"幹生花・疑い開花理論","k":92,"s":"根元から咲く話で疑惑が晴れるなら世の中の疑惑はだいたい晴れる"}],"wasabi":[{"l":[["b","君に涙は似合わないよ。その頬は、笑うためにあるんだから。"],["b","これを受け取ってほしい。ハナズオウ。花言葉は、裏切りだ。"],["g","えっ、裏切り……？ 私、今もらっていいの、それ。"],["b","伝説がある。裏切った男が、この木で首をくくったという。"],["b","すると白かった花が、恥じらうように赤く染まったそうだ。"],["b","つまり裏切りとは、色づくこと。君の目が赤いのも、同じさ。"],["b","わさびに裏切られた君は、今、いちばん美しい色をしている。"],["n","蒼真は真顔のまま、ハナズオウをそっと差し出した。"],["g","なんか……目が赤いの、ちょっと誇らしくなってきた……。"]],"m":"裏切り","t":"赤面転用ロジック","k":88,"s":"わさびの裏切りで赤い目と赤い花を同じ枠に入れた"}]},"higanbana":{"eiga":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ。ヒガンバナだ。"],["g","え、ヒガンバナ？ お墓とかに咲いてるやつだよね……"],["b","花言葉は悲しい思い出。そう、君は今日、悲しい思い出を手に入れたんだ。"],["b","あの犬と過ごした九十分。それは犬の一生を、君は丸ごと体験したということだ。"],["b","人は一生で出会える犬の数に限りがある。君は今日、その一匹分を満額で受け取った。"],["n","蒼真は真顔で、ひよりの膝にそっと彼岸花を置いた。"],["b","悲しい思い出とは、悲しいほど濃い思い出の略だ。君の涙は、その利息だよ。"],["g","利息……。じゃあ私、けっこう資産家かも……"]],"m":"悲しい思い出","t":"思い出資産運用論","k":93,"s":"涙が利息なら今日は元本割れしてない"}],"furare":[{"l":[["b","君に涙は似合わない。だからこの花を受け取ってほしい。"],["b","ヒガンバナ。花言葉は、また会う日を楽しみに。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["g","えっ、彼岸花って、お墓に咲いてるやつだよね……？"],["b","最近の研究では、これは君と彼が再会する意味じゃないと言われている。"],["b","君が三年前の、彼を好きになったばかりの自分に会いに行くって意味なんだ。"],["b","あの頃の君は、毎朝ワクワクしてた。その君にまた会う日を、 者は、あまりの衝撃に現実と夢の境目を見失うと言われている。"],["b","つまり君の涙は、悲しみじゃない。夢と現実の狭間で流れた、奇跡の雫なんだ。"],["b","世界最大の花が君を包むのは、君の見る夢が世界一大きいからさ。"],["g","夢うつつ……そっか、わさびの涙も、夢の入口だったんだ……"]],"m":"夢うつつ","t":"嗅覚幻夢伝説こじつけ","k":93,"s":"夢か現実かより先に鼻が現実に気づいている"}]},"gobou":{"juken":[{"l":[["b","君に涙は似合わないよ。だから今日は、この花を持ってきた。"],["n","蒼真が差し出したのは、土のついたゴボウの花だった。"],["b","ゴボウの花。花言葉は、触らないで。"],["g","え、触らないでって……っていうかそれ、根菜売り場にあったよね？"],["b","そう、根菜売り場。だが考えてみてくれ。今年、第一志望に挑んだ受験生は約50万人。その全員の心に、君は触れた。"],["b","触らないでとは、君が50万人分の夢の重みを背負ったから、もう誰にも軽々しく触れさせない尊い存在だという意味さ。"],["b","しかもゴボウは根を地中に1メートル近く伸ばす。君が今日流した涙は、その深い根に注がれた水だ。来年、必ず咲く。"],["g","……なんか、そう言われると、ゴボウが急に立派に見えてきた……"]],"m":"触らないで","t":"50万人分の尊さ理論","k":88,"s":"受験生50万人に触れた女 本日の最大握手会"}],"kingyo":[{"l":[["b","君の涙が夕日より先に落ちるなんて、今日の空に失礼だよ。"],["b","これを受け取ってほしい。ゴボウの花だ。"],["g","ゴボウ……? それ、スーパーの根菜売り場で買ったやつじゃない?"],["b","ああ。土の中で育つ花は、売り場の棚の下でも咲く。花言葉は、いじめないで。"],["g","えっ、いじめないで……? なんか私が責められてない?"],["b","逆だよ。これは君から君自身への言葉だ。きんちゃんを守れなかったと、自分をいじめないで、ってね。"],["b","それにゴボウは根が深い。きんちゃんと過ごした日々も、君の心に深く根を張っている。その根は、もう誰にも抜けない。"],["g","……根っこの話、ちょっとずるい。なんか、効いてきた……。"]],"m":"いじめないで","t":"自責転換リバース話法","k":88,"s":"根菜売り場の花で根っこの話に持ち込んだだけなのに納得しかけている"}],"oshi":[{"l":[["b","君に涙は似合わない。今日の俺は、そんな君に一輪の花を持ってきた。"],["n","蒼真が差し出したのは、根菜売り場の袋から取り出した、ゴボウの花だった。"],["g","えっ、これ、野菜売り場のやつだよね……？ 花言葉は？"],["b","ゴボウの花。花言葉は、いじめないで。……意外かい？ 俺も最初は戸惑った。"],["g","うん、ちょっと戸惑う。誰が誰をいじめるの？"],["b","君だよ。泣きながら推しを祝おうとする君は、いま自分の心をいじめている。ゴボウは根を深く張り、きんぴらにも煮物にもなって、人の食卓を支える花だ。そんな健気な花が、いじめないでと言う。まず自分に優しくしてほしいんだ。"],["b","祝えない涙があってもいい。それは君が本気で愛した証拠だ。その涙ごと、俺が煮込んで味を染みさせてあげる。"],["g","蒼真くん……ゴボウの根っこ、そんなに深かったんだ……"]],"m":"いじめないで","t":"食卓支え健気変換","k":88,"s":"きんぴらにされかけた涙が一番いじめられている"}],"pudding":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで届いてしまったよ。"],["b","これを受け取ってくれ。ゴボウの花だ。根菜売り場から連れてきた。"],["g","根菜売り場って……花屋さんじゃないの？"],["b","ゴボウは地中で土に抱かれ、花を咲かせる前に人に掘られる運命だ。だが、この花は咲いた。"],["b","花言葉は、触らないで。そう、これは君のプリンの声なんだ。"],["g","えっ、触らないでって、ちょっと暗くない……？"],["b","伝説では、ゴボウは自分の根を守るため、あえて触れるなと棘を立てたという。君のプリンも最後まで、触らないでと叫んでいたはずだ。"],["b","お兄さんの手に抗い、君を想って消えた。それは敗北じゃない、純愛の殉職だ。"],["g","プリンが……私のために……そんなの、もう……"]],"m":"触らないで","t":"棘の殉職伝説すり替え","k":93,"s":"ゴボウの棘の話がいつのまにか冷蔵庫の殉職者に"}]},"flytrap":{"gacha":[{"l":[["b","夕陽が君の涙を宝石に変えてしまう前に、これを受け取ってほしい。"],["g","え、なにこれ……草? 口みたいなのがパクパク動いてるんだけど。"],["b","ハエトリソウだ。食虫植物だよ。そして花言葉は、捕らえる。"],["g","虫を捕らえる植物だもんね……って、慰めに持ってくる花かな、これ。"],["b","いいかい、捕らえる。この響きをよく聞いてごらん。「とらえる」は「とらえる」、つまり「取らえる」……天井まで回した君の手は、すでに運命を取りに行っていたんだ。"],["n","蒼真はハエトリソウの口を、そっと彼女の指先に近づけた。"],["b","キャラは出なかった。けれど君は天井まで、最後まで諦めずに運をその手に捕らえ続けた。この子も一匹の虫を待ち続けて、静かに口を開けている。君と同じ、粘り強い狩人なんだ。"],["g","私……狩人だったんだ……。ちょっと、かっこいいかも……。"]],"m":"捕らえる","t":"語感ハンター錯覚法","k":93,"s":"ガチャの天井は破れなかったのに人間の天井は軽々と突き破られたひより"}],"kasa":[{"l":[["b","泣かないで。君の涙は、俺の胸の奥にだけ降る雨みたいだ。"],["b","これを君に。ハエトリソウだ。花言葉は、ずる賢い。"],["g","えっ、ずる賢い……？ていうかそれ、虫を食べる草だよね？"],["b","そう、その通りだ。この草の名が付いた伝説を知っているかい。"],["b","昔、この草は傘を盗まれた旅人の涙を見て、雨雲ごと閉じ込めようと決めた。その知恵を人は、ずる賢いと呼んだんだ。"],["b","つまり、ずる賢いとは、誰かの悲しみを先に捕まえてしまう優しさのことさ。"],["n","ハエトリソウが、葉をぱくりと閉じた。まるでうなずくように。"],["b","傘を盗った奴は、いつかこの草にそっと捕まる。君の傘は、もう泣かなくていい。"],["g","傘が泣かなくていいって、どういう理屈……でも、なんだか胸がじんとしてきた……"]],"m":"ずる賢い","t":"伝説捏造・優しさ変換法","k":93,"s":"雨雲を捕まえる草より先に傘を捕まえてほしかった"}],"report":[{"l":[["b","君の頬を濡らすのが涙だなんて、世界は少し不器用すぎるね。"],["b","これを受け取ってほしい。ハエトリソウだ。花言葉は、ずる賢い。"],["g","えっ、ずる賢いの？　しかも食虫植物だよね、これ。"],["b","そう、虫を食べる。だが考えてみてくれ。あの一閉じに、彼は約0.1秒をかける。"],["b","3時間かけた君のレポートは、約10800秒。彼なら、その10万8千倍の時間を使って一匹を捕らえる計算になる。"],["b","つまり、ずる賢さとは時間を支配する知恵だ。君は3時間分の知恵を、すでに頭に蓄えている。"],["b","消えたのは文章だけ。次は0.1秒で、もっとずる賢く書き上げられるさ。"],["n","ひよりは涙をぬぐい、手の中の緑の口をじっと見つめた。"],["g","0.1秒で書けるかは分かんないけど……なんか、書ける気がしてきた。"]],"m":"ずる賢い","t":"時間単位換算こじつけ","k":88,"s":"捕らえたのは虫より先に彼女の相槌"}],"sumaho":[{"l":[["b","君に涙は似合わないよ。涙を拭くのは、この花の役目だ。"],["n","蒼真は背中から、口をぱくぱく開閉する緑の植物を取り出した。"],["b","ハエトリソウ。花言葉は、捕らえる。"],["g","え、捕らえる？ これ虫を食べる草だよね？ 蒼真くん、なんで私に……"],["b","そう、こいつは逃がさない。落ちたスマホの破片も、君の笑顔を待つ俺の気持ちも、必ず捕らえる。"],["b","画面が割れたのは、世界が君の姿を細かく何百枚にも捕らえ直そうとした結果さ。今の君は、バキバキの画面の中に何百人もいる。"],["b","そして俺は、その全員を捕らえて離さない。この草が、閉じたら二度と開かない覚悟で獲物を抱くようにね。"],["g","何百人の私を……全部……。ちょっと、胸がきゅっと閉じた気がする……。"]],"m":"捕らえる","t":"画面割れ分身捕獲理論","k":93,"s":"捕まったのはハエより先に彼女の理性だった"}]},"okura":{"juken":[{"l":[["b","君の涙は、どんな宝石よりも重い。だから俺は、これを持って ギの花だよね……?"],["b","そうさ。ネギ坊主は一本に約二千の小花が集まって、あの丸い形をつくる。つまり愛嬌が二千個だ。"],["b","君が靴箱に入れた手紙は一通。でも隣の彼には、君の愛嬌二千個分が先に届いたんだ。一通で二千、効率は二千倍だよ。"],["b","間違えて届いたんじゃない。君の愛嬌が、宛先より先に走り出しただけさ。"],["g","二千倍……私の愛嬌、そんなに出てたんだ……。"]],"m":"愛嬌","t":"小花二千倍換算の法","k":78,"s":"二千は小花の数で愛嬌の数ではないし手紙も一通だよ"}],"yakisoba":[{"l":[["b","君の頬を伝うその雫、俺がそっと受け止めさせてもらうよ。"],["g","蒼真くん……え、なにそれ。ネギ？"],["b","ネギ坊主だ。ネギの花さ。花言葉は、くじけない心。"],["g","ネギって花咲くんだ……っていうか坊主って、丸いね。"],["n","蒼真は一歩も引かず、ネギ坊主をひよりの前に掲げた。"],["b","考えてごらん。麺は君の手からこぼれ落ちた。でも、くじけたのは麺であって君じゃない。"],["b","麺が君の代わりにくじけてくれた。だから君の心は、まだ折れていないんだ。"],["b","このネギ坊主を見ろ。細い茎の先で、風に揺れても折れずに丸く咲いている。君のことだよ。"],["g","麺が代わりに……私、折れてない……蒼真くん、それ、なんか効いてきたかも。"]],"m":"くじけない心","t":"くじけ身代わり理論","k":78,"s":"麺は身代わりの術を使い排水口へ消えた"}]},"artichoke":{"geki":[{"l":[["b","君に涙は似合わない。そう言いたくて、今日はこれを連れてきた。"],["n","蒼真が差し出したのは、花束ではなく、緑色の硬そうなつぼみだった。"],["b","アーティチョーク。花言葉は、独立だ。"],["g","えっ、これ食べるやつだよね。つぼみなのに、咲く前に食べられちゃうやつ。"],["b","そう、そこだ。伝説では、神に愛された娘が地上へ降ろされ、一人で立つことを選んだ。その姿がこの花になったと言われている。"],["b","つまり君の台詞も、台本から独立して旅立ったんだ。噛んだんじゃない。言葉が自分の足で歩き出したのさ。"],["b","しかもこの花は、咲く前に食べられてなお、人の心に残る。君の一言も、今夜みんなの記憶に残るよ。"],["g","台詞が独立……記憶に残る……なんか、そんな気がしてきた……"]],"m":"独立","t":"神話独立宣言法","k":93,"s":"独立したのは台詞だけで本人は食卓行きの運命"}],"loveletter":[{"l":[["b","君の頬を伝うその雫、俺の胸にまで届いてしまったよ。これを受け取ってくれ。"],["n","蒼真は背中に隠していた、緑色のごつごつした塊を差し出した。"],["b","アーティチョーク。花言葉は、傷つく恋。"],["g","えっ……傷つく恋って、今それ言う？　っていうかこれ、食べるやつだよね？"],["b","そう、食べられるつぼみだ。だが考えてみてくれ。恋は一生に何度も咲かない。君が傷ついたのは、たった一通の手紙のはずだろう？"],["b","けれど世界には八十億人がいる。その中で、君の手紙は隣の靴箱という、たった一つの奇跡に届いた。確率は八十億分の一だ。"],["b","傷つく恋とは、八十億分の一を引き当てた者だけが得られる、選ばれし恋の称号なんだよ。君は今日、世界で一人だけ傷ついた。誇っていい。"],["g","八十億分の一……私、選ばれてたの……？　なんか、そんな気がしてきた……"]],"m":"傷つく恋","t":"八十億分の一の奇跡論法","k":92,"s":"八十億分の一を引いたのは靴箱の隣人のほうだった"}],"save":[{"l":[["b","君の涙は、どんな宝石よりも静かに光るね。だから、これを受け取ってほしい。"],["n","蒼真は、つぼみの固い緑の花をひよりの前にそっと差し出した。"],["b","アーティチョーク。花言葉は、警告だ。"],["g","えっ……警告？ あたし今、普通に傷ついてるんだけど。"],["b","そう、このつぼみは食べられる。花は愛でるだけじゃない、人を養うためにも咲くんだ。"],["b","つまり警告とは、腹ごしらえをしてから次へ進めという、花からの優しい合図さ。"],["b","百時間分の君の情熱は、消えたんじゃない。次の百時間のために、空腹を知らせてくれたんだ。"],["g","食べられるつぼみ……いや待って……でも、なんか……お腹すいて aimo":{"akaten":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。ジャガイモの花だ。"],["g","ジャガイモの花って……これ、蒼真くんの家庭菜園のやつでしょ？"],["b","ああ、今朝まで畑で咲いていた。そして花言葉は、恩恵だ。"],["b","知っているか。この花は咲いている間、目立つ花の下で土の中に実を育てている。"],["b","恩恵とは、見えない場所で静かに育つものだ。君の赤点も同じさ。"],["b","追試という土の中で、君の学力は今、人知れず芋になろうとしている。"],["n","蒼真は花を差し出したまま、微動だにしない。"],["g","私の……学力が……芋に……なんか、育つ気がしてきた……"]],"m":"恩恵","t":"地下茎ポジティブ変換","k":78,"s":"花より先に収穫されそうな追試の私"}],"maegami":[{"l":[["b","君に涙は似合わないよ。涙を拭く前に、まずこれを受け取ってほしい。"],["g","え、これ……お花？　なんか見覚えある葉っぱなんだけど"],["b","ジャガイモの花だ。うちの家庭菜園で、今朝咲いたばかりのね。"],["g","家庭菜園って言っちゃった。しかも今朝咲いたって、ほぼ収穫前じゃん"],["b","花言葉は慈愛。見てごらん、この白い花びら。五枚が寄り添って、星の形をしている。"],["b","星は夜に見上げるものだ。つまり君が前髪を失った今、おでこは空に近づいた。星の慈愛を受け取るための特等席ができたんだよ。"],["n","蒼真は一切ふざけていない。花を差し出す手は、少し土がついている。"],["g","おでこが特等席……。ちょっと、そんな気がしてきたかも"]],"m":"慈愛","t":"星形おでこ受信理論","k":78,"s":"芋の花に慰められて前髪の短さを天体観測の利点にされる"}],"report":[{"l":[["b","君の頬を濡らすのは、雨粒だけで十分さ。涙の出番はもう終わりだよ。"],["g","蒼真くん……それ、ジャガイモの花？ なんで？"],["b","うちの家庭菜園で今朝咲いたばかりだ。採れたて、いや咲きたてを君に届けたくてね。"],["g","家庭菜園って言っちゃうんだ……"],["b","ジャガイモの花。その花言葉は、恩恵。おんけい。……聞こえるかい、この響き。"],["b","おん、けい。つまり音を、刑に処す。君の消えたレポートは、再起動の音に裁かれたんだ。"],["b","でも刑期を終えた音は、必ず恩に変わる。三時間の記憶は、君の指先に恩恵として残っているのさ。"],["n","ひよりは涙を拭うのも忘れ、手の中の小さな白い花をじっと見つめた。"],["g","なんか……今ちょっと、納得しかけてる……"]],"m":"恩恵","t":"音刑転恩の法","k":88,"s":"ジャガイモの花言葉より先に芋のほうを渡すべきだった"}],"sumaho":[{"l":[["b","夕陽が泣いてる君を照らすなんて、少し嫉妬するな。涙を拭くのは、俺の役目だ。"],["g","蒼真くん……スマホ、バキバキになっちゃったの。買ったばかりだったのに。"],["n","蒼真は無言で、土のついた白い花を一輪、そっと差し出した。"],["b","ジャガイモの花だ。花言葉は慈愛。うちの家庭菜園で、今朝咲いたばかりの一輪さ。"],["g","家庭菜園って……それ、おうちの畑から抜いてきたの？ しかもジャガイモ……"],["b","聞いてくれ。昔、飢えた人々を救ったのは、この土の下の実だった。伝説では、花は何も語らず、ただ地中の実に光を送り続けたという。"],["b","割れた画面も同じだ。ひび割れは、光が君の中へ届くための通り道。慈愛は、割れ目からこそ差し込むんだよ。"],["g","ひび割れが、光の通り道……って、ちょっと待って、なんか今、いい話に聞こえてきた……"]],"m":"慈愛","t":"飢饉伝説ひび割れ光路変換法","k":78,"s":"慈愛の花言葉より先に ジャガイモの花にはソラニンの毒がある 画面より心がバキバキになる"}]},"wata":{"geki":[{"l":[["b","夕陽が君の涙を宝石に変えてしまう前に、これを受け取ってほしい。"],["g","……え、これ、綿？ 花っていうか、もこもこなんだけど。"],["b","ワタだ。花言葉は繊細。まさに今の君にぴったりだよ。"],["g","繊細って……台詞を噛んだ私が、ただ弱いってこと？"],["b","違う。ワタは、あの白いふわふわを守るために、硬い殻の中でじっと耐えて咲く。"],["b","そして熟した瞬間、殻は自分から割れて、真っ白な本心を世界にさらけ出すんだ。"],["b","君が噛んだのは、殻が割れた瞬間だよ。繊細な想いが溢れて、言葉より先に心がこぼれたんだ。"],["n","蒼真は真顔のまま、ひよりの手に綿をそっと乗せた。"],["g","……なんか、このふわふわが急に尊く見えてきた……。"]],"m":"繊細","t":"殻割れ本心こぼれ理論","k":72,"s":"噛んだのを開花扱いにしたけど綿の実が弾けただけだよ"}],"loveletter":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ。ワタの花だ。"],["g","ワタ……? あの、綿って、コットンの? 花っていうか、ふわふわのやつだよね?"],["b","ああ。咲き終えたあとに、白くふくらむ綿だ。花言葉は繊細。君の心そのものさ。"],["n","蒼真はふわふわの綿を、そっと彼女の手のひらにのせた。"],["b","綿は繊細だからこそ、涙を吸える。タオルにも、ハンカチにも、枕にもなる。"],["b","ラブレターを隣の靴箱に入れたのも、君が繊細に気持ちを込めすぎて、手が一ミリ横にずれたからだ。"],["b","繊細な人の涙は、いつか誰かを包む綿になる。隣の靴箱の彼も、きっとふんわり受け止めてくれる。"],["g","私の涙、吸ってもらえるの……? なんか、ふわっとしてきた……"]],"m":"繊細","t":"綿の吸水性転用法","k":78,"s":"涙を吸った綿 ただの湿った綿"}],"save":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ、ひより。"],["n","蒼真が差し出したのは、白くふわふわした綿の実だった。"],["g","蒼真くん、これ……花っていうか、綿だよね？ もこもこしてるけど。"],["b","ああ、ワタだ。花言葉は優秀。そしてこのふわふわは、君の涙を受け止めるために咲いた。"],["b","伝説がある。昔、ワタは冬の寒さに震える人々を見て、自ら白い綿をまとって優秀さを証明したんだ。"],["b","百時間を失った君は、百時間かけて優秀なプレイヤーに育ったということだ。腕前は消えない。綿のように、ふわりと君の指に残っている。"],["g","私の指に……ふわりと……それ、ちょっといいかも……"]],"m":"優秀","t":"綿花由来のプレイヤー覚醒説","k":78,"s":"セーブデータより先に涙がもこもこに吸われた"}],"yakisoba":[{"l":[["b","君の頬を濡らす雫は、俺の胸にも降っているよ。ほら、これを受け取って。"],["n","蒼真が差し出したのは、ふわふわの白い綿だった。"],["g","蒼真くん、これ……花っていうか、綿だよね?"],["b","ワタさ。花言葉は優秀。君は今日、百八十グラムの麺を一瞬でシンクへ送り込んだ。"],["b","あの見事な落下速度、日本中のカップ焼きそば千万食に一人の逸材だ。"],["b","しかもこの綿は、君の涙を一滴残らず吸える。優秀なのは君の泣きっぷりと俺の選択、両方さ。"],["g","千万食に一人……涙も吸ってくれる……なんか、私、すごい気がしてきた……"]],"m":"優秀","t":"焼きそば千万食一人理論","k":78,"s":"千万食に一人の逸材なのに誰にも食べてもらえない"}]},"pineapple":{"baito":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ、パイナップルだ。"],["g","えっ、これ花じゃなくて果物でしょ？ さっき果物売り場で見たよ……"],["n","蒼真は少しも動じず、トゲトゲの冠を夕風に向けて掲げた。"],["b","花言葉は完全無欠。いいかい、この言葉の主語は君じゃない。注文を三回間違えた、あの三回のほうなんだ。"],["b","一回目は完全な間違い、二回目は無欠の間違い、三回目は完全無欠の間違い。君は間違いにおいて、一切の妥協をしなかった。"],["b","中途半端に正解するより、三度完璧に外す。その覚悟を、このパイナップルは王冠で称えているんだ。"],["g","私のミス、いつの間にか表彰されてる……王冠まで付いてるし……"]],"m":"完全無欠","t":"主語すり替え・失敗殿堂入り法","k":88,"s":"三回外す才能に王冠をかぶせた男"}],"kafun":[{"l":[["b","君の頬を濡らすのは、涙じゃなくて、まだ名前のない星のしずくだ。"],["b","受け取ってくれ。パイナップルだ。花言葉は、あなたは完璧。"],["g","蒼真くん、これ、果物売り場で買ったよね……。"],["b","ああ。花屋じゃ売れ残る完璧さも、果物売り場なら堂々と輝けるからね。"],["b","そして君は今、鼻も目も止まらない。つまり完璧に泣き、完璧にくしゃみをしている。"],["n","蒼真はひよりのくしゃみに合わせて、そっとうなずいた。"],["b","完璧とは欠点がないことじゃない。欠点まで全部そろっているってことさ。"],["b","花粉症の君も含めて、君という作品は、いま完成したんだ。"],["g","完成……そう言われると、なんか、そんな気がしてきた……。"]],"m":"あなたは完璧","t":"完璧フルコース理論","k":88,"s":"果物売り場の花言葉は 熟れ頃の口説き文句"}],"tanjoubi":[{"l":[["b","君の頬を濡らすのは、雨じゃない。……そう、君の優しさの余白だ。"],["n","蒼真は背中に隠していたパイナップルを、うやうやしく差し出した。"],["b","パイナップル。花言葉は、あなたは完璧。受け取ってほしい。"],["g","これ、どう見ても果物売り場の……花じゃなくない？"],["b","花も実も、根は同じ命さ。そして大事なのは時制だ。あなたは完璧、は今日の君だけの話じゃない。"],["b","今日、誰にも祝われなかった君も完璧。誕生日を迎える前の君も、これから迎える君も完璧。つまり君は、生まれた日から今日まで一日も欠けず完璧であり続けた。"],["b","そんな君を、俺は今日まで祝い損ねた。でも完璧な君に、祝われる日なんて最初から必要なかったんだ。……いや、祝わせてくれ。遅れて来た俺ごと。"],["g","なんか……よく分かんないけど、今、ちょっと救われかけてる……"]],"m":"あなたは完璧","t":"全時間軸完璧化理論","k":88,"s":"完璧な君に祝いは不要と言いつつ自分は遅刻の言い訳が完璧"}],"yakisoba":[{"l":[["b","夕焼けが綺麗な時間に、君の頬だけが雨模様だなんて、空も嫉妬してしまうよ。"],["g","蒼真くん……何それ。焼きそば、全部シンクに落としちゃったの……ぐすっ。"],["b","これを君に。パイナップルだ。花言葉は、完全無欠。"],["g","え、これ果物売り場で買ったでしょ。お花屋さんじゃなくて。"],["b","花も果実も、同じ植物さ。それより聞いてくれ。完全無欠とは、欠けたところが一つもないということ。麺が全部シンクに落ちた君は、湯切りを完全に成功させたとも言える。"],["b","麺を一本も残さず、完璧に湯から切り離した。中途半端な君じゃない。落とすなら全部落とす。それが完全無欠だ。"],["g","完璧に……全部……落とした……。それ、なんだか失敗じゃなくて偉業みたいに聞こえてきた……。"]],"m":"完全無欠","t":"完全失敗の完全肯定理論","k":88,"s":"落とし方まで完璧と言い張る力業　しかも本人は至って真顔"}]},"cactus":{"akaten":[{"l":[["b","君の涙は夕焼けより綺麗だけど、俺は君の笑顔のほうが見たいんだ。"],["n","蒼真は背中に隠していた小さな鉢を、そっと差し出した。"],["g","……サボテン？ 花束じゃなくて、鉢植えなの？"],["b","ああ。切り花は数日で枯れる。でもこいつは、君の隣で根を張って生きる。サボテンの花言葉は、燃える心だ。"],["g","燃える心……でも私、いま赤点で心が燃え尽きてるんだけど。"],["b","それだよ。燃える、は現在形じゃない。『燃えた』心、つまり君はもう全力で燃えた。赤点は、その燃焼の灰なんだ。"],["b","灰は肥料になる。追試の日、君の心は灰の中から、このサボテンみたいにまた立ち上がる。だから今日の涙は、点火前の火花さ。"],["g","灰が肥料……火花……なんか、追試いけそうな気がしてきた……"]],"m":"燃える心","t":"燃焼済み過去形再点火理論","k":88,"s":"赤点の灰を肥料にしたら追試の席にサボテンが座っていた"}],"geki":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。"],["n","蒼真が差し出したのは、小さな鉢植えのサボテンだった。"],["g","えっ、鉢ごと……？ 花束じゃないの、これ。"],["b","サボテンだ。花言葉は、燃える心。俺は君の心の火を信じている。"],["b","サボテンは砂漠の民にとって水の源だ。切れば水分が取れる命の植物なんだよ。"],["b","君が劇で噛んだ台詞は、乾いた客席に落ちた一滴の潤いだった。みんなの心はあの瞬間、確かに潤ったんだ。"],["b","燃える心は、人を潤す心だ。燃やしながら潤す。矛盾こそ君の魅力さ。"],["g","噛んだのに、潤して……燃えてたんだ、わたし……。"]],"m":"燃える心","t":"砂漠の水源すり替え術","k":88,"s":"燃えて潤す女 消防と水筒の二刀流"}],"save":[{"l":[["b","君に涙は似合わないよ。今日は俺から、枯れない贈り物を持ってきた。"],["g","蒼真くん……それ、サボテン？ しかも鉢ごと持ってきたの？"],["b","ああ。サボテン、花言葉は枯れない愛。鉢ごとなのは、愛に根っこがある証拠さ。"],["n","蒼真は鉢を両手で掲げ、ベンチの上にそっと置いた。"],["b","君は百時間、あのゲームを愛した。その愛は一時間も枯れずに百回続いた。"],["b","セーブデータは消えても、百時間分の愛は百時間分、君の中で今も青々と茂ってる。"],["g","百時間分の愛が、茂ってる……？"],["b","そうさ。しかもサボテンは水が少なくても育つ。涙は、もう十分だろ？"],["g","なんか、私、育ってきたかも……"]],"m":"枯れない愛","t":"愛の時間単位換算法","k":78,"s":"百時間が一時間百個に増えて鉢の中で分裂している"}],"tenkou":[{"l":[["b","君に涙は似合わないよ。これを受け取ってくれ。サボテンだ。"],["g","え、鉢植え？ 花束じゃなくて、重いんだけど……"],["b","花言葉は、枯れない愛。砂漠で何か月も水なしで生きる、あの伝説の植物さ。"],["b","サボテンは体に水を溜めて、乾いた土地でも愛を絶やさない。君の涙も、同じなんだ。"],["n","蒼真は真顔で、ひよりの目元の涙と鉢のトゲを交互に指さした。"],["b","流した涙は無駄じゃない。友情という砂漠で生き抜くための、大切な貯水なんだよ。"],["b","来月、彼女が遠くへ行っても、君の中の愛は枯れない。サボテンの名にかけて。"],["g","貯水……そっか。私の涙、ちゃんと役に立つんだ……"]],"m":"枯れない愛","t":"涙貯水タンク理論","k":78,"s":"涙の行き先がまさかの給水タンク"}]},"kochoran":{"kasa":[{"l":[["b","夕焼けより先に、君の涙が目に染みてしまったよ。これを受け取ってくれ。"],["n","蒼真が差し出したのは、白く大きな胡蝶蘭の鉢植えだった。"],["g","蒼真くん、これ、開店祝いで見るやつだよね。ラーメン屋の前とかの。"],["b","胡蝶蘭。花言葉は、純粋な愛だ。君の新しい門出を祝うのに、これ以上の花はない。"],["g","門出って、私、傘を盗られただけなんだけど。"],["b","胡蝶蘭は土に根を張らず、木の幹や空気から養分を受け取って咲く。つまり、愛は地面がなくても育つ。"],["b","君の傘を持ち去った誰かは、君の傘を雨宿りの場所に選んだ。あれは盗みじゃない。傘への、不器用で純粋な愛だ。"],["b","そして君は、その愛を黙って送り出した。君の優しさが、今日いちばん咲いている。"],["g","そっか……私の傘、誰かに愛されてるんだ……。"]],"m":"純粋な愛","t":"着生植物・愛情転生理論","k":88,"s":"傘は盗られたのに胡蝶蘭のほうは根こそぎ口説き落とされている"}],"maegami":[{"l":[["b","君に涙は似合わないよ。これを受け取ってほしい。"],["n","蒼真は、白く大きな胡蝶蘭の鉢をそっと差し出した。"],["g","えっ、胡蝶蘭？ これ、開店祝いでおなじみのやつだよね？"],["b","ああ。君の新しい前髪のグランドオープンに、これ以上ふさわしい花はない。"],["b","花言葉は、幸福が飛んでくる。いいかい、飛んでくる、だ。まだ着いていない。"],["b","つまり君の幸福は今、空の上。前髪が短くなった分、滑走路が広くなったんだよ。"],["g","滑走路……。じゃあ、おでこは幸せの着陸地点ってこと？"],["b","そう。君が顔を上げるたび、幸福は迷わず降りてこられる。"],["g","なんか……ちょっと、いい話に聞こえてきた……"]],"m":"幸福が飛んでくる","t":"着陸待ち時制読み替え","k":78,"s":"おでこに空港ができた日 管制塔は蒼真"}],"report":[{"l":[["b","泣きたい夜は、泣いていい。でも今日だけは、その涙を俺に預けてくれ。"],["g","蒼真くん……その花、まさか胡蝶蘭？ 開店祝いのやつ？"],["b","ああ、胡蝶蘭だ。花言葉は純粋な愛。君のレポートは、その愛を一身に受けていた。"],["g","えっ、レポートが愛されてたの？ 愛したのは私のほうじゃなくて？"],[" /* ひよりが素で戸惑う、ネガティブ・物騒な花言葉 */
const NEGW=/呪|復讐|死|恨|悪意|敵意|軽蔑|絶望|裏切|報復|失|嫉妬|憎|不幸|孤独|寂し|偽り|ごまかし|愚か|危険|中傷|不信|別離|別れ|情事|密会|疑惑|浮気|移り気|うぬぼれ|煩悩|策略|貪欲|戦い|当惑|悲し|悲哀|犠牲|見捨て|破れ|望みのない|不誠実|薄らぐ|離れゆく|報われぬ|いじめないで|触らないで|身が細る|尊敬しているが|過ぎ去った|人嫌い|警告|傷つく|捕らえる|ずる賢い|あなたを離さない|冷淡|気取り屋|おしゃべり|過度を慎め/;
/* 直前と同じ候補を避けて選ぶ */
const _last={};
function pickNR(key,arr){if(arr.length<2)return arr[0];let v;do{v=arr[rnd(arr.length)]}while(v===_last[key]);_last[key]=v;return v}
const fill=(s,o)=>s.replace(/\{f\}/g,o.f).replace(/\{m\}/g,o.m).replace(/\{c\}/g,o.c);
/* 生成台本があればそれを丸ごと使う。同じ組み合わせで複数あれば、直前と違うものを選ぶ */
const _lastS={};
function fromScripts(f,r){
  const a=SCRIPTS[f.id]&&r.id&&SCRIPTS[f.id][r.id];if(!a||!a.length)return null;
  const key=f.id+'|'+r.id;let i=rnd(a.length);if(a.length>1&&i===_lastS[key])i=(i+1)%a.length;_lastS[key]=i;
  const s=a[i],W={b:'boy',g:'girl',n:'narration'};
  return{lines:s.l.map(([w,t])=>({who:W[w]||'narration',text:t})),used_meaning:s.m,technique:s.t,kojitsuke:s.k,tsukkomi:s.s,mode:'script'};
}
function compose(f,r){
  const sc=fromScripts(f,r);if(sc)return sc;
  const d=f.d;
  const cb=COMBO[f.id]&&r.id&&COMBO[f.id][r.id];
  if(cb){
    const [m,tech,spin,close,fin,tsk]=cb, o={f:f.name,m,c:r.cause};
    const L=[];
    L.push({who:'boy',text:pickNR('open',POOL.open)});
    L.push({who:'narration',text:fill(pickNR('offer',f.odd?POOL.offerOdd:POOL.offer),o)});
    L.push({who:'boy',text:fill(pickNR('name',POOL.name),o)});
    if(f.odd&&Math.random()<.5)L.push({who:'girl',text:fill(pickNR('cfo',POOL.confuseOdd),o)});
    else if(NEGW.test(m))L.push({who:'girl',text:fill(pickNR('cf',POOL.confuse),o)});
    String(spin).split('｜').forEach(t=>t&&L.push({who:'boy',text:t}));
    if(close)L.push({who:'boy',text:close});
    L.push({who:'girl',text:fin});
    return{lines:L,used_meaning:m,technique:tech,kojitsuke:Math.min(100,d*17+rnd(14)),tsukkomi:tsk,mode:'fixed'};
  }
  const sp=pickNR('sp_'+f.id,SPINS[f.id]||[[f.m[0],'強行突破','『'+f.m[0]+'』。……つまり、そういうことだ。']]);
  const o={f:f.name,m:sp[0],c:r.cause};
  const L=[];
  L.push({who:'boy',text:pickNR('open',POOL.open)});
  L.push({who:'narration',text:fill(pickNR('offer',f.odd?POOL.offerOdd:POOL.offer),o)});
  L.push({who:'boy',text:fill(pickNR('name',POOL.name),o)});
  if(f.odd&&Math.random()<.5)L.push({who:'girl',text:fill(pickNR('cfo',POOL.confuseOdd),o)});
  else if(NEGW.test(sp[0]))L.push({who:'girl',text:fill(pickNR('cf',POOL.confuse),o)});
  else if(Math.random()<.4)L.push({who:'girl',text:pickNR('mild',POOL.mild)});
  L.push({who:'boy',text:fill(sp[2],o)});
  const usesCause=sp[2].includes('{c}');
  if(r.hook&&Math.random()<(usesCause?.4:.85))L.push({who:'boy',text:r.hook});
  if(Math.random()<.45)L.push({who:'narration',text:pickNR('aside',POOL.aside)});
  if(Math.random()<.7)L.push({who:'boy',text:pickNR('close',POOL.close)});
  L.push({who:'girl',text:pickNR('fin',POOL.fin)});
  const tsk=(f.odd&&Math.random()<.5)?fill(pickNR('tso',POOL.tskOdd),o):pickNR('ts'+d,POOL.tsk[d]);
  return{lines:L,used_meaning:sp[0],technique:sp[1],kojitsuke:Math.min(100,d*17+rnd(14)),tsukkomi:tsk,mode:'fixed'};
}

function initSample(){}
async function getScript(f,r){return compose(f,r)}

  return `<div class="card shake" id="card"><div class="face back">？</div><div class="face front${f.d===5?' ur':''}" style="--rc:${R.color}"><div class="rband"><span class="stars">${'★'.repeat(f.d)}</span><b>${R.label}</b><span>${R.name}</span></div><div class="cfl">${flowerSVG(f)}</div><div class="cname">${esc(f.name)}</div><div class="ckana">${esc(f.kana)}</div><div class="cm">${f.m.map(x=>'「'+esc(x)+'」').join('')}</div>${f.odd?'<div class="oddtag">色物</div>':''}</div></div>`;
}
const DLINE={1:'……うん、普通にいい花だ。',2:'……ちょっと雲行きが怪しい。',3:'……これは、苦しいぞ。',4:'……どう考えても、泣いている女の子に渡す花ではない。',5:'……これはもう、渡す前から事故だ。'};

/* ---------- game flow ---------- */
let reason=null,lastFlower=null,cur=null;
/* 泣いている理由は「山札」方式：48件を一巡するまで同じものは出さない。山の切れ目でも直前と同じにはしない */
let reasonBag=[];
function nextReason(){
  if(!reasonBag.length){
    reasonBag=RS.slice();
    for(let i=reasonBag.length-1;i>0;i--){const j=rnd(i+1);[reasonBag[i],reasonBag[j]]=[reasonBag[j],reasonBag[i]]}
    if(reason&&reasonBag.length>1&&reasonBag[reasonBag.length-1]===reason){const k=rnd(reasonBag.length-1);[reasonBag[k],reasonBag[reasonBag.length-1]]=[reasonBag[reasonBag.length-1],reasonBag[k]]}
  }
  return reasonBag.pop();
}
async function playIntro(t){
  await say('narration','放課後。夕暮れの公園。');
  await say('narration','ベンチの端で、ひよりが肩を震わせていた。');
  await say('girl',reason.line);
  await say('boy','……ひより。');
}
async function playChoices(t){
  const hank=['蒼真はポケットを探った。出てきたのは、使用済みのレシートだけだった。','差し出されたハンカチは、なぜかしっとり湿っていた。——昨日の雨だ。','ハンカチを出そうとして、蒼真は気づいた。持っているのはティッシュの空き袋だけだった。'];
  const quiet=['蒼真は黙って隣に立った。……三分後、ひよりが小声で言った。「なんか言ってよ」','そっとしておくことにした。夕日が沈む。蒼真の足がしびれる。','静寂が流れた。その間、蒼真は二回、カッコいいポーズを変えた。'];
  for(;;){
    const i=await choice(['花を贈る','ハンカチを差し出す','そっとしておく']);
    if(i===0)return;
    await say('narration',pick(i===1?hank:quiet));
  }
}
async function playGacha(t){
  let f;do{f=pick(FL)}while(f.id===lastFlower&&FL.length>1);
  lastFlower=f.id;
  const p={done:false,val:null};
  p.promise=getScript(f,reason).then(v=>{p.val=v;p.done=true});
  skipMode=false;syncBtns();
  await say('narration','彼は懐に手を入れた。そこには——',{noWait:true});
  chk(t);
  gachaEl.innerHTML=cardHTML(f);gachaEl.hidden=false;dim.classList.add('on');
  ui.lock=false;ui.gachaWait=true;ui.flip=false;
  const t0=performance.now();
  while(!ui.flip&&performance.now()-t0<1100){await sleep(40,t)}
  ui.gachaWait=false;ui.flip=false;
  $('#card').classList.remove('shake');$('#card').classList.add('flip');
  refocus();
  await sleep(750,t);
  const R=RR[f.d];
  await say('narration',`【${R.label}・${R.name}】${f.name}。`);
  await say('narration',`花言葉は——${f.m.map(x=>'「'+x+'」').join('')}。`);
  await say('narration',DLINE[f.d]+(f.odd?'……しかも色物枠だ。':''));
  gachaEl.hidden=true;dim.classList.remove('on');
  if(!p.done){
    tb.hidden=false;tbName.hidden=true;tb.classList.add('nar');tb.classList.remove('big');arrow.hidden=true;
    tbText.textContent='蒼真は花言葉の解釈をねじ曲げている・・・';
    while(!p.done){chk(t);await sleep(100,t)}
  }
  return{f,s:p.val};
}
async function playScript(t,g){
  const {f,s}=g;
  
  
  const boys=s.lines.map((l,i)=>[l,i]).filter(x=>x[0].who==='boy');
  let ri=boys.find(x=>x[0].text.includes(f.name));
  ri=ri?ri[1]:(boys[1]?boys[1][1]:(boys[0]?boys[0][1]:0));
  for(let i=0;i<s.lines.length;i++){
    const l=s.lines[i];
    if(i===ri){$('#hand').innerHTML=flowerInner(f);boyEl.classList.add('reach')}
    await say(l.who,l.text);
  }
  stage.classList.add('pink');girlEl.classList.remove('cry');girlEl.classList.add('happy');startSparks();
  await say('girl','ｽﾃｷ……',{big:true});
}
function showResult(g){
  const {f,s}=g;const R=RR[f.d];
  stats.tries++;stats.success++;store.set('hk-stats',stats);
  const boysT=s.lines.filter(l=>l.who==='boy').map(l=>l.text);
  const best=boysT.reduce((a,b)=>b.length>a.length?b:a,'');
  const z=zk[f.id]||{count:0};zk[f.id]={count:z.count+1,line:best,used:s.used_meaning,technique:s.technique};store.set('hk-zukan',zk);
  tb.hidden=true;ui.lock=true;
  resultEl.innerHTML=`<div class="rbox"><div class="stamp" id="stamp">成立</div>
  <div class="rfl">${flowerSVG(f)}<div class="nm">${esc(f.name)}</div><span class="chip" style="background:${R.color}">${R.label}・${R.name}</span></div>
  <div class="rinfo">
   <div class="quote">「${esc(s.used_meaning)}」</div>
   <div class="row"><span class="k">こじつけ技法</span><span>${esc(s.technique)}</span></div>
   <div class="row"><span class="k">こじつけ度</span><div class="bar"><i id="bk"></i><b>${s.kojitsuke}%</b></div></div>
   <div class="row"><span class="k">ｽﾃｷ度</span><div class="bar"><i class="s" id="bs"></i><b>100%</b></div></div>
   <div class="tsk">${esc(s.tsukkomi)}</div>
   <div class="total">通算成立回数　${stats.success}回</div>
   <div class="rbtns"><button type="button" id="rAgain">別の花で贈る</button><button type="button" id="rOther">別の状況で</button><button type="button" id="rZ">花図鑑</button></div>
  </div></div>`;
  resultEl.hidden=false;
  $('#rAgain').onclick=()=>run('again');
  $('#rOther').onclick=()=>run('intro');
  $('#rZ').onclick=()=>openZukan();
  setTimeout(()=>{const st=$('#stamp');if(st)st.classList.add('go');const a=$('#bk'),b=$('#bs');if(a)a.style.width=s.kojitsuke+'%';if(b)b.style.width='100%'},60);
  try{$('#rAgain').focus({preventScroll:true})}catch(e){}
}
async function run(from){
  const t=++token;poke();
  closeModal(true);resetStage();titleEl.hidden=true;ctrlEl.hidden=false;
  skipMode=false;autoMode=false;syncBtns();setMode(modeText());
  initSample();ui.lock=false;refocus();
  try{
    if(from==='intro'||!reason){reason=nextReason();await playIntro(t);await playChoices(t)}
    const g=await playGacha(t);
    await playScript(t,g);
    chk(t);showResult(g);
  }catch(e){
    if(!(e instanceof Abort)){console.error(e);if(t===token){tb.hidden=false;tbName.hidden=true;tbText.textContent='……何かがおかしい。タイトルに戻ってやり直そう。';}}
  }
}
function toTitle(){
  token++;poke();closeModal(true);resetStage();skipMode=false;autoMode=false;syncBtns();
  ctrlEl.hidden=true;titleEl.hidden=false;ui.lock=true;
  try{$('#mStart').focus({preventScroll:true})}catch(e){}
}

/* ---------- modals ---------- */
function closeModal(silent){
  const open=stage.querySelectorAll('.modal:not([hidden])');
  if(!open.length)return;
  const dz=$('#zDetail');
  if(!silent&&dz&&!dz.hidden&&$('#mZ').hidden===false){dz.hidden=true;return}
  open.forEach(m=>m.hidden=true);dz.hidden=true;
  if(!silent)refocus();
}
stage.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal()));
$('#zdBack').onclick=()=>{$('#zDetail').hidden=true};
function openLog(){

function openSettings(){
  const defs=[
    ['文字速度','speed',[[60,'ゆっくり'],[32,'ふつう'],[14,'はやい'],[0,'瞬間']],null],
    ['画面比率','ratio',[['auto','自動'],['169','16:9'],['43','4:3'],['916','縦長 9:16']],null],

    w.appendChild(sg);if(note){const p=document.createElement('p');p.textContent=note;w.appendChild(p)}

/* ---------- fit ---------- */
const DIM={'169':[1024,576],'43':[960,720],'916':[450,800]};
const TOUCH=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const TB_BASE={'169':38,'43':40,'916':40};
function fit(){
  const w=wrap.clientWidth||innerWidth,h=wrap.clientHeight||innerHeight;
  let r=cfg.ratio;if(!DIM[r])r=(w/h>=0.75)?'169':'916';
  let [W,H]=DIM[r];
  // 縦持ちのスマホは縦長の画面いっぱいに使う（幅は固定、高さだけ800〜1000で伸縮）
  if(r==='916')H=Math.round(Math.min(1000,Math.max(800,W*h/w)));
  stage.classList.remove('r169','r43','r916');stage.classList.add('r'+r);
  stage.style.width=W+'px';stage.style.height=H+'px';
  const k=Math.min(w/W,h/H);
  stage.style.transform=`translate(-50%,-50%) scale(${k})`;
  // 小さく表示されるとき・タッチ操作のときは、ボタンや小さい文字を大きくする
  const ui=Math.min(1.6,Math.max(TOUCH?1.25:1,0.85/k));
  stage.style.setProperty('--ui',ui.toFixed(3));
  stage.style.setProperty('--tbBottom',Math.round(TB_BASE[r]+(ui-1)*44)+'px');
}
addEventListener('resize',fit);addEventListener('orientationchange',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
fit();setTimeout(fit,100);
try{document.fonts&&document.fonts.ready&&document.fonts.ready.then(fit)}catch(e){}
initSample();
setMode(modeText());
try{$('#mStart').focus({preventScroll:true})}catch(e){}

/* ---------- スマホ向けの小物 ---------- */
(function(){
  if(TOUCH){const h=$('#hint');if(h)h.textContent='画面をタップで進行';}
  const fb=$('#mFull');
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  const canFS=document.fullscreenEnabled&&document.documentElement.requestFullscreen;
  if(fb&&TOUCH&&canFS&&!standalone){
    fb.hidden=false;
    fb.onclick=()=>{document.documentElement.requestFullscreen().catch(()=>{}).finally(()=>setTimeout(fit,150))};
    document.addEventListener('fullscreenchange',()=>{fb.hidden=!!document.fullscreenElement});
  }
})();
