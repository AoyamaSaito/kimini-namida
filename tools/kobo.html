<title>君に涙は 台本工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 上に操作帯（キュー・生成）、下に組み合わせごとの台本カード。ゲーム本体の夕暮れ色を薄めて作業用に */
:root{
  --bg:#f6f3fa; --panel:#ffffff; --fg:#231c33; --muted:#6c6380; --line:#ddd5ea;
  --accent:#a73f6b; --accent-fg:#ffffff; --ok:#2f7d4f; --ng:#9a3b3b; --new:#7a6a1e;
  --boy:#2f5f9a; --girl:#b03b6e;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122b;--panel:#211a3a;--fg:#efe9ff;--muted:#a99fcc;--line:#3a3160;--accent:#e0708f;--accent-fg:#1a1028;--ok:#7fd3a0;--ng:#f09a9a;--new:#e8d17a;--boy:#9fd0ff;--girl:#ffb8cf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17122b;--panel:#211a3a;--fg:#efe9ff;--muted:#a99fcc;--line:#3a3160;--accent:#e0708f;--accent-fg:#1a1028;--ok:#7fd3a0;--ng:#f09a9a;--new:#e8d17a;--boy:#9fd0ff;--girl:#ffb8cf;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:20px}
h1{font-family:var(--display);font-size:26px;margin:0}
h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--fg)}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;padding:0 2px;background:none;color:var(--muted);font-weight:400}
.chip.run{border-color:var(--accent);color:var(--accent)}
.msg{font-size:13px;color:var(--ng);min-height:1em}
.list{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.card h2{font-family:var(--display);font-size:17px;margin:0}
.meta{font-size:12px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid currentColor}
.badge.new{color:var(--new)} .badge.ok{color:var(--ok)} .badge.ng{color:var(--ng)}
.script{display:grid;gap:3px;font-family:var(--display);font-size:15px}
.ln{display:grid;grid-template-columns:4.2em 1fr;gap:8px;min-width:0}
.ln .w{font-family:var(--body);font-size:12px;font-weight:700;padding-top:3px}
.ln .t{overflow-wrap:anywhere}
.ln.boy .w{color:var(--boy)} .ln.girl .w{color:var(--girl)} .ln.narration .w{color:var(--muted)} .ln.narration .t{color:var(--muted)}
.ln.fixed .t{font-weight:700}
.tsk{border-left:3px solid var(--accent);padding-left:10px;font-family:var(--display)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .ok{color:var(--ok)} .acts .ng{color:var(--ng)}
.cands{display:grid;gap:6px}
.cands button.cand{text-align:left;font-family:var(--display);font-weight:500;border-style:dashed}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button.on{border-color:var(--accent);color:var(--accent)}
#q{font:inherit;flex:1 1 220px;min-width:0;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.badge.check{color:var(--accent)}
</style>

<div class="wrap">
  <h1>君に涙は 台本工房<small>AI版と同じプロンプトで、1組み合わせずつ台本を生成して貯める。採用したものをゲームに埋め込む。</small></h1>

  <section class="bar" aria-label="生成">
    <div class="status" id="status">準備中……</div>
    <div class="row">
      <select id="selF" aria-label="花"></select>
      <select id="selR" aria-label="泣いている理由"></select>
      <button type="button" id="bAdd">キューに追加</button>
      <select id="selN" aria-label="本数"><option>20</option><option selected>100</option><option>300</option></select><button type="button" id="bNext">未生成をキューへ</button>
    </div>
    <div class="chips" id="queue"></div>
    <div class="row">
      <button type="button" class="primary" id="bRun">キューを順に生成</button>
      <button type="button" id="bStop" disabled>止める</button>
      <button type="button" id="bTskNg">ボツのツッコミを順に作り直す</button>
      <span class="status" id="prog"></span>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <div class="row">
    <div class="filter" role="group" aria-label="表示">
      <button type="button" data-f="check" class="on">要確認</button>
      <button type="button" data-f="new">未判定</button>
      <button type="button" data-f="ok">採用</button>
      <button type="button" data-f="ng">ボツ</button>
      <button type="button" data-f="all">すべて</button>
    </div>
    <input id="q" type="search" placeholder="花や理由で絞り込み（例：ハナズオウ、プリン）" aria-label="絞り込み">
  </div>
  <div class="status" id="shown"></div>
  <div class="list" id="list"><div class="empty">読み込み中……</div></div>
  <button type="button" id="bMore" hidden>もっと見る</button>
</div>

function assign(f,r,extra){
  const ri=RS.findIndex(x=>x.id===r.id)+(extra||0)*7;
  const neg=f.m.filter(x=>NEGW.test(x)), worst=neg[0]||f.m[0], others=f.m.filter(x=>x!==worst);

  const angle=ANGLES[(ri+hash('a'+f.id))%ANGLES.length];
  return{meaning,angle};
}

  }
  if(lines.length<3)return null;
  let k=Number(o.kojitsuke);k=isFinite(k)?Math.max(0,Math.min(100,Math.round(k))):f.d*18;
  const rawT=String(o.tsukkomi||'');
  return{lines,used_meaning:String(o.used_meaning||f.m[0]),technique:String(o.technique||'強行突破'),kojitsuke:k,
    tsukkomi:(rawT&&!TSK_BAN.test(rawT))?tidyTsk(rawT).slice(0,80):TSK[f.d],tsukkomiBanned:!!rawT&&TSK_BAN.test(rawT)};
}
/* ===== 移植ここまで ===== */

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let queue=PILOT.map(x=>x.slice()), running=false, ctl=null, sample=null, db=null, docs=[], filt='check', limit=30;
const PAGE=30;
try{const q=JSON.parse(localStorage.getItem('kobo-queue')||'null');if(Array.isArray(q))queue=q.filter(x=>FLM[x[0]]&&RSM[x[1]])}catch(e){}
const saveQ=()=>{try{localStorage.setItem('kobo-queue',JSON.stringify(queue))}catch(e){}};

$('#selF').innerHTML=FL.map(f=>`<option value="${f.id}">★${f.d} ${esc(f.name)}${f.odd?'（色物）':''}</option>`).join('');
$('#selR').innerHTML=RS.map(r=>`<option value="${r.id}">${esc(r.text)}</option>`).join('');
/* キューは「残り○本・次は何か」の1行にまとめ、中身は開いたときだけ描く（300本のチップは読めない） */
let qOpen=false,qArm=false;
function drawQueue(){
  const head=queue.length?`キュー <b>${queue.length}</b> 本${running?'（生成中：'+esc(FLM[queue[0][0]].name)+' × '+esc(RSM[queue[0][1]].cause)+'）':'（次：'+esc(FLM[queue[0][0]].name)+' × '+esc(RSM[queue[0][1]].cause)+'）'}`:'キューは空。「未生成をキューへ」で積む。';
  $('#queue').innerHTML=`<span class="status">${head}</span>`+(queue.length?` <button type="button" id="bQOpen">${qOpen?'中身を閉じる':'中身を見る'}</button> <button type="button" id="bQClear"${running?' disabled':''}>キューを空にする</button>`:'')
    +(qOpen&&queue.length?`<div class="chips" style="margin-top:8px">${queue.slice(0,100).map(([f,r],i)=>`<span class="chip${running&&i===0?' run':''}">${esc(FLM[f].name)} × ${esc(RSM[r].cause)}<button type="button" data-i="${i}" aria-label="キューから外す">✕</button></span>`).join('')}${queue.length>100?`<span class="status">ほか ${queue.length-100} 本</span>`:''}</div>`:'');
  $('#bRun').disabled=running||!queue.length||!sample||!db;
  $('#bStop').disabled=!running;
}
$('#queue').addEventListener('click',e=>{
  if(e.target.id==='bQOpen'){qOpen=!qOpen;drawQueue();return}
  if(e.target.id==='bQClear'){if(running)return;
    if(!qArm){qArm=true;e.target.textContent='もう一度押すと空にする（生成済みの台本は消えない）';setTimeout(()=>{qArm=false;drawQueue()},4000);return}
    qArm=false;queue=[];saveQ();drawQueue();$('#msg').textContent='キューを空にした。';return}
  const b=e.target.closest('button[data-i]');if(!b)return;
  const i=+b.dataset.i;if(running&&i===0){$('#msg').textContent='今生成している分は外せない。「止める」を押してから外す。';return}
  queue.splice(i,1);saveQ();drawQueue()});
$('#bNext').onclick=()=>{
  if(running)return;
  const have=new Set(docs.filter(d=>/^artifact-v[3-6]$/.test(d.prompt)).map(d=>d.fid+'|'+d.rid)), inQ=new Set(queue.map(x=>x[0]+'|'+x[1]));
  const N=+$('#selN').value, order=FL.slice().sort((a,b)=>b.d-a.d||(a.odd?1:0)-(b.odd?1:0));
  let n=0;
  /* 花を混ぜて積む：1巡目は各花に1本ずつ、2巡目も1本ずつ……（理由は花ごとにずらす） */
  outer:for(let k=0;k<RS.length;k++){for(const f of order){const r=RS[(k+hash(f.id))%RS.length],key=f.id+'|'+r.id;
    if(!have.has(key)&&!inQ.has(key)){queue.push([f.id,r.id]);inQ.add(key);if(++n>=N)break outer}}}
  saveQ();drawQueue();$('#msg').textContent=n?`未生成の組み合わせを${n}本キューに入れた（★の高い花から、花を混ぜて）。`:'未生成の組み合わせはもうない。';
};
$('#bAdd').onclick=()=>{queue.push([$('#selF').value,$('#selR').value]);saveQ();drawQueue()};

function status(){
  const n=docs.length,ok=docs.filter(d=>d.status==='ok').length,ng=docs.filter(d=>d.status==='ng').length,ck=docs.filter(d=>d.check).length;
  $('#status').innerHTML=(!sample?'Claude を呼べない環境です（claude.ai で開いてください）。':!db?'保存先に接続できません。':'')+` 台本 <b>${n}</b> 本（採用 <b>${ok}</b>・ボツ <b>${ng}</b>・未判定 <b>${n-ok-ng}</b>）／要確認 <b>${ck}</b> 本`;
}
function cardHTML(d){
  const f=FLM[d.fid]||{name:d.fid,d:0},r=RSM[d.rid]||{cause:d.rid,line:''};
  const lines=[{who:'girl',text:r.line,fixed:1}].concat(d.lines||[]).concat([{who:'girl',text:'ｽﾃｷ……',fixed:1}]);
  const W={boy:'蒼真',girl:'ひより',narration:'地の文'};
  return `<article class="card" data-id="${esc(d._id)}">
  <header><h2>${esc(f.name)} × ${esc(r.cause)}</h2><span class="meta">${RR[f.d]||''}　『${esc(d.used_meaning)}』／${esc(d.technique)}／こじつけ度 ${d.kojitsuke}%${d.angle?'／切り口：'+esc(d.angle):''}</span>
  <span class="badge ${d.status||'new'}">${d.status==='ok'?'採用':d.status==='ng'?'ボツ':'未判定'}</span>${d.check?`<span class="badge check">要確認${d.checkNote?'：'+esc(d.checkNote):''}</span>`:''}</header>
  <div class="script">${lines.map(l=>`<div class="ln ${l.who}${l.fixed?' fixed':''}"><span class="w">${W[l.who]}</span><span class="t">${esc(l.text)}</span></div>`).join('')}</div>
  <div class="tsk">${esc(d.tsukkomi)}${d.tsukkomiOld?'<div class="meta">前のツッコミ：'+esc(d.tsukkomiOld)+'</div>':''}${d.tsukkomiBanned?'<span class="meta">（禁止型だったため定型に差し替え）</span>':''}</div>
  ${(d.cands&&d.cands.length)?`<div class="cands"><span class="meta">候補（押すと差し替えて採用）</span>${d.cands.map((c,i)=>`<button type="button" class="cand" data-act="pick" data-i="${i}">${esc(c)}</button>`).join('')}</div>`:''}
  <div class="acts"><button type="button" class="ok" data-act="ok">採用</button><button type="button" class="ng" data-act="ng">ボツ</button><button type="button" data-act="tsk"${busy[d._id]?' disabled':''}>${busy[d._id]==='tsk'?'作り直している……':'ツッコミだけ作り直す'}</button><button type="button" data-act="cand"${busy[d._id]?' disabled':''}>${busy[d._id]==='cand'?'候補を考えている……':'候補を5つ出す'}</button><button type="button" data-act="again">同じ組み合わせをもう1本</button></div>
  </article>`;
}
/* 1000本超を毎回全部描くと重いので、絞り込んだ上で PAGE 枚ずつ描く。保存のたびの再描画もまとめる */
let drawT=0,lastHtml='';
const busy={};
function drawList(){clearTimeout(drawT);drawT=setTimeout(drawNow,250)}
function drawNow(){
  status();
  const q=$('#q').value.trim();
  const v=docs.filter(d=>{
    if(filt==='check'?!d.check:filt!=='all'&&(d.status||'new')!==filt)return false;
    if(!q)return true;
    const f=FLM[d.fid]||{},r=RSM[d.rid]||{};
    return [f.name,f.kana,r.cause,r.text,d.fid,d.rid].some(s=>s&&String(s).includes(q));
  }).sort((a,b)=>(a.fid+a.rid).localeCompare(b.fid+b.rid)||a.createdAt-b.createdAt);
  const html=v.length?v.slice(0,limit).map(cardHTML).join(''):`<div class="empty">${filt==='check'&&!q?'要確認の台本はない。':'該当する台本はない。'}</div>`;
  /* 見えている中身が変わっていなければ描き直さない（生成中に押したボタンやスクロールを潰さない） */
  if(html!==lastHtml){$('#list').innerHTML=html;lastHtml=html}
  $('#shown').textContent=v.length?`${v.length} 本中 ${Math.min(limit,v.length)} 本を表示`:'';
  $('#bMore').hidden=v.length<=limit;
}
document.querySelector('.filter').addEventListener('click',e=>{const b=e.target.closest('button[data-f]');if(!b)return;filt=b.dataset.f;limit=PAGE;document.querySelectorAll('.filter button').forEach(x=>x.classList.toggle('on',x===b));drawNow()});
$('#q').addEventListener('input',()=>{limit=PAGE;drawList()});
$('#bMore').onclick=()=>{limit+=PAGE;drawNow()};
$('#list').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-act]');if(!b||!db)return;
  const id=b.closest('.card').dataset.id,d=docs.find(x=>x._id===id);if(!d)return;
  if(b.dataset.act==='again'){queue.splice(running?1:0,0,[d.fid,d.rid]);saveQ();drawQueue();$('#msg').textContent=running?'生成中の次に作るよう、キューに入れた。':'キューの先頭に入れた。「キューを順に生成」で作る。';return}
  if(b.dataset.act==='pick'){const c=(d.cands||[])[+b.dataset.i];if(!c)return;b.disabled=true;
    try{await db.collection('scripts').doc(id).update({tsukkomi:c,tsukkomiOld:d.tsukkomiOld||d.tsukkomi,cands:[],status:'ok',check:false})}catch(err){$('#msg').textContent='保存できなかった（'+(err&&err.code||'不明')+'）。'}
    return}
  if(b.dataset.act==='cand'){if(busy[id])return;busy[id]='cand';drawNow();$('#msg').textContent='';
    try{const f=FLM[d.fid],r=RSM[d.rid];
      const o=await sample.json(buildCandPrompt(f,r,d),{modelTier:'default',cache:false});
      const cs=(o&&Array.isArray(o.candidates)?o.candidates:[]).map(x=>tidyTsk(x).slice(0,80)).filter(x=>x&&!TSK_BAN.test(x)).slice(0,5);
      if(!cs.length)throw{code:'bad_shape'};
      await db.collection('scripts').doc(id).update({cands:cs});$('#msg').textContent='候補を出した。カードの候補を押すと差し替わる。'}
    catch(err){$('#msg').textContent=(CODE[err&&err.code]||'うまくいかなかった（'+(err&&err.code||'不明')+'）。')}
    delete busy[id];drawNow();return}
  if(b.dataset.act==='tsk'){if(busy[id])return;busy[id]='tsk';drawNow();$('#msg').textContent='';
    try{await redoTsk(d,true);$('#msg').textContent='ツッコミを作り直した。'}catch(err){$('#msg').textContent=(CODE[err&&err.code]||'うまくいかなかった（'+(err&&err.code||'不明')+'）。')}
    delete busy[id];drawNow();return}
  if(b.dataset.act==='pick'||b.dataset.act==='ok'||b.dataset.act==='ng')$('#msg').textContent='';
  b.disabled=true;
  try{await db.collection('scripts').doc(id).update({status:b.dataset.act,check:false})}catch(err){$('#msg').textContent='保存できなかった（'+(err&&err.code||'不明')+'）。'}
  b.disabled=false;
});

async function generateOne(fid,rid){
  const f=FLM[fid],r=RSM[rid];
  const a=assign(f,r,docs.filter(d=>d.fid===fid&&d.rid===rid&&/^artifact-v[3-6]$/.test(d.prompt)).length);
  /* 返事が3分来なければ打ち切ってやり直す（固まったまま止まって見えるのを防ぐ） */
  ctl=new AbortController();let timedOut=false;const tm=setTimeout(()=>{timedOut=true;ctl.abort()},180000);
  let o;try{o=await sample.json(buildPrompt(f,r,a),{modelTier:'default',cache:false,signal:ctl.signal})}
  catch(e){if(timedOut)throw{code:'timeout'};throw e}finally{clearTimeout(tm)}
  const v=validate(o,f);
  if(!v)throw{code:'bad_shape'};
  const now=Date.now();
  await db.collection('scripts').doc(`${fid}__${rid}__${now}`).set({fid,rid,...v,status:'new',createdAt:now,prompt:'artifact-v6',assignedMeaning:a.meaning,angle:a.angle});
}
async function redoTsk(d,single){
  const f=FLM[d.fid],r=RSM[d.rid];let signal;if(!single){ctl=new AbortController();signal=ctl.signal}
  const o=await sample.json(buildTskPrompt(f,r,d),{modelTier:'default',cache:false,signal});
  const t=String(o&&o.tsukkomi||'').trim();
  if(!t||TSK_BAN.test(t))throw{code:'bad_shape'};
  await db.collection('scripts').doc(d._id).update({tsukkomi:tidyTsk(t).slice(0,80),tsukkomiOld:d.tsukkomiOld||d.tsukkomi,tsukkomiRev:(d.tsukkomiRev||0)+1,status:'new'});
}
const CODE={not_granted:'Claude の利用が許可されなかった。',rate_limited:'混み合っているか利用上限に達した。少し待ってから押し直してほしい。',invalid_json:'返答がJSONにならなかった。押し直せば作り直す。',bad_shape:'返答の形式が崩れていた。押し直せば作り直す。',refused:'この組み合わせは断られた。',cancelled:'止めた。',session_expired:'ログインし直してほしい。'};
$('#bRun').onclick=async()=>{
  if(running||!sample||!db)return;
  running=true;$('#msg').textContent='';drawQueue();
  /* 返答の形崩れ（invalid_json / bad_shape）は同じ組み合わせを2回まで作り直し、それでも駄目ならキューの末尾に回して先へ進む。
     混雑（rate_limited）は少し待って同じものをやり直す。それ以外のエラーだけ止める */
  let done=0,skipped=0,tries=0,waits=0;const skipN=new Map();
  const nap=ms=>new Promise(r=>setTimeout(r,ms));
  while(running&&queue.length){
    const [fid,rid]=queue[0];
    $('#prog').textContent=`生成中：${FLM[fid].name} × ${RSM[rid].cause}（Claude が考えている……）${tries?'　作り直し'+tries+'回目':''}`;
    try{await generateOne(fid,rid);queue.shift();saveQ();done++;tries=0;waits=0;drawQueue()}
    catch(e){
      const c=e&&e.code;
      if(!running||c==='cancelled')break;
      if(c==='invalid_json'||c==='bad_shape'){
        if(++tries<=2)continue;
        /* 2周しても駄目な組み合わせはキューから外す（崩れ続ける組み合わせで使用量を食い続けないため） */
        const key=fid+'|'+rid,n=(skipN.get(key)||0)+1;skipN.set(key,n);
        const it=queue.shift();if(n<2)queue.push(it);saveQ();skipped++;tries=0;drawQueue();continue}
      if(c==='rate_limited'&&++waits<=5){
        /* 裏タブでは短いタイマーを何十回も重ねると極端に間引かれるので、1分を一度で待つ */
        const until=new Date(Date.now()+60000);
        $('#prog').textContent=`混み合っているので ${until.toLocaleTimeString()} まで待ってからやり直す（${waits}/5回目）`;
        await nap(60000);continue}
      if(c==='timeout'){if(++tries<=2)continue;const it=queue.shift();queue.push(it);saveQ();skipped++;tries=0;drawQueue();continue}
      $('#msg').textContent=(CODE[c]||'うまくいかなかった（'+(c||'不明')+'）。')+' キューはそのまま残してある。';break}
  }
  running=false;ctl=null;$('#prog').textContent=done||skipped?`${done} 本できた。${skipped?`返事の形が崩れて ${skipped} 回飛ばした（後ろに回すか、2周駄目なら外した）。`:''}`:'';drawQueue();
};
$('#bTskNg').onclick=async()=>{
  if(running||!sample||!db)return;
  const targets=docs.filter(d=>d.status==='ng');if(!targets.length){$('#msg').textContent='ボツの台本はない。';return}
  running=true;drawQueue();$('#msg').textContent='';let done=0;
  for(const d of targets){if(!running)break;
    $('#prog').textContent=`ツッコミ作り直し中：${done+1}/${targets.length}（${FLM[d.fid].name} × ${RSM[d.rid].cause}）`;
    try{await redoTsk(d);done++}catch(e){$('#msg').textContent=(CODE[e&&e.code]||'うまくいかなかった（'+(e&&e.code||'不明')+'）。')+' 残りはボツのまま。';break}}
  running=false;ctl=null;$('#prog').textContent=done?`${done} 本のツッコミを作り直した（未判定に戻してある）。`:'';drawQueue();
};
$('#bStop').onclick=()=>{running=false;if(ctl)ctl.abort()};

drawQueue();
(async()=>{
  const C=window.claude;
  sample=C&&C.use?await C.use('sample'):null;
  db=C&&C.use?await C.use('db'):null;
  drawQueue();status();
  if(db){
    db.collection('scripts').onSnapshot(snap=>{docs=snap.docs.map(x=>({_id:x.id,...x.data()}));drawList()},err=>{$('#msg').textContent='保存先との接続が切れた（'+err.code+'）。再読み込みしてほしい。'});
  }
})();
</script>
